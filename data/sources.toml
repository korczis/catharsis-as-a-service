appraisal = { en = "Supports the claims that CBT effects were large against control conditions (g = 0.75 to 0.88), smaller after adjustment for publication bias, and small to moderate against care as usual or pill placebo. Only 17.4% of trials were rated high quality, and most anxiety trials used waiting-list controls.", cs = "Podporuje tvrzení, že účinky KBT byly oproti kontrolním podmínkám velké (g = 0,75 až 0,88), po korekci na publikační zkreslení menší a oproti běžné péči nebo placebu malé až střední. Jen 17,4 % studií bylo hodnoceno jako vysoce kvalitní a většina studií úzkostných poruch používala kontrolu čekací listinou." }
