appraisal = { en = "Supports historical claims that Durkheim described collective religious ritual as producing heightened shared emotion and renewed attachment to the group. It makes no measured claim, and its ethnographic sources are dated.", cs = "Podporuje historická tvrzení, že Durkheim popsal kolektivní náboženský rituál jako zdroj zesílených sdílených emocí a obnovené vazby ke skupině. Neobsahuje měřená tvrzení a jeho etnografické prameny jsou zastaralé." }
