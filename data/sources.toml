level = "C"
population = { en = "1,085 suicidal callers to eight US crisis centres assessed during calls, 380 of whom completed follow-up within three weeks.", cs = "1 085 volajících se sebevražednými myšlenkami do osmi krizových center v USA hodnocených během hovoru, z nichž 380 se zúčastnilo sledování do tří týdnů." }
