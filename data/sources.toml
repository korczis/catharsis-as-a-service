[sources.egger-1997]
design = "cross-sectional"
level = "D"
population = { en = "Eight pairs of meta-analyses and large trials, plus funnel plots from 37 journal meta-analyses and 38 Cochrane reviews.", cs = "Osm dvojic metaanalýz a velkých studií a trychtýřové grafy z 37 časopiseckých metaanalýz a 38 Cochraneových přehledů." }
appraisal = { en = "Supports the claims that funnel-plot asymmetry was associated with meta-analyses later contradicted by large trials and was present in a sizeable minority of published meta-analyses. Asymmetry is consistent with publication bias but has other possible causes, and the medical sample may not represent psychology.", cs = "Podporuje tvrzení, že asymetrie trychtýřového grafu souvisela s metaanalýzami, které později vyvrátily velké studie, a že se vyskytovala v nezanedbatelné menšině publikovaných metaanalýz. Asymetrie je v souladu s publikačním zkreslením, má však i jiné možné příčiny a lékařský vzorek nemusí odpovídat psychologii." }
last_reviewed = 2026-09-14
review_due = 2027-09-14

