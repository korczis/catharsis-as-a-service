appraisal = { en = "Supports the claim that synchronous activity increased later cooperation, including under personal cost. Short laboratory tasks; long-term effects were not studied.", cs = "Podporuje tvrzení, že synchronní činnost zvyšovala následnou spolupráci, i když vyžadovala osobní oběť. Krátké laboratorní úlohy; dlouhodobé účinky nebyly zkoumány." }
