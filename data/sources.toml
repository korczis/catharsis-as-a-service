[sources.strogatz-2000]
design = "review"
level = "D"
population = { en = "Not applicable: a narrative review of 25 years of mathematical research on the Kuramoto model.", cs = "Neuplatňuje se: narativní přehled 25 let matematického výzkumu Kuramotova modelu." }
appraisal = { en = "Supports the claim that, in the Kuramoto model, oscillators with natural frequencies drawn from a distribution undergo a transition when coupling exceeds a threshold, with some synchronizing and others remaining incoherent. A mathematical review; it offers no evidence about human synchrony or social bonding.", cs = "Podporuje tvrzení, že v Kuramotově modelu procházejí oscilátory s vlastními frekvencemi vybranými z rozdělení přechodem, když vazba překročí práh: část se synchronizuje a zbytek zůstává nekoherentní. Matematický přehled; neposkytuje doklady o synchronii lidí ani o sociální sounáležitosti." }
last_reviewed = 2026-09-14
review_due = 2027-09-14

[sources.higgins-thompson-2002]
