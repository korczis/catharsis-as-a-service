# Appraisal of every reference in data/references.toml. Bibliographic facts live in references.toml
# (checked against Crossref); this file holds editorial judgement, which is dated and must be re-reviewed.
#
# Designs were checked against the published abstracts (Crossref, OpenAlex or PubMed) on 2026-09-14.
# Where no abstract was retrievable, the appraisal says so and no sample size is stated.
# Level A is reserved for syntheses of controlled studies; syntheses of correlational studies are
# graded by the design of the studies they pool.

# ── Classical, historical and reference works ─────────────────────────────────────────────────────

[sources.aristotle-poetics]
design = "classical"
level = "E"
population = { en = "Not applicable: a classical treatise on tragedy and poetics.", cs = "Neuplatňuje se: klasický spis o tragédii a poetice." }
appraisal = { en = "Supports historical claims about where the term katharsis entered aesthetics. It makes no empirical claim, and its meaning is contested by commentators.", cs = "Podporuje historická tvrzení o tom, jak pojem katharsis vstoupil do estetiky. Neobsahuje empirické tvrzení a jeho význam komentátoři dodnes zpochybňují." }
last_reviewed = 2026-09-14
review_due = 2028-09-13

[sources.breuer-freud-1895]
design = "book"
level = "E"
population = { en = "Clinical case descriptions of patients treated with the cathartic method.", cs = "Klinické kazuistiky pacientek léčených katarzní metodou." }
appraisal = { en = "Supports historical claims about the cathartic method and abreaction. Uncontrolled case reports cannot show whether the method was effective.", cs = "Podporuje historická tvrzení o katarzní metodě a abreakci. Nekontrolované kazuistiky nemohou ukázat, zda byla metoda účinná." }
last_reviewed = 2026-09-14
review_due = 2028-09-13

[sources.picard-1997]
design = "book"
level = "E"
population = { en = "Not applicable: a monograph defining the field of affective computing.", cs = "Neuplatňuje se: monografie vymezující obor afektivní informatiky." }
appraisal = { en = "Supports the historical claim that affective computing was framed as a research field in 1997. It is not evidence that emotion can be validly inferred from signals.", cs = "Podporuje historické tvrzení, že afektivní informatika byla jako výzkumný obor vymezena v roce 1997. Není dokladem, že emoce lze ze signálů validně odvodit." }
last_reviewed = 2026-09-14
review_due = 2028-09-13

[sources.boucsein-2012]
design = "book"
level = "E"
population = { en = "Not applicable: a methodological handbook on electrodermal activity.", cs = "Neuplatňuje se: metodologická příručka o elektrodermální aktivitě." }
appraisal = { en = "Supports technical statements about how electrodermal activity is recorded and what it indexes. Expert synthesis, not a test of any single claim.", cs = "Podporuje technická tvrzení o tom, jak se elektrodermální aktivita zaznamenává a co indexuje. Jde o expertní syntézu, nikoli o test konkrétního tvrzení." }
last_reviewed = 2026-09-14
review_due = 2028-09-13

# ── Venting, anger and emotion regulation ─────────────────────────────────────────────────────────

[sources.bushman-baumeister-stack-1999]
design = "experiment"
level = "B"
population = { en = "Participants in two laboratory studies exposed to pro- or anti-catharsis messages and then to provocation.", cs = "Účastníci dvou laboratorních studií vystavení zprávám pro katarzi nebo proti ní a poté provokaci." }
appraisal = { en = "Supports the claim that belief in catharsis increased the wish to vent and that venting was followed by more laboratory aggression. Brief provocations and laboratory aggression measures limit generalisation.", cs = "Podporuje tvrzení, že víra v katarzi zvyšovala chuť ventilovat a že po ventilaci následovala vyšší laboratorní agrese. Krátké provokace a laboratorní měřítka agrese omezují zobecnění." }
last_reviewed = 2026-09-14
review_due = 2027-09-14

[sources.bushman-2002]
design = "experiment"
level = "B"
population = { en = "Angered participants assigned to rumination, distraction or no punching-bag control conditions.", cs = "Rozhněvaní účastníci přidělení do podmínek ruminace, rozptýlení nebo kontroly bez boxovacího pytle." }
appraisal = { en = "Supports the claim that hitting a punching bag while ruminating produced more anger and aggression than doing nothing. A single laboratory experiment with a noise-blast aggression measure.", cs = "Podporuje tvrzení, že bušení do pytle při ruminaci vedlo k většímu hněvu a agresi než nečinnost. Jde o jediný laboratorní experiment s měřením agrese pomocí hlukových podnětů." }
last_reviewed = 2026-09-14
review_due = 2027-09-14

[sources.kjaervik-bushman-2024]
design = "meta-analysis"
level = "A"
population = { en = "154 studies with 184 independent samples and 10,189 participants, including students, non-students and offenders.", cs = "154 studií se 184 nezávislými vzorky a 10 189 účastníky, včetně studentů, nestudentů a pachatelů trestné činnosti." }
appraisal = { en = "Supports the claims that arousal-decreasing activities reduced anger and aggression and that arousal-increasing activities were ineffective overall. The arousal-increasing studies were heterogeneous, so conclusions about specific activities such as running are less certain.", cs = "Podporuje tvrzení, že aktivity snižující vzrušení zmírňovaly hněv a agresi a že aktivity vzrušení zvyšující byly celkově neúčinné. Studie aktivit zvyšujících vzrušení byly heterogenní, takže závěry o konkrétních aktivitách, jako je běh, jsou méně jisté." }
last_reviewed = 2026-09-14
review_due = 2027-09-14

[sources.gross-1998]
design = "review"
level = "D"
population = { en = "Not applicable: an integrative review proposing the process model of emotion regulation.", cs = "Neuplatňuje se: integrativní přehled, který navrhuje procesový model regulace emocí." }
appraisal = { en = "Supports definitions and the five-point process model used across the library. A conceptual framework, not a test of which strategies work.", cs = "Podporuje definice a pětibodový procesový model používaný v celé knihovně. Jde o koncepční rámec, nikoli o test účinnosti strategií." }
last_reviewed = 2026-09-14
review_due = 2027-09-14

[sources.gross-john-2003]
design = "cross-sectional"
level = "D"
population = { en = "Five correlational studies of individual differences in habitual reappraisal and suppression.", cs = "Pět korelačních studií individuálních rozdílů v obvyklém používání přehodnocení a potlačení." }
appraisal = { en = "Supports the claim that habitual reappraisal is associated with more positive and less negative emotion and better well-being than habitual suppression. Correlational data cannot show that the strategy causes these outcomes.", cs = "Podporuje tvrzení, že obvyklé přehodnocování je spojeno s více pozitivními a méně negativními emocemi a lepší pohodou než obvyklé potlačování. Korelační data nemohou ukázat, že strategie tyto výsledky způsobuje." }
last_reviewed = 2026-09-14
review_due = 2027-09-14

[sources.webb-2012]
design = "meta-analysis"
level = "A"
population = { en = "306 experimental comparisons of instructed emotion regulation strategies.", cs = "306 experimentálních srovnání instruovaných strategií regulace emocí." }
appraisal = { en = "Supports the claims that cognitive change had a small-to-medium effect, distraction was effective, concentration on feelings was not, and suppressing the experience of emotion was ineffective. Effects come from short laboratory inductions and vary with moderators.", cs = "Podporuje tvrzení, že kognitivní změna měla malý až střední účinek, rozptýlení bylo účinné, soustředění na pocity nikoli a potlačování prožitku emoce neúčinné. Účinky pocházejí z krátkých laboratorních indukcí a liší se podle moderátorů." }
last_reviewed = 2026-09-14
review_due = 2027-09-14

[sources.aldao-2010]
design = "meta-analysis"
level = "D"
population = { en = "241 effect sizes from 114 studies of dispositional emotion regulation and symptoms of anxiety, depression, eating and substance-related disorders.", cs = "241 velikostí účinku ze 114 studií dispoziční regulace emocí a symptomů úzkosti, deprese, poruch příjmu potravy a poruch souvisejících s návykovými látkami." }
appraisal = { en = "Supports the claim that rumination shows the largest association with symptoms, with avoidance and suppression also associated. It pools correlational studies, so it is graded D and cannot establish causation.", cs = "Podporuje tvrzení, že ruminace vykazuje nejsilnější souvislost se symptomy a že se symptomy souvisí také vyhýbání a potlačování. Shrnuje korelační studie, proto má úroveň D a nemůže doložit kauzalitu." }
last_reviewed = 2026-09-14
review_due = 2027-09-14

[sources.uusberg-2023]
design = "theory"
level = "D"
population = { en = "Not applicable: a theoretical paper expanding the reAppraisal framework.", cs = "Neuplatňuje se: teoretická práce rozšiřující rámec reAppraisal." }
appraisal = { en = "Supports the conceptual claim that reappraisal is a family of tactics (reconstrual and repurposing, object- and meta-level, decommitment and commitment). It proposes a map; it does not test the tactics' effectiveness.", cs = "Podporuje koncepční tvrzení, že přehodnocení je rodinou taktik (rekonstrukce a přeformulování cílů, objektová a metaúroveň, uvolnění a přijetí závazku). Navrhuje mapu, účinnost taktik netestuje." }
last_reviewed = 2026-09-14
review_due = 2027-09-14

[sources.monachesi-2023]
design = "meta-analysis"
level = "A"
population = { en = "Activation likelihood estimation meta-analysis of fMRI studies of reappraisal and acceptance tasks.", cs = "Metaanalýza fMRI studií úloh přehodnocení a přijetí metodou activation likelihood estimation." }
appraisal = { en = "Supports the claim that reappraisal and acceptance share activity in left inferior frontal gyrus and insula but differ in other regions. Neural activation patterns do not show which strategy is more effective for a person.", cs = "Podporuje tvrzení, že přehodnocení a přijetí sdílejí aktivitu v levém dolním čelním závitu a insule, ale v jiných oblastech se liší. Vzorce neurální aktivace neukazují, která strategie je pro konkrétního člověka účinnější." }
last_reviewed = 2026-09-14
review_due = 2027-09-14

[sources.ochsner-gross-2005]
design = "review"
level = "D"
population = { en = "Not applicable: a narrative review of neuroimaging studies of attentional control and reappraisal.", cs = "Neuplatňuje se: narativní přehled neurozobrazovacích studií kontroly pozornosti a přehodnocení." }
appraisal = { en = "Supports the claim that reappraisal and attentional control involve interactions between prefrontal and cingulate control systems and emotion-generative regions. Narrative review of early imaging work.", cs = "Podporuje tvrzení, že přehodnocení a kontrola pozornosti zahrnují interakci prefrontálních a cingulárních kontrolních systémů s oblastmi, které emoce generují. Narativní přehled raných zobrazovacích studií." }
last_reviewed = 2026-09-14
review_due = 2027-09-14

[sources.kross-ayduk-mischel-2005]
design = "experiment"
level = "B"
population = { en = "Participants in two experiments who recalled an anger-eliciting interpersonal experience.", cs = "Účastníci dvou experimentů, kteří si vybavovali interpersonální zážitek vyvolávající hněv." }
appraisal = { en = "Supports the claim that a self-distanced 'why' focus reduced negative affect on recall compared with immersed recall, replicated in a second study. Laboratory recall tasks, short-term outcomes.", cs = "Podporuje tvrzení, že zaměření na otázku „proč“ z odstupu snižovalo negativní afekt při vybavování ve srovnání s ponořeným vybavováním, s replikací ve druhé studii. Laboratorní úlohy vybavování, krátkodobé výsledky." }
last_reviewed = 2026-09-14
review_due = 2027-09-14

[sources.kross-ayduk-2011]
design = "review"
level = "D"
population = { en = "Not applicable: a short review of research on self-distancing.", cs = "Neuplatňuje se: krátký přehled výzkumu sebedistancování." }
appraisal = { en = "Supports the claim that self-distancing is associated with adaptive self-reflection across several levels of analysis. A brief review by the authors of much of the primary research.", cs = "Podporuje tvrzení, že sebedistancování souvisí s adaptivní sebereflexí na několika úrovních analýzy. Krátký přehled od autorů velké části primárního výzkumu." }
last_reviewed = 2026-09-14
review_due = 2027-09-14

[sources.lieberman-2007]
design = "experiment"
level = "B"
population = { en = "fMRI participants viewing emotional facial images under affect-labelling and control encoding conditions.", cs = "Účastníci fMRI studie sledující emoční obrázky tváří v podmínkách pojmenování afektu a kontrolního kódování." }
appraisal = { en = "Supports the claim that affect labelling was associated with reduced amygdala response and increased right ventrolateral prefrontal activity. Standardised images, not personal events, and no measure of later recovery.", cs = "Podporuje tvrzení, že pojmenování afektu souviselo se sníženou odpovědí amygdaly a zvýšenou aktivitou pravého ventrolaterálního prefrontálního kortexu. Standardizované obrázky, nikoli osobní události, a bez měření pozdějšího zotavení." }
last_reviewed = 2026-09-14
review_due = 2027-09-14

[sources.nolen-hoeksema-2008]
design = "review"
level = "D"
population = { en = "Not applicable: a narrative review of response styles theory and rumination research.", cs = "Neuplatňuje se: narativní přehled teorie stylů reakce a výzkumu ruminace." }
appraisal = { en = "Supports the claims that rumination predicts the onset of depression and is associated with several psychopathologies, and that positive distraction relieves depressed mood experimentally. Narrative synthesis of mixed designs.", cs = "Podporuje tvrzení, že ruminace predikuje nástup deprese a souvisí s řadou psychopatologií a že pozitivní rozptýlení experimentálně zmírňuje depresivní náladu. Narativní syntéza studií různého designu." }
last_reviewed = 2026-09-14
review_due = 2027-09-14

[sources.watkins-2008]
design = "review"
level = "D"
population = { en = "Not applicable: a review of constructive and unconstructive repetitive thought.", cs = "Neuplatňuje se: přehled konstruktivního a nekonstruktivního opakujícího se myšlení." }
appraisal = { en = "Supports the claim that the consequences of repetitive thought depend on valence, context and level of construal, with abstract processing tending to be unconstructive. Narrative review; the advice built on it has not been trialled as such.", cs = "Podporuje tvrzení, že důsledky opakujícího se myšlení závisí na valenci, kontextu a úrovni konstruálu a že abstraktní zpracování bývá nekonstruktivní. Narativní přehled; rady na něm postavené nebyly jako takové testovány." }
last_reviewed = 2026-09-14
review_due = 2027-09-14

[sources.hayes-1996]
design = "theory"
level = "D"
population = { en = "Not applicable: a theoretical review proposing experiential avoidance as a functional dimension.", cs = "Neuplatňuje se: teoretický přehled navrhující zážitkové vyhýbání jako funkční dimenzi." }
appraisal = { en = "Supports the claim that experiential avoidance was proposed as a process common to many psychological difficulties. A theoretical argument drawing on diverse research, not a direct test.", cs = "Podporuje tvrzení, že zážitkové vyhýbání bylo navrženo jako proces společný mnoha psychickým obtížím. Teoretický argument opřený o různorodý výzkum, nikoli přímý test." }
last_reviewed = 2026-09-14
review_due = 2027-09-14

# ── Expression, writing, crying and sharing ───────────────────────────────────────────────────────

[sources.pennebaker-beall-1986]
design = "experiment"
level = "B"
population = { en = "Not verified: no abstract was retrievable; the study is an expressive-writing experiment with assigned writing conditions.", cs = "Neověřeno: abstrakt nebyl dostupný; jde o experiment expresivního psaní s přidělenými podmínkami psaní." }
appraisal = { en = "Cited for the historical origin of the expressive-writing paradigm and later health benefits of writing about facts and feelings. Sample size and outcomes were not re-verified from an abstract and are not stated on the site.", cs = "Citováno pro historický počátek paradigmatu expresivního psaní a pozdější zdravotní přínosy psaní o faktech i pocitech. Velikost vzorku a výsledky nebyly z abstraktu znovu ověřeny a web je neuvádí." }
last_reviewed = 2026-09-14
review_due = 2027-09-14

[sources.pennebaker-1997]
design = "review"
level = "D"
population = { en = "Not applicable: a review of expressive-writing studies.", cs = "Neuplatňuje se: přehled studií expresivního psaní." }
appraisal = { en = "Supports the claim that changes in cognitive and linguistic processes during writing predict better health more than reduced inhibition alone. A review by the paradigm's originator; later meta-analyses report variable effects.", cs = "Podporuje tvrzení, že zdraví lépe predikují změny kognitivních a jazykových procesů při psaní než samotné snížení inhibice. Přehled od autora paradigmatu; pozdější metaanalýzy uvádějí proměnlivé účinky." }
last_reviewed = 2026-09-14
review_due = 2027-09-14

[sources.bylsma-2008]
design = "cross-sectional"
level = "D"
population = { en = "Self-reports on the most recent crying episode from 2,181 male and 2,915 female students in 35 countries.", cs = "Sebeposouzení posledního pláče od 2 181 studentů a 2 915 studentek v 35 zemích." }
appraisal = { en = "Supports the claim that social support, resolution and new understanding were associated with reports of cathartic crying, and shame and suppression with fewer. Retrospective self-report in student samples.", cs = "Podporuje tvrzení, že sociální opora, vyřešení situace a nové porozumění souvisely s popisem pláče jako úlevného, zatímco stud a potlačování s méně častou úlevou. Retrospektivní sebeposouzení ve studentských vzorcích." }
last_reviewed = 2026-09-14
review_due = 2027-09-14

[sources.gracanin-2014]
design = "review"
level = "D"
population = { en = "Not applicable: a narrative review of the self-soothing effects of crying.", cs = "Neuplatňuje se: narativní přehled sebeuklidňujících účinků pláče." }
appraisal = { en = "Supports the claim that findings on mood after crying appear discrepant and that self-soothing and social-soothing mechanisms have been proposed. Proposes mechanisms rather than establishing them.", cs = "Podporuje tvrzení, že zjištění o náladě po pláči se zdají rozporná a že byly navrženy mechanismy sebeuklidnění i sociálního uklidnění. Mechanismy navrhuje, nedokládá je." }
last_reviewed = 2026-09-14
review_due = 2027-09-14

[sources.rime-2009]
design = "review"
level = "D"
population = { en = "Not applicable: a theoretical and empirical review of the social sharing of emotion.", cs = "Neuplatňuje se: teoretický a empirický přehled sociálního sdílení emocí." }
appraisal = { en = "Supports the claims that emotional experiences commonly elicit social sharing and that sharing has interpersonal functions. Narrative review largely of the author's own research programme.", cs = "Podporuje tvrzení, že emoční zážitky běžně vedou k sociálnímu sdílení a že sdílení má mezilidské funkce. Narativní přehled převážně autorova vlastního výzkumného programu." }
last_reviewed = 2026-09-14
review_due = 2027-09-14

[sources.zech-rime-2005]
design = "experiment"
level = "B"
population = { en = "Participants in two experiments assigned to talk about an emotional episode or to control conditions, followed up to two months.", cs = "Účastníci dvou experimentů přidělení k vyprávění o emočním zážitku nebo do kontrolních podmínek, sledovaní až dva měsíce." }
appraisal = { en = "Supports the claim that talking about emotions produced perceived benefits without reducing emotional impact compared with control conditions. The role of cognitive work in sharing is discussed rather than directly tested here.", cs = "Podporuje tvrzení, že mluvení o emocích přinášelo pociťovaný užitek, ale ve srovnání s kontrolními podmínkami nesnížilo emoční dopad. Roli kognitivního zpracování práce spíše diskutuje, než přímo testuje." }
last_reviewed = 2026-09-14
review_due = 2027-09-14

# ── Synchrony, music and collective gatherings ────────────────────────────────────────────────────

[sources.tarr-2015]
design = "experiment"
level = "B"
population = { en = "Participants in a 2 × 2 group-dance experiment manipulating synchrony and exertion.", cs = "Účastníci skupinového tanečního experimentu 2 × 2 s manipulací synchronie a námahy." }
appraisal = { en = "Supports the claim that synchrony and exertion each raised pain thresholds and in-group bonding. Pain threshold is a proxy for endorphin activity, which was not measured directly.", cs = "Podporuje tvrzení, že synchronie i námaha nezávisle zvyšovaly práh bolesti a sounáležitost se skupinou. Práh bolesti je nepřímým ukazatelem endorfinové aktivity, která nebyla přímo měřena." }
