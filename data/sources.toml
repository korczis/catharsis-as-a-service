population = { en = "Not applicable: a monograph in sociological theory.", cs = "Neuplatňuje se: monografie sociologické teorie." }
appraisal = { en = "Supports the claim that Collins proposed that successful interaction rituals create symbols of membership and emotional energy while failed rituals drain it. Theory built on microsociological observation, not a quantitative test.", cs = "Podporuje tvrzení, že Collins navrhl, že úspěšné interakční rituály vytvářejí symboly příslušnosti a emoční energii, zatímco neúspěšné ji vyčerpávají. Teorie založená na mikrosociologickém pozorování, nikoli kvantitativní test." }
