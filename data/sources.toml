[sources.rescorla-wagner-1972]
design = "theory"
level = "D"
population = { en = "Not applicable: a formal theory of Pavlovian conditioning, tested in animal learning experiments.", cs = "Neuplatňuje se: formální teorie pavlovovského podmiňování testovaná v experimentech s učením zvířat." }
appraisal = { en = "Supports the statement that the model describes learning as an error-correcting update, in which each trial changes associative strength in proportion to the difference between what the outcome can support and what has already been learned. It concerns Pavlovian conditioning; applying its form to instrumental relief-seeking is an analogy. No abstract is available for this book chapter, so the appraisal rests on the standard description of the model.", cs = "Podporuje tvrzení, že model popisuje učení jako korekční aktualizaci, při níž každý pokus mění asociační sílu úměrně rozdílu mezi tím, co výsledek umožňuje, a tím, co už je naučeno. Týká se pavlovovského podmiňování; použití jeho tvaru pro instrumentální vyhledávání úlevy je analogie. Kapitola nemá dostupný abstrakt, hodnocení proto vychází ze standardního popisu modelu." }
last_reviewed = 2026-09-14
review_due = 2027-09-14

[sources.kuramoto-1984]
design = "book"
level = "E"
population = { en = "Not applicable: a mathematical monograph on oscillations and waves in chemical and other systems.", cs = "Neuplatňuje se: matematická monografie o oscilacích a vlnách v chemických a dalších systémech." }
appraisal = { en = "Supports attributing the coupled-oscillator model of synchronization to Kuramoto. It is mathematical and makes no claim about people, emotion or groups; its contents were not re-read for this appraisal, and the model's properties are cited from the 2000 review.", cs = "Podporuje připsání modelu spřažených oscilátorů Kuramotovi. Jde o matematickou práci bez tvrzení o lidech, emocích nebo skupinách; obsah knihy nebyl pro toto hodnocení znovu čten a vlastnosti modelu se citují z přehledu z roku 2000." }
last_reviewed = 2026-09-14
