[sources.moran-eyal-2022]
design = "meta-analysis"
level = "A"
population = { en = "Two meta-analyses of experimental manipulations: psychological distance (k = 230) and level of abstraction (k = 98).", cs = "Dvě metaanalýzy experimentálních manipulací: psychologické vzdálenosti (k = 230) a úrovně abstrakce (k = 98)." }
appraisal = { en = "Supports the claims that a distant perspective attenuated emotional experience (g = 0.52), less for high-level such as self-conscious emotions (g = 0.29) than for low-level emotions (g = 0.64), and that abstraction attenuated only low-level emotions. Mostly short-term experimental outcomes.", cs = "Podporuje tvrzení, že vzdálená perspektiva tlumila emoční prožitek (g = 0,52), méně u emocí vyšší úrovně, jako jsou sebeuvědomující emoce (g = 0,29), než u emocí nižší úrovně (g = 0,64), a že abstrakce tlumila jen emoce nižší úrovně. Převážně krátkodobé experimentální výsledky." }
last_reviewed = 2026-09-14
review_due = 2027-09-14

[sources.kross-2014]
design = "experiment"
level = "B"
population = { en = "Seven studies with 585 participants in total, including socially anxious people.", cs = "Sedm studií s celkem 585 účastníky, včetně lidí se sociální úzkostí." }
appraisal = { en = "Supports the claims that non-first-person self-talk enhanced self-distancing and, under social stress, went with better rated performance, less distress and less maladaptive post-event processing, not moderated by trait social anxiety. Social-stress tasks in the laboratory.", cs = "Podporuje tvrzení, že mluvení k sobě jinak než v první osobě zvyšovalo odstup od sebe a při sociálním stresu šlo ruku v ruce s lépe hodnoceným výkonem, menší tísní a méně maladaptivním zpětným zpracováním, bez moderace sociální úzkostí jako rysem. Laboratorní úlohy se sociálním stresem." }
last_reviewed = 2026-09-14
review_due = 2027-09-14

[sources.powers-labar-2019]
design = "review"
level = "D"
population = { en = "Not applicable: a review proposing a taxonomy and neurocognitive model of distancing, with a supporting neuroimaging meta-analysis.", cs = "Neuplatňuje se: přehled navrhující taxonomii a neurokognitivní model odstupu s podpůrnou metaanalýzou neurozobrazovacích studií." }
appraisal = { en = "Supports the claim that the neurocognitive mechanisms of distancing are unclear and that inconsistent terminology and methods make the literature difficult to synthesise. Its neurocognitive model is a proposal and is not cited as a finding.", cs = "Podporuje tvrzení, že neurokognitivní mechanismy odstupu jsou nejasné a že nejednotná terminologie a metody ztěžují souhrnné zpracování literatury. Jeho neurokognitivní model je návrh a necituje se jako zjištění." }
last_reviewed = 2026-09-14
review_due = 2027-09-14
