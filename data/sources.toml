appraisal = { en = "Supports the claims that replication effects were about half the size of the original effects and that 36% of replications were statistically significant versus 97% of originals. Graded D because it mixes experimental and correlational replications and describes research practice in a sample of journals, not an intervention; what counts as a successful replication is itself debated.", cs = "Podporuje tvrzení, že účinky v replikacích dosahovaly zhruba poloviny původní velikosti a že statisticky významných bylo 36 % replikací oproti 97 % původních studií. Úroveň D, protože kombinuje experimentální a korelační replikace a popisuje výzkumnou praxi ve vzorku časopisů, nikoli intervenci; co se počítá za úspěšnou replikaci, je samo předmětem sporu." }
