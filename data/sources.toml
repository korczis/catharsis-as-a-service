[sources.paez-2015]
design = "longitudinal"
level = "C"
population = { en = "Participants in folkloric marches and protest demonstrations across four studies (two correlational, one semi-longitudinal, one experimental).", cs = "Účastníci folklorních průvodů a protestních demonstrací ve čtyřech studiích (dvě korelační, jedna semilongitudinální, jedna experimentální)." }
appraisal = { en = "Supports the claim that participation was associated with stronger collective identity, social integration, efficacy and positive affect, mediated by perceived emotional synchrony. Graded C because most outcomes come from correlational and semi-longitudinal designs; the abstract does not describe the experimental manipulation.", cs = "Podporuje tvrzení, že účast souvisela se silnější kolektivní identitou, sociální integrací, účinností a pozitivním afektem a že tento vztah zprostředkovala vnímaná emoční synchronie. Úroveň C, protože většina výsledků pochází z korelačních a semilongitudinálních designů; abstrakt experimentální manipulaci nepopisuje." }
last_reviewed = 2026-09-14
