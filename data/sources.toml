appraisal = { en = "Supports the claim that heart-rate dynamics showed fine-grained commonalities between fire-walkers and related spectators but not unrelated spectators. A single field study; it measured shared arousal, not wellbeing or later outcomes.", cs = "Podporuje tvrzení, že dynamika srdeční frekvence vykazovala jemné shody mezi chodci a příbuznými diváky, nikoli však nepříbuznými diváky. Jediná terénní studie; měřila sdílené vzrušení, nikoli pohodu ani pozdější výsledky." }
