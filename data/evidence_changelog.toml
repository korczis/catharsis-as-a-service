# Evidence changelog: what changed in the ledger, when and why. Newest first.

[[entries]]
date = 2026-09-14
kind = "revised"
summary = { en = "Two claims graded A were split so that each grade matches its evidence. The sleep claim now separates the meta-analytic effect of sleep restriction on adaptive emotion regulation (g = -0.32, youth samples, level A) from the narrative review's observation that regulatory processes have been studied less than generated emotions (level D). The expressive-writing claim now separates the measured dissociation between immediate distress and later health outcomes (level A) from the site's interpretation that how a session feels at its end is weak evidence of benefit (level D). Wording was corrected against the source abstracts in the same pass: the two Johannsen moderators are reported as separate study characteristics rather than one combined subgroup, and the duration threshold for prolonged grief disorder now names ICD-11 and DSM-5-TR separately.", cs = "Dvě tvrzení hodnocená stupněm A byla rozdělena tak, aby stupeň odpovídal dokladům. Tvrzení o spánku nyní odděluje metaanalytický účinek omezení spánku na adaptivní regulaci emocí (g = -0,32, vzorky mladých lidí, úroveň A) od konstatování přehledové studie, že regulační procesy byly zkoumány méně než vznikající emoce (úroveň D). Tvrzení o expresivním psaní odděluje naměřené oddělení bezprostředního distresu od pozdějších zdravotních výsledků (úroveň A) od výkladu tohoto webu, že pocit na konci sezení je slabým dokladem přínosu (úroveň D). Ve stejném kroku byly podle abstraktů zdrojů opraveny formulace: dva moderátory u Johannsena se uvádějí jako samostatné charakteristiky studií, nikoli jako jedna kombinovaná podskupina, a práh trvání u prolongované poruchy truchlení nyní uvádí MKN-11 a DSM-5-TR zvlášť." }
claims = ["sleep-restriction-lowers-adaptive-regulation", "sleep-regulation-processes-understudied", "writing-distress-unrelated-to-health-outcomes", "session-end-feeling-weak-evidence-of-benefit", "grief-interventions-work-best-when-targeted", "prolonged-grief-clinical-boundary"]

[[entries]]
date = 2026-09-14
kind = "added"
summary = { en = "Nine advice entries were expanded with 23 newly appraised references and 14 claims, including findings that qualify the advice: early trauma interventions without symptom screening, the limits of the peak-end pattern, invisible support, concreteness training versus relaxation, context-dependent reappraisal, and distancing effects by emotion type. Every added statement was checked against the abstract of its source in PubMed or OpenAlex; two candidate meta-analyses without a retrievable abstract were not used.", cs = "Devět rad bylo rozšířeno o 23 nově hodnocených zdrojů a 14 tvrzení, včetně zjištění, která rady omezují: časné intervence po traumatu bez zjišťování příznaků, meze vzorce vrcholu a konce, nepostřehnutá opora, trénink konkrétnosti oproti relaxaci, přehodnocení závislé na kontextu a účinky odstupu podle druhu emoce. Každé doplněné tvrzení bylo ověřeno podle abstraktu zdroje v PubMed nebo OpenAlex; dvě kandidátní metaanalýzy bez dostupného abstraktu nebyly použity." }
claims = ["advice-early-trauma-help-for-symptoms", "advice-ptss-rumination-avoidance-association", "advice-experiential-avoidance-daily-life", "advice-peak-end-not-universal", "advice-relationships-survival-association", "advice-invisible-support", "advice-concreteness-training", "advice-anger-rumination-versus-reappraisal", "advice-anger-treatments-by-type", "advice-synchrony-prosocial-meta-analysis", "advice-dance-interventions-meta-analysis", "advice-affect-labeling-beyond-imaging", "advice-reappraisal-depends-on-context", "advice-distancing-meta-analysis"]

[[entries]]
date = 2026-09-14
kind = "added"
summary = { en = "Theory section added: eight essays on catharsis theories, the process model of emotion regulation, appraisal, basic and constructed emotion, social sharing, avoidance learning, allostasis and collective ritual, with 26 claims and 35 newly appraised references. Mechanism and position statements are typed theoretical; the claims that report findings are empirical and graded by their best source. Contested positions are recorded as contested.", cs = "Přidána sekce Teorie: osm esejí o teoriích katarze, procesním modelu regulace emocí, hodnocení, základních a konstruovaných emocích, sociálním sdílení, učení vyhýbání, alostáze a kolektivním rituálu, s 26 tvrzeními a 35 nově zhodnocenými zdroji. Tvrzení o mechanismech a teoretických stanoviscích jsou typu theoretical; tvrzení o zjištěních jsou empirická a hodnocená podle nejlepšího zdroje. Sporná stanoviska jsou jako sporná i zaznamenána." }
claims = ["catharsis-hypothesis-not-supported-for-anger", "strategy-effects-differ-by-family", "appraisal-causality-contested", "no-consistent-category-signature", "sharing-mode-determines-recovery", "avoidance-maintained-by-relief", "allostasis-concept-contested", "collective-gatherings-perceived-synchrony"]

[[entries]]
date = 2026-09-14
kind = "added"
summary = { en = "Grief and mourning rituals, and exercise and mood, added with 11 claims and 17 appraised references. Ritual effects rest on one set of experiments and are contrasted with a field study that found no association with grief reactions; prolonged grief is recorded as a clinical boundary with a 180-day review. Exercise claims separate acute positive affect, symptom trials of low certainty and the null effect of exertion on anger. The acute exercise meta-analysis (Reed & Ones, 2006) remains unverified and carries no numbers.", cs = "Doplněna témata zármutku a smutečních rituálů a pohybu a nálady s 11 tvrzeními a 17 hodnocenými zdroji. Účinky rituálů stojí na jediné sadě experimentů a jsou postaveny do kontrastu s terénní studií, která souvislost s reakcemi zármutku nezjistila; prolongované truchlení je vedeno jako klinická hranice s revizí po 180 dnech. Tvrzení o pohybu oddělují akutní pozitivní afekt, studie příznaků s nízkou jistotou a nulový účinek námahy na hněv. Akutní metaanalýza pohybu (Reed a Ones, 2006) zůstává neověřená a neuvádějí se u ní čísla." }
claims = ["mourning-rituals-lower-grief-short-term", "funeral-rituals-valued-not-associated-with-grief", "most-bereaved-adapt-without-intervention", "grief-oscillation-and-continuing-bonds", "prolonged-grief-clinical-boundary", "grief-interventions-work-best-when-targeted", "grief-when-to-seek-help", "activity-raises-positive-affect-for-hours", "exercise-intensity-and-pleasure", "regular-activity-reduces-depression-anxiety", "exertion-lifts-mood-but-does-not-discharge-anger"]

[[entries]]
date = 2026-09-14
kind = "added"
summary = { en = "Sleep and emotion regulation, expressive writing and rumination added with 17 claims and 20 appraised references. Expressive writing is graded by its largest meta-analysis (small average effect) and by later null or uncontrolled syntheses; the analysis without control arms is graded D. The account of why rumination feels like processing is typed theoretical at low confidence because the cited sources did not measure it.", cs = "Doplněna témata spánku a regulace emocí, expresivního psaní a ruminace se 17 tvrzeními a 20 hodnocenými zdroji. Expresivní psaní je hodnoceno podle největší metaanalýzy (malý průměrný účinek) a podle pozdějších nulových nebo nekontrolovaných syntéz; analýza bez kontrolních ramen má úroveň D. Výklad, proč se ruminace zdá jako zpracování, je veden jako teoretický s nízkou mírou jistoty, protože jej citované zdroje neměřily." }
claims = ["sleep-loss-reduces-positive-affect", "sleep-loss-lowers-stress-threshold", "sleep-restriction-lowers-adaptive-regulation", "sleep-regulation-processes-understudied", "overnight-emotional-processing-hypothesis", "insomnia-associated-with-later-depression", "improving-sleep-improves-mental-health", "sleep-hygiene-evidence-limited", "expressive-writing-small-average-effect", "writing-distress-unrelated-to-health-outcomes", "session-end-feeling-weak-evidence-of-benefit", "expressive-writing-limited-for-depression-and-youth", "expressive-writing-ptsd-evidence-uncontrolled", "expressive-writing-mechanism-unclear", "induced-rumination-impairs-problem-solving", "rumination-and-negative-affect-reciprocal", "rumination-feels-like-processing", "bounded-worry-period-reduces-worry", "rumination-focused-therapy-trial"]

[[entries]]
date = 2026-09-14
kind = "added"
summary = { en = "Claims added for the new interactive models page: the illustrative status of model outputs, the Rescorla–Wagner learning rule and the relief loop, the direction of venting findings, the peak–end finding, the Kuramoto synchronization threshold and its use only as an analogy, and allostatic load as accumulation. Three references added (Rescorla & Wagner, 1972; Kuramoto, 1984; Strogatz, 2000); the 1972 chapter has no DOI or abstract and its appraisal says so.", cs = "Pro novou stránku interaktivních modelů byla přidána tvrzení: ilustrativní povaha výstupů modelů, Rescorlovo–Wagnerovo pravidlo učení a smyčka úlevy, směr zjištění o ventilaci, zjištění o vrcholu a konci, práh synchronizace v Kuramotově modelu a jeho použití pouze jako analogie a alostatická zátěž jako hromadění. Přibyly tři zdroje (Rescorla a Wagner, 1972; Kuramoto, 1984; Strogatz, 2000); kapitola z roku 1972 nemá DOI ani abstrakt, což její hodnocení uvádí." }
claims = ["models-outputs-illustrative", "rescorla-wagner-error-correction", "relief-habit-without-change-model", "venting-model-follows-direction", "better-ending-longer-episode-preferred", "kuramoto-coupling-threshold", "oscillator-synchrony-is-analogy", "allostatic-load-accumulation-model"]

[[entries]]
date = 2026-09-14
kind = "added"
summary = { en = "The measuring-emotion note was expanded with six claims and eight newly appraised references: facial expression co-occurrence, self-report instruments, coherence across response systems, neuroimaging, ambulatory assessment and physiologically triggered experience sampling. Every added statement was checked against the PubMed abstract of its source, and no sample size is stated where the abstract gives none. Candidate sources whose abstract or text could not be retrieved were not used.", cs = "Poznámka o měření emocí byla rozšířena o šest tvrzení a osm nově hodnocených zdrojů: společný výskyt emocí a výrazů obličeje, nástroje sebeposouzení, soudržnost systémů odpovědí, neurozobrazování, ambulantní hodnocení a vzorkování zážitků spouštěné fyziologií. Každé doplněné tvrzení bylo ověřeno podle abstraktu zdroje v databázi PubMed a tam, kde abstrakt velikost vzorku neuvádí, se neuvádí ani zde. Kandidátní zdroje, jejichž abstrakt nebo text nebylo možné získat, nebyly použity." }
claims = ["measuring-facial-expression-cooccurrence", "measuring-self-report-scale-properties", "measuring-response-coherence-limited", "measuring-no-discrete-brain-localization", "measuring-field-recordings-confounded", "measuring-physiological-patterns-vary"]

[[entries]]
date = 2026-09-14
kind = "added"
summary = { en = "Ledger created with 50 claims and an appraisal of all 56 references. Designs were checked against published abstracts; two sources without a retrievable abstract (Pennebaker & Beall, 1986; Reed & Ones, 2006) are marked unverified and no numbers are stated for them. Syntheses of correlational studies are graded by the design of the studies they pool.", cs = "Vytvořen registr s 50 tvrzeními a hodnocením všech 56 zdrojů. Designy byly ověřeny podle publikovaných abstraktů; dva zdroje bez dostupného abstraktu (Pennebaker a Beall, 1986; Reed a Ones, 2006) jsou označeny jako neověřené a neuvádějí se u nich žádná čísla. Syntézy korelačních studií jsou hodnoceny podle designu studií, které shrnují." }
claims = ["catharsis-working-definition", "expressive-writing-coherence", "exercise-acute-positive-affect", "rumination-associated-symptoms", "collective-effervescence-associations", "relief-not-resolution-thesis", "telemetry-is-artistic", "no-analytics-trackers-cookies"]

[[entries]]
date = 2026-09-14
kind = "revised"
summary = { en = "Venting evidence revised to include the 2024 meta-analysis of 154 studies: arousal-decreasing activities reduced anger and aggression, arousal-increasing activities were ineffective overall. The landing-page wording 'venting increases aggression' is scoped in the ledger to rumination while venting in laboratory experiments (level B), and the arousal-increasing finding is held at moderate confidence because of heterogeneity.", cs = "Doklady o ventilování byly doplněny o metaanalýzu 154 studií z roku 2024: aktivity snižující vzrušení zmírňovaly hněv a agresi, aktivity zvyšující vzrušení byly celkově neúčinné. Formulace z úvodní stránky „ventilování zvyšuje agresi“ je v registru omezena na ruminaci během ventilování v laboratorních experimentech (úroveň B) a zjištění o aktivitách zvyšujících vzrušení má kvůli heterogenitě střední míru jistoty." }
claims = ["venting-increases-anger", "arousal-increasing-activities-ineffective", "arousal-decreasing-activities-reduce-anger", "catharsis-distinct-from-venting"]

[[entries]]
date = 2026-09-14
kind = "added"
summary = { en = "Music and emotion regulation claims added for the new research note, separating the randomised evidence on structured music interventions from the qualitative and correlational evidence on everyday music use, whose effectiveness remains insufficiently studied.", cs = "Pro novou výzkumnou poznámku byla přidána tvrzení o hudbě a regulaci emocí, která oddělují randomizované doklady o strukturovaných hudebních intervencích od kvalitativních a korelačních dokladů o každodenním používání hudby, jehož účinnost zůstává nedostatečně prozkoumána." }
claims = ["music-interventions-reduce-stress", "music-used-for-emotion-regulation", "music-discharge-strategy", "music-self-regulation-effectiveness-untested"]

