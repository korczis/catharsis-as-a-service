claim_type = "empirical"
evidence_level = "A"
confidence = "MODERATE"
sources = ["siegel-2018", "kreibig-2010"]
scope = { en = "Laboratory emotion inductions in nonclinical adults, measured with peripheral physiology.", cs = "Laboratorní indukce emocí u neklinických dospělých měřené periferní fyziologií." }
caveat = { en = "The two syntheses disagree on specificity, so the claim is that no consistent fingerprint has been established, not that physiology is uninformative.", cs = "Obě syntézy se ve specifičnosti rozcházejí, takže tvrzení zní, že konzistentní otisk nebyl doložen, nikoli že fyziologie nic nevypovídá." }
