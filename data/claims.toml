[[claims]]
id = "induced-rumination-impairs-problem-solving"
statement = { en = "In experiments, dysphoric participants induced to ruminate made more negative interpretations and generated less effective solutions than those induced to distract, and in depressed patients concrete rather than abstract self-focus improved social problem solving.", cs = "V experimentech dysforičtí účastníci po navození ruminace vykládali situace negativněji a navrhovali méně účinná řešení než ti po navození rozptýlení a u pacientů s depresí zlepšilo řešení sociálních problémů konkrétní, nikoli abstraktní zaměření na sebe." }
