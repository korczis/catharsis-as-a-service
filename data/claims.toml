review_due = 2028-09-13

[[claims]]
id = "regulation-neural-correlates"
statement = { en = "Reappraisal is associated with activity in prefrontal and cingulate control regions that modulate emotion-generating regions, and a neuroimaging meta-analysis suggests that reappraisal and acceptance share some regions while differing in others.", cs = "Přehodnocení je spojeno s aktivitou prefrontálních a cingulárních kontrolních oblastí, které modulují oblasti generující emoce, a metaanalýza neurozobrazovacích studií naznačuje, že přehodnocení a přijetí sdílejí některé oblasti a v jiných se liší." }
