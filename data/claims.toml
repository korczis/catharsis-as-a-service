# ── Expressive writing ────────────────────────────────────────────────────────────────────────────

[[claims]]
id = "expressive-writing-small-average-effect"
statement = { en = "Across 146 randomised studies, experimental disclosure had a positive and significant but small average effect (r = .075), with several moderators; an earlier synthesis found benefits across reported physical health, well-being and functioning but not health behaviours.", cs = "Napříč 146 randomizovanými studiemi mělo experimentální sdělování pozitivní a významný, ale malý průměrný účinek (r = 0,075) s několika moderátory; dřívější syntéza zjistila přínosy v uváděném tělesném zdraví, pohodě a fungování, nikoli však ve zdravotním chování." }
claim_type = "empirical"
evidence_level = "A"
confidence = "HIGH"
sources = ["frattaroli-2006", "smyth-1998"]
scope = { en = "Randomised studies of writing or talking about personal, meaningful topics, largely in non-clinical samples.", cs = "Randomizované studie psaní nebo mluvení o osobních, významných tématech, převážně v neklinických vzorcích." }
caveat = { en = "The average conceals heterogeneity, moderators are not itemised in the abstract, and a small average does not predict benefit for an individual.", cs = "Průměr skrývá heterogenitu, moderátory abstrakt nevyjmenovává a malý průměr nepředpovídá přínos pro jednotlivce." }
used_in = ["research/expressive-writing-evidence/index.md"]
last_reviewed = 2026-09-14
review_due = 2027-09-14

[[claims]]
id = "writing-distress-unrelated-to-health-outcomes"
statement = { en = "Expressive writing tends to increase immediate distress, and in a research synthesis that increase was unrelated to later health outcomes.", cs = "Expresivní psaní obvykle zvyšuje bezprostřední distres a ve výzkumné syntéze tento nárůst s pozdějšími zdravotními výsledky nesouvisel." }
claim_type = "empirical"
evidence_level = "A"
confidence = "MODERATE"
sources = ["smyth-1998"]
scope = { en = "Healthy participants in written emotional expression studies.", cs = "Zdraví účastníci studií písemného vyjádření emocí." }
caveat = { en = "One early synthesis with fixed-effects methods; the dissociation was measured across studies, not within individuals.", cs = "Jedna raná syntéza s metodami fixních efektů; oddělení obou měření bylo zjištěno napříč studiemi, nikoli u jednotlivců." }
used_in = ["research/expressive-writing-evidence/index.md"]
last_reviewed = 2026-09-14
review_due = 2027-09-14

[[claims]]
id = "session-end-feeling-weak-evidence-of-benefit"
