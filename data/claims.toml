statement = { en = "Brief self-directed expressive writing had no significant long-term effect on depressive symptoms in healthy adults under stress, with larger effects for more sessions and specific topics, and had a small positive overall effect in adolescents.", cs = "Krátké, samostatně prováděné expresivní psaní nemělo u zdravých dospělých pod stresem žádný významný dlouhodobý účinek na depresivní příznaky, s většími účinky při více sezeních a konkrétních tématech, a u dospívajících mělo malý pozitivní celkový účinek." }
