# ── Exercise and mood ─────────────────────────────────────────────────────────────────────────────

[[claims]]
id = "activity-raises-positive-affect-for-hours"
statement = { en = "In everyday settings, physical activity consistently predicted higher positive affect over the next few hours, while evidence that it reduces negative affect over the same period was inconsistent.", cs = "V každodenním prostředí pohybová aktivita konzistentně předpovídala vyšší pozitivní afekt v následujících hodinách, zatímco doklady o snížení negativního afektu za stejnou dobu byly nekonzistentní." }
claim_type = "empirical"
evidence_level = "C"
confidence = "MODERATE"
sources = ["liao-2015", "reed-ones-2006"]
scope = { en = "Non-clinical adults in free-living studies with repeated momentary reports.", cs = "Nekliničtí dospělí ve studiích v přirozeném prostředí s opakovanými okamžitými záznamy." }
caveat = { en = "Observational designs in which mood also predicts activity; the related laboratory meta-analysis could not be re-verified from an abstract.", cs = "Observační designy, v nichž nálada předpovídá i aktivitu; související laboratorní metaanalýzu nebylo možné ověřit z abstraktu." }
used_in = ["research/exercise-and-mood/index.md", "advice/move-to-lower-arousal-and-lift-mood/index.md"]
last_reviewed = 2026-09-14
review_due = 2027-09-14

[[claims]]
id = "exercise-intensity-and-pleasure"
statement = { en = "Pleasure during exercise declines mainly above the ventilatory or lactate threshold, most people experience pleasant changes below it with large individual differences near it, and self-selected intensity appears to foster tolerance of higher intensity.", cs = "Potěšení během cvičení klesá hlavně nad ventilačním nebo laktátovým prahem, pod ním prožívá většina lidí příjemné změny s velkými individuálními rozdíly v jeho blízkosti a samostatně zvolená intenzita podle všeho zvyšuje toleranci vyšší intenzity." }
claim_type = "empirical"
evidence_level = "D"
confidence = "MODERATE"
sources = ["ekkekakis-2011"]
scope = { en = "Affective responses during and around single exercise bouts in reviewed studies from 1999 to 2009.", cs = "Afektivní reakce během jednotlivých cvičení a kolem nich ve shrnutých studiích z let 1999 až 2009." }
caveat = { en = "A narrative review; thresholds vary between people and the findings concern how exercise feels, not symptom outcomes.", cs = "Narativní přehled; prahy se mezi lidmi liší a zjištění se týkají prožívání cvičení, nikoli výsledků v příznacích." }
used_in = ["research/exercise-and-mood/index.md", "advice/move-to-lower-arousal-and-lift-mood/index.md"]
last_reviewed = 2026-09-14
review_due = 2027-09-14

[[claims]]
id = "regular-activity-reduces-depression-anxiety"
statement = { en = "Randomised trials pooled in several meta-analyses associate regular physical activity with reductions in depressive and anxiety symptoms, in non-clinical adults and in people with depression, although the certainty of specific effect estimates is often low.", cs = "Randomizované studie shrnuté v několika metaanalýzách spojují pravidelnou pohybovou aktivitu se snížením depresivních a úzkostných příznaků u neklinických dospělých i u lidí s depresí, i když jistota konkrétních odhadů účinku je často nízká." }
claim_type = "empirical"
evidence_level = "A"
confidence = "MODERATE"
sources = ["rebar-2015", "schuch-2016", "noetel-2024", "singh-2023"]
scope = { en = "Structured physical activity interventions over weeks, compared with control conditions or usual care.", cs = "Strukturované pohybové intervence v řádu týdnů ve srovnání s kontrolními podmínkami nebo běžnou péčí." }
caveat = { en = "Overlapping studies, unblinded participants, frequent risk of bias and low-quality reviews limit certainty; effect sizes differ widely between syntheses.", cs = "Jistotu omezují překrývající se studie, nezaslepení účastníci, časté riziko zkreslení a nekvalitní přehledy; velikosti účinku se mezi syntézami výrazně liší." }
used_in = ["research/exercise-and-mood/index.md", "advice/move-to-lower-arousal-and-lift-mood/index.md"]
last_reviewed = 2026-09-14
review_due = 2027-09-14

[[claims]]
id = "exertion-lifts-mood-but-does-not-discharge-anger"
statement = { en = "Physical activity can lift positive affect while leaving anger unchanged: arousal-increasing anger-management activities, including running, did not reduce anger and aggression on average, and exertion while ruminating on a provocation produced the most anger.", cs = "Pohybová aktivita může zlepšit pozitivní afekt a hněv přitom nechat beze změny: činnosti pro zvládání hněvu zvyšující vzrušení, včetně běhu, v průměru hněv ani agresi nesnižovaly a námaha provázená ruminací o provokaci vedla k největšímu hněvu." }
claim_type = "empirical"
evidence_level = "A"
confidence = "MODERATE"
sources = ["kjaervik-bushman-2024", "bushman-2002", "liao-2015"]
scope = { en = "Anger and aggression outcomes shortly after activity, contrasted with positive affect outcomes in daily life.", cs = "Hněv a agrese krátce po aktivitě v kontrastu s pozitivním afektem v každodenním životě." }
caveat = { en = "The anger and mood literatures measure different outcomes in different studies; arousal-increasing studies were heterogeneous, so some activities in some contexts may differ.", cs = "Výzkum hněvu a nálady měří v různých studiích různé výsledky; studie činností zvyšujících vzrušení byly heterogenní, takže některé činnosti v některých kontextech se mohou lišit." }
used_in = ["research/exercise-and-mood/index.md", "advice/move-to-lower-arousal-and-lift-mood/index.md"]
last_reviewed = 2026-09-14
review_due = 2027-09-14

# ── Sleep and emotion regulation ──────────────────────────────────────────────────────────────────

[[claims]]
id = "sleep-loss-reduces-positive-affect"
statement = { en = "Experimental sleep loss in healthy people reduces positive affect and increases anxiety symptoms, while effects on negative affect, emotional reactivity and depressive symptoms are mixed and depend on the type of sleep loss.", cs = "Experimentální ztráta spánku u zdravých lidí snižuje pozitivní afekt a zvyšuje příznaky úzkosti, zatímco účinky na negativní afekt, emoční reaktivitu a depresivní příznaky jsou smíšené a závisejí na typu ztráty spánku." }
claim_type = "empirical"
evidence_level = "A"
confidence = "HIGH"
sources = ["palmer-2024", "tomaso-2021"]
scope = { en = "Total sleep deprivation, partial restriction and fragmentation over short periods in healthy participants aged 7 to 79.", cs = "Úplná deprivace, částečné omezení a fragmentace spánku po krátká období u zdravých účastníků ve věku 7 až 79 let." }
caveat = { en = "Short laboratory manipulations; the pattern for negative affect and reactivity is not uniform, and chronic real-life sleep problems may differ.", cs = "Krátké laboratorní manipulace; vzorec pro negativní afekt a reaktivitu není jednotný a chronické spánkové obtíže v běžném životě se mohou lišit." }
used_in = ["research/sleep-and-emotion-regulation/index.md", "advice/protect-sleep-after-strain/index.md"]
last_reviewed = 2026-09-14
review_due = 2027-09-14

[[claims]]
id = "sleep-loss-lowers-stress-threshold"
statement = { en = "After one night of total sleep deprivation, healthy adults reported more stress, anxiety and anger than rested controls in response to a mild stressor but not a severe one, consistent with a lowered threshold for perceiving stress.", cs = "Po jedné noci úplné spánkové deprivace uváděli zdraví dospělí v reakci na mírný stresor, nikoli však na silný, více stresu, úzkosti a hněvu než odpočatí, což odpovídá sníženému prahu vnímání stresu." }
claim_type = "empirical"
evidence_level = "B"
confidence = "LOW"
sources = ["minkel-2012"]
scope = { en = "Two laboratory experiments with healthy adults and cognitive stressors.", cs = "Dva laboratorní experimenty se zdravými dospělými a kognitivními stresory." }
caveat = { en = "Small samples and a single night of total deprivation; not replicated in the sources cited here.", cs = "Malé vzorky a jediná noc úplné deprivace; v zde citovaných zdrojích nereplikováno." }
used_in = ["research/sleep-and-emotion-regulation/index.md", "advice/protect-sleep-after-strain/index.md"]
last_reviewed = 2026-09-14
review_due = 2027-09-14

[[claims]]
id = "sleep-restriction-lowers-adaptive-regulation"
statement = { en = "In a meta-analysis, sleep restriction had a small negative effect on adaptive emotion regulation (g = -0.32) and no significant effect on maladaptive emotion regulation, in studies conducted only with young people.", cs = "V metaanalýze mělo omezení spánku malý negativní účinek na adaptivní regulaci emocí (g = -0,32) a žádný významný účinek na neadaptivní regulaci emocí, a to ve studiích prováděných jen s mladými lidmi." }
claim_type = "empirical"
evidence_level = "A"
confidence = "MODERATE"
sources = ["tomaso-2021"]
scope = { en = "Meta-analysed experiments on sleep loss and emotion regulation; all adaptive-regulation studies used youth samples.", cs = "Metaanalyzované experimenty o ztrátě spánku a regulaci emocí; všechny studie adaptivní regulace používaly vzorky dětí a dospívajících." }
caveat = { en = "The pooled regulation effect rests on youth samples only; effects in adults are not established by this source.", cs = "Souhrnný účinek na regulaci stojí jen na vzorcích dětí a dospívajících; účinky u dospělých tento zdroj nedokládá." }
used_in = ["research/sleep-and-emotion-regulation/index.md"]
last_reviewed = 2026-09-14
review_due = 2027-09-14

[[claims]]
id = "sleep-regulation-processes-understudied"
statement = { en = "A narrative review of the field observed that research on sleep and emotion has focused more on emotions generated after inadequate sleep than on the regulatory processes that may alter them, with constructs often poorly delineated.", cs = "Přehledová studie oboru konstatovala, že výzkum spánku a emocí se zaměřoval spíše na emoce vznikající po nedostatečném spánku než na regulační procesy, které je mohou měnit, přičemž konstrukty bývaly nejasně vymezené." }
claim_type = "empirical"
evidence_level = "D"
confidence = "MODERATE"
sources = ["palmer-alfano-2017"]
scope = { en = "A narrative review organised by the process model of emotion regulation.", cs = "Přehledová studie uspořádaná podle procesního modelu regulace emocí." }
caveat = { en = "A narrative review, not a systematic synthesis; it describes the state of a literature that has grown since 2017.", cs = "Jde o narativní přehled, nikoli systematickou syntézu; popisuje stav literatury, která od roku 2017 dále narostla." }
used_in = ["research/sleep-and-emotion-regulation/index.md"]
last_reviewed = 2026-09-14
review_due = 2027-09-14

[[claims]]
id = "overnight-emotional-processing-hypothesis"
statement = { en = "A model proposes that sleep, including REM sleep, modulates next-day emotional reactivity and reprocesses recent emotional memories; it remains a hypothesis under test.", cs = "Model navrhuje, že spánek včetně fáze REM moduluje emoční reaktivitu následujícího dne a znovu zpracovává nedávné emoční vzpomínky; jde stále o testovanou hypotézu." }
