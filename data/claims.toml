caveat = { en = "Average effects are small to medium and vary with the emotion, the tactic and the person; the habitual-use findings are correlational.", cs = "Průměrné účinky jsou malé až střední a liší se podle emoce, taktiky a člověka; zjištění o obvyklém používání jsou korelační." }
used_in = ["research/clinical-perspectives/index.md", "research/venting-hypothesis/index.md", "advice/reappraise/index.md"]
last_reviewed = 2026-09-14
review_due = 2027-09-14

[[claims]]
id = "reappraisal-family-of-tactics"
statement = { en = "Reappraisal is better described as a family of tactics, changing how a situation is construed or which goals are used to evaluate it, than as a single technique.", cs = "Přehodnocení lépe vystihuje rodina taktik, které mění, jak je situace chápána nebo podle jakých cílů je hodnocena, než jediná technika." }
