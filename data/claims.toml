caveat = { en = "Later meta-analytic evidence that sleep loss blunts arousal responses complicates simple accounts of heightened reactivity; neural findings are associations with measured activity.", cs = "Pozdější metaanalytické doklady, že ztráta spánku reakce arousalu tlumí, komplikují jednoduché výklady zvýšené reaktivity; neurální zjištění jsou souvislosti s měřenou aktivitou." }
used_in = ["research/sleep-and-emotion-regulation/index.md"]
