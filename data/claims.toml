# Claims ledger. Every public claim the site makes, with its type, strength, sources and review dates.
# scripts/validate-claims.py enforces vocabulary, source consistency, review intervals and staleness.
#
# evidence_level never exceeds the strongest level among a claim's sources (data/sources.toml).
# Review intervals: clinical-boundary 180 days, empirical 365 days, all other types 730 days.

# ── History and definition ────────────────────────────────────────────────────────────────────────

[[claims]]
id = "katharsis-classical-meaning"
statement = { en = "Aristotle's Poetics describes tragedy as achieving, through pity and fear, the katharsis of such emotions, and commentators still debate whether he meant purgation, purification or clarification.", cs = "Aristotelova Poetika popisuje tragédii jako dílo, které skrze soucit a strach dosahuje katarze těchto emocí, a komentátoři se dodnes přou, zda tím myslel očistu, zušlechtění, nebo vyjasnění." }
claim_type = "historical"
evidence_level = "E"
confidence = "HIGH"
sources = ["aristotle-poetics"]
scope = { en = "The classical text and its interpretive tradition.", cs = "Klasický text a tradice jeho výkladu." }
caveat = { en = "The passage is brief and Aristotle does not define the term further; no reading is settled.", cs = "Pasáž je krátká a Aristotelés pojem blíže nevymezuje; žádný výklad není uzavřený." }
used_in = ["_index.md", "research/what-is-catharsis/index.md"]
last_reviewed = 2026-09-14
review_due = 2028-09-13

[[claims]]
id = "cathartic-method-relief-temporary"
statement = { en = "Breuer and Freud's cathartic method sought symptom relief through the discharge of emotion (abreaction), and Freud later abandoned it, partly because relief was often temporary.", cs = "Katarzní metoda Breuera a Freuda usilovala o úlevu od symptomů vybitím emoce (abreakcí) a Freud ji později opustil, mimo jiné proto, že úleva byla často jen dočasná." }
claim_type = "historical"
evidence_level = "E"
confidence = "MODERATE"
sources = ["breuer-freud-1895"]
scope = { en = "The history of late nineteenth-century clinical practice.", cs = "Dějiny klinické praxe konce 19. století." }
caveat = { en = "Freud's reasons for leaving the method are reconstructed from his later writings and historical accounts, which are not separately cited here.", cs = "Freudovy důvody pro opuštění metody jsou rekonstruovány z jeho pozdějších textů a historických prací, které zde nejsou samostatně citovány." }
used_in = ["_index.md", "research/what-is-catharsis/index.md"]
last_reviewed = 2026-09-14
review_due = 2028-09-13

[[claims]]
id = "catharsis-working-definition"
statement = { en = "On this site, catharsis means a subjectively felt release of emotional tension after expression, exertion or immersion; whether the cause of the tension changes is treated as a separate empirical question.", cs = "Na tomto webu katarze znamená subjektivně prožívané uvolnění emočního napětí po projevu, námaze nebo ponoření do zážitku; zda se změní příčina napětí, je chápáno jako samostatná empirická otázka." }
claim_type = "theoretical"
evidence_level = "E"
confidence = "HIGH"
sources = []
scope = { en = "A working definition adopted by this project, not a consensus definition in psychology.", cs = "Pracovní definice přijatá tímto projektem, nikoli konsenzuální definice v psychologii." }
caveat = { en = "Other authors use catharsis for purgation, for clarification or for venting; findings stated in their terms do not map one-to-one onto this definition.", cs = "Jiní autoři používají slovo katarze pro očistu, vyjasnění nebo ventilování; jejich zjištění se na tuto definici nepřevádějí jedna ku jedné." }
used_in = ["_index.md", "research/what-is-catharsis/index.md", "glossary/index.md"]
last_reviewed = 2026-09-14
review_due = 2028-09-13

[[claims]]
id = "expressive-writing-coherence"
statement = { en = "Writing about both the facts and the feelings of a distressing experience has been associated with later health benefits, and these benefits appear linked to building a coherent account rather than to discharge alone.", cs = "Psaní o faktech i pocitech spojených s tíživým zážitkem bylo spojeno s pozdějšími zdravotními přínosy, které podle všeho souvisejí spíše s vytvářením souvislého příběhu než se samotným vybitím emocí." }
claim_type = "empirical"
evidence_level = "B"
confidence = "MODERATE"
sources = ["pennebaker-beall-1986", "pennebaker-1997"]
scope = { en = "Structured writing over several short sessions, mostly in student and non-clinical samples.", cs = "Strukturované psaní v několika krátkých sezeních, převážně ve studentských a neklinických vzorcích." }
caveat = { en = "Effects vary across studies; short-term distress often rises after writing, and it is not a treatment for severe or recent trauma. The 1986 abstract could not be re-verified.", cs = "Účinky se mezi studiemi liší; krátkodobý distres po psaní často stoupá a nejde o léčbu závažného nebo čerstvého traumatu. Abstrakt studie z roku 1986 nebylo možné znovu ověřit." }
used_in = ["research/what-is-catharsis/index.md", "research/crying-and-sharing/index.md", "advice/write-to-make-sense/index.md"]
last_reviewed = 2026-09-14
review_due = 2027-09-14

# ── Venting and anger ─────────────────────────────────────────────────────────────────────────────

[[claims]]
id = "venting-increases-anger"
statement = { en = "In laboratory experiments, hitting a punching bag while thinking about a provocation produced more anger and aggression than sitting quietly, and belief in catharsis increased the wish to vent without reducing later aggression.", cs = "V laboratorních experimentech vedlo bušení do boxovacího pytle při myšlenkách na provokaci k většímu hněvu a agresi než klidné sezení a víra v katarzi zvyšovala chuť ventilovat, aniž by snižovala pozdější agresi." }
claim_type = "empirical"
evidence_level = "B"
confidence = "HIGH"
sources = ["bushman-2002", "bushman-baumeister-stack-1999"]
scope = { en = "Short-term anger and laboratory aggression after brief provocations, mostly in university students.", cs = "Krátkodobý hněv a laboratorní agrese po krátké provokaci, převážně u vysokoškolských studentů." }
caveat = { en = "Aggression was measured with standardised laboratory tasks; the studies do not describe long-term outcomes or every form of emotional expression, and they are not about dancing or music.", cs = "Agrese byla měřena standardizovanými laboratorními úlohami; studie nepopisují dlouhodobé výsledky ani všechny formy vyjádření emocí a netýkají se tance ani hudby." }
used_in = ["_index.md", "research/venting-hypothesis/index.md", "research/what-is-catharsis/index.md", "advice/let-anger-cool/index.md"]
last_reviewed = 2026-09-14
review_due = 2027-09-14

[[claims]]
id = "arousal-increasing-activities-ineffective"
statement = { en = "A meta-analysis of 154 studies found that arousal-increasing anger-management activities, such as hitting a bag or running, did not reduce anger and aggression overall (g = -0.02, 95% CI -0.13 to 0.09).", cs = "Metaanalýza 154 studií zjistila, že aktivity zvládání hněvu zvyšující vzrušení, například bušení do pytle nebo běh, celkově nesnižovaly hněv ani agresi (g = −0,02, 95% CI −0,13 až 0,09)." }
claim_type = "empirical"
evidence_level = "A"
confidence = "MODERATE"
sources = ["kjaervik-bushman-2024"]
scope = { en = "Anger and aggression outcomes across 184 samples and 10,189 participants in laboratory and field settings.", cs = "Hněv a agrese napříč 184 vzorky a 10 189 účastníky v laboratorních i terénních podmínkách." }
caveat = { en = "The pooled effect was close to zero but the arousal-increasing studies were heterogeneous, so some activities in some contexts may differ; physical exercise has other benefits.", cs = "Souhrnný účinek byl blízký nule, ale studie aktivit zvyšujících vzrušení byly heterogenní, takže některé aktivity v některých kontextech se mohou lišit; pohyb má i jiné přínosy." }
used_in = ["_index.md", "research/venting-hypothesis/index.md", "advice/let-anger-cool/index.md"]
last_reviewed = 2026-09-14
review_due = 2027-09-14

[[claims]]
id = "arousal-decreasing-activities-reduce-anger"
statement = { en = "The same meta-analysis found that arousal-decreasing activities, such as slow breathing, relaxation and mindfulness, reduced anger and aggression (g = -0.63, 95% CI -0.82 to -0.43), with robust effects across populations and delivery formats.", cs = "Tatáž metaanalýza zjistila, že aktivity snižující vzrušení, například pomalé dýchání, relaxace a všímavost, snižovaly hněv a agresi (g = −0,63, 95% CI −0,82 až −0,43) a že účinky byly robustní napříč populacemi i formami provedení." }
claim_type = "empirical"
evidence_level = "A"
confidence = "HIGH"
sources = ["kjaervik-bushman-2024"]
scope = { en = "Students, non-students, offenders and people with and without intellectual disabilities, in group, individual, digital, laboratory and field formats.", cs = "Studenti, nestudenti, pachatelé a lidé s mentálním postižením i bez něj, ve skupinových, individuálních, digitálních, laboratorních i terénních formátech." }
caveat = { en = "A pooled average does not predict the effect for an individual, and frequent or harmful anger warrants professional help.", cs = "Souhrnný průměr nepředpovídá účinek u jednotlivce a častý nebo škodlivý hněv vyžaduje odbornou pomoc." }
used_in = ["_index.md", "research/venting-hypothesis/index.md", "advice/let-anger-cool/index.md"]
last_reviewed = 2026-09-14
review_due = 2027-09-14

[[claims]]
id = "catharsis-distinct-from-venting"
statement = { en = "Catharsis as a felt release and venting as the expression of anger at a target are distinct; evidence that venting fails to reduce anger does not by itself test dance, music or collective release.", cs = "Katarze jako prožívaná úleva a ventilování jako vyjádření hněvu vůči cíli jsou odlišné věci; doklady, že ventilování hněv nesnižuje, samy o sobě netestují tanec, hudbu ani kolektivní uvolnění." }
claim_type = "theoretical"
evidence_level = "E"
confidence = "HIGH"
sources = []
scope = { en = "How findings on venting are applied across this site.", cs = "Jak jsou zjištění o ventilování na tomto webu uplatňována." }
caveat = { en = "The distinction is conceptual; the shared point is only that a feeling of release is not evidence that the cause of an emotion has changed.", cs = "Rozlišení je koncepční; společné je pouze to, že pocit úlevy není dokladem, že se změnila příčina emoce." }
used_in = ["research/venting-hypothesis/index.md", "glossary/index.md"]
last_reviewed = 2026-09-14
review_due = 2028-09-13

# ── Emotion regulation ────────────────────────────────────────────────────────────────────────────

[[claims]]
id = "reappraisal-changes-emotional-experience"
statement = { en = "Instructed cognitive change such as reappraisal had a small-to-medium effect on emotional outcomes, whereas attempts to suppress the experience of emotion were not effective; habitual reappraisal is associated with more positive and less negative emotion than habitual suppression.", cs = "Instruovaná kognitivní změna, například přehodnocení, měla malý až střední účinek na emoční výsledky, zatímco snaha potlačit prožitek emoce účinná nebyla; obvyklé přehodnocování souvisí s více pozitivními a méně negativními emocemi než obvyklé potlačování." }
