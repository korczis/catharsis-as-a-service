statement = { en = "Allostatic load has been described as the cumulative cost of stress responses that are activated too often or not terminated efficiently, which implies that load can build up when challenges recur faster than recovery.", cs = "Alostatická zátěž byla popsána jako kumulativní cena stresových reakcí, které se aktivují příliš často nebo se neukončují účinně, z čehož plyne, že se zátěž může hromadit, když se nároky opakují rychleji, než probíhá zotavení." }
claim_type = "theoretical"
evidence_level = "D"
confidence = "MODERATE"
sources = ["mcewen-1998"]
scope = { en = "A conceptual framework, illustrated with arbitrary units in the allostatic-load model.", cs = "Koncepční rámec ilustrovaný v modelu alostatické zátěže libovolnými jednotkami." }
caveat = { en = "The measurement of allostatic load is debated, and the model's linear input and proportional recovery are simplifications with no physiological calibration.", cs = "Měření alostatické zátěže je předmětem debat a lineární přírůstek i poměrné zotavení v modelu jsou zjednodušení bez fyziologické kalibrace." }
used_in = ["models/index.md"]
last_reviewed = 2026-09-14
review_due = 2028-09-13

[[claims]]
id = "mourning-rituals-lower-grief-short-term"
statement = { en = "In three experiments, reflecting on past rituals or completing a novel ritual after a loss was followed by lower self-reported grief, mediated by increased feelings of control, including in people who did not believe in rituals.", cs = "Ve třech experimentech po zamyšlení nad dřívějšími rituály nebo po provedení nového rituálu po ztrátě následoval nižší uváděný zármutek, zprostředkovaný zvýšeným pocitem kontroly, a to i u lidí, kteří v rituály nevěřili." }
claim_type = "empirical"
evidence_level = "B"
confidence = "MODERATE"
sources = ["norton-gino-2014"]
scope = { en = "Short-term self-reported grief after recalled bereavements and after non-bereavement losses such as a relationship or a lottery chance.", cs = "Krátkodobě uváděný zármutek po vybavovaných úmrtích blízkých a po jiných ztrátách, například vztahu nebo šance na výhru." }
caveat = { en = "One set of experiments; effects over months after bereavement and effects on prolonged grief were not measured.", cs = "Jediná sada experimentů; účinky v řádu měsíců po úmrtí blízkého a účinky na prolongované truchlení nebyly měřeny." }
used_in = ["research/grief-and-rituals/index.md", "advice/mark-a-loss-with-a-ritual/index.md"]
last_reviewed = 2026-09-14
review_due = 2027-09-14

[[claims]]
id = "funeral-rituals-valued-not-associated-with-grief"
statement = { en = "Bereaved adults rated funerals and grief rituals as helpful, but neither their evaluation of the funeral nor their use of rituals was significantly associated with grief reactions six months and three years after the loss.", cs = "Pozůstalí dospělí hodnotili pohřby a rituály truchlení jako užitečné, ale ani hodnocení pohřbu, ani užívání rituálů významně nesouviselo s reakcemi zármutku šest měsíců a tři roky po ztrátě." }
claim_type = "empirical"
evidence_level = "C"
confidence = "MODERATE"
sources = ["mitima-verloop-2021"]
scope = { en = "Questionnaire data from bereaved adults in the Netherlands.", cs = "Dotazníková data od pozůstalých dospělých v Nizozemsku." }
caveat = { en = "A correlational design in one country; people with more distress may use rituals more, which could mask an effect.", cs = "Korelační design v jedné zemi; lidé s větší tísní mohou rituály využívat častěji, což by mohlo účinek zakrýt." }
used_in = ["research/grief-and-rituals/index.md", "advice/mark-a-loss-with-a-ritual/index.md"]
last_reviewed = 2026-09-14
review_due = 2027-09-14

[[claims]]
id = "most-bereaved-adapt-without-intervention"
statement = { en = "Bereavement is associated with excess health risks, yet most bereaved people adjust without professional psychological intervention, and in a prospective study of spousal loss resilience was the most frequent trajectory.", cs = "Ztráta blízkého souvisí se zvýšenými zdravotními riziky, přesto se většina pozůstalých vyrovná bez odborné psychologické intervence a v prospektivní studii ztráty partnera byla nejčastější trajektorií odolnost." }
claim_type = "empirical"
evidence_level = "C"
confidence = "MODERATE"
sources = ["stroebe-schut-stroebe-2007", "bonanno-2002"]
scope = { en = "Adult bereavement; the trajectory data come from older adults who lost a spouse.", cs = "Ztráta blízkého v dospělosti; data o trajektoriích pocházejí od starších dospělých, kteří ztratili partnera." }
caveat = { en = "Trajectories after sudden, violent or child deaths may differ, and resilience describes measured symptoms and functioning, not the absence of missing the person.", cs = "Průběh po náhlém či násilném úmrtí nebo po úmrtí dítěte se může lišit a odolnost popisuje měřené příznaky a fungování, nikoli to, že by člověku zemřelý nechyběl." }
used_in = ["research/grief-and-rituals/index.md", "advice/mark-a-loss-with-a-ritual/index.md"]
last_reviewed = 2026-09-14
review_due = 2027-09-14

[[claims]]
id = "grief-oscillation-and-continuing-bonds"
statement = { en = "Contemporary bereavement theory describes adaptive coping as oscillation between confronting the loss and attending to restoration, including respite from grieving, and treats continuing bonds with the deceased as common, with their adaptiveness still unresolved; rituals have been proposed to regulate emotion, goals and social connection.", cs = "Současná teorie truchlení popisuje adaptivní vyrovnávání jako střídání konfrontace se ztrátou a péče o obnovu včetně oddechu od truchlení a pokračující pouta se zemřelým považuje za běžná, přičemž otázka jejich adaptivnosti zůstává otevřená; rituálům se připisuje regulace emocí, cílů a sociálního propojení." }
claim_type = "theoretical"
evidence_level = "D"
confidence = "MODERATE"
sources = ["stroebe-schut-1999", "stroebe-schut-boerner-2010", "hobson-2018"]
scope = { en = "Theoretical models of bereavement and ritual.", cs = "Teoretické modely truchlení a rituálu." }
caveat = { en = "Models and frameworks that generate predictions; they do not establish which way of grieving or which ritual helps a particular person.", cs = "Modely a rámce, které generují předpovědi; neurčují, jaký způsob truchlení nebo jaký rituál pomůže konkrétnímu člověku." }
used_in = ["research/grief-and-rituals/index.md", "advice/mark-a-loss-with-a-ritual/index.md"]
last_reviewed = 2026-09-14
review_due = 2028-09-13

[[claims]]
id = "prolonged-grief-clinical-boundary"
statement = { en = "A minority of bereaved adults develop prolonged grief disorder, characterised by intense yearning and other symptoms persisting for months after a death with functional impairment (at least six months in the 2009 proposal and in ICD-11; at least 12 months for adults in DSM-5-TR); a meta-analysis of non-violent bereavement estimated a pooled prevalence of 9.8%. The criteria describe a clinical boundary for professionals, not a self-test.", cs = "U menšiny pozůstalých dospělých se rozvine prolongovaná porucha truchlení, charakterizovaná intenzivním steskem a dalšími příznaky přetrvávajícími měsíce po úmrtí spolu s narušeným fungováním (nejméně šest měsíců v návrhu z roku 2009 a v MKN-11; nejméně 12 měsíců u dospělých v DSM-5-TR); metaanalýza nenásilných úmrtí odhadla souhrnnou prevalenci na 9,8 %. Kritéria vymezují klinickou hranici pro odborníky, nejsou testem pro samotné čtenáře." }
claim_type = "clinical-boundary"
evidence_level = "C"
confidence = "MODERATE"
sources = ["prigerson-2009", "lundorff-2017"]
scope = { en = "Adults after bereavement; prevalence from studies of non-violent deaths.", cs = "Dospělí po ztrátě blízkého; prevalence ze studií nenásilných úmrtí." }
caveat = { en = "The 2009 criteria preceded the ICD-11 and DSM-5-TR definitions, which differ in the required duration; the prevalence studies were heterogeneous and of limited representativeness. Assessment requires a qualified professional.", cs = "Kritéria z roku 2009 předcházela definicím v MKN-11 a DSM-5-TR, které se liší v požadované době trvání; studie prevalence byly heterogenní a omezeně reprezentativní. Posouzení vyžaduje kvalifikovaného odborníka." }
used_in = ["research/grief-and-rituals/index.md", "advice/mark-a-loss-with-a-ritual/index.md"]
last_reviewed = 2026-09-14
review_due = 2027-03-13

[[claims]]
id = "grief-interventions-work-best-when-targeted"
statement = { en = "Psychological interventions for grief show small average benefits, with little lasting benefit for unselected bereaved people and larger effects in trials that enrolled people with marked or high grief symptoms and in trials of people at least six months after the loss, which are separate study-level moderators.", cs = "Psychologické intervence pro zármutek vykazují malé průměrné přínosy, s malým trvalým přínosem pro neselektované pozůstalé a s většími účinky ve studiích, které zařadily lidi s výraznými nebo vysokými příznaky zármutku, a ve studiích lidí nejméně šest měsíců po ztrátě; jde o dva samostatné moderátory na úrovni studií." }
claim_type = "empirical"
evidence_level = "A"
confidence = "MODERATE"
sources = ["currier-2008", "johannsen-2019"]
scope = { en = "Controlled and randomised trials of psychological interventions for bereaved adults.", cs = "Kontrolované a randomizované studie psychologických intervencí pro pozůstalé dospělé." }
caveat = { en = "Trials were heterogeneous and of varying quality, with signs of publication bias; moderator findings compare studies rather than testing conditions directly.", cs = "Studie byly heterogenní a různé kvality se známkami publikačního zkreslení; zjištění o moderátorech srovnávají studie, netestují podmínky přímo." }
used_in = ["research/grief-and-rituals/index.md", "advice/mark-a-loss-with-a-ritual/index.md"]
last_reviewed = 2026-09-14
review_due = 2027-09-14

[[claims]]
id = "grief-when-to-seek-help"
statement = { en = "Grief that remains intense and disabling for many months, persistent inability to function, or thoughts of ending one's life warrant contact with a qualified professional, and immediate danger warrants contacting local emergency services; seeking help does not mean grief has gone wrong.", cs = "Zármutek, který zůstává po mnoho měsíců intenzivní a ochromující, trvalá neschopnost fungovat nebo myšlenky na ukončení života jsou důvodem obrátit se na kvalifikovaného odborníka a bezprostřední nebezpečí je důvodem kontaktovat místní tísňové služby; vyhledání pomoci neznamená, že se zármutek pokazil." }
claim_type = "clinical-boundary"
evidence_level = "E"
confidence = "HIGH"
sources = []
scope = { en = "Readers of the grief, exercise, sleep and rumination pages, especially after a loss or with persistent low mood.", cs = "Čtenáři stránek o zármutku, pohybu, spánku a ruminaci, zejména po ztrátě nebo při přetrvávající skleslosti." }
caveat = { en = "A safety policy aligned with standard clinical guidance; thresholds and services differ by country, and the page assesses no one.", cs = "Bezpečnostní zásada v souladu s běžnými klinickými doporučeními; prahy a služby se v jednotlivých zemích liší a stránka nikoho neposuzuje." }
used_in = ["research/grief-and-rituals/index.md", "advice/mark-a-loss-with-a-ritual/index.md", "advice/move-to-lower-arousal-and-lift-mood/index.md", "advice/protect-sleep-after-strain/index.md", "advice/interrupt-rumination-with-concrete-steps/index.md"]
