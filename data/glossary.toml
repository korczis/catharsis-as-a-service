# Glossary of terms used across the site. Rendered at /glossary/ and /cs/slovnik/; exported to the content API.
# Fields: id (kebab-case, unique, also the anchor), term.en/cs, definition.en/cs (2–4 sentences),
# kind (empirical | theoretical | clinical | technical | artistic | historical), see_also (term ids),
# links (content paths that must exist), references (ids from data/references.toml).

[[terms]]
id = "abreaction"
term = { en = "Abreaction", cs = "Abreakce" }
definition = { en = "The discharge of emotion attached to a recalled distressing memory, as described by Breuer and Freud in their cathartic method. They reported that symptoms eased after abreaction, but the relief was often temporary, and Freud later abandoned the method. The term survives mainly as a historical reference point for the idea that expressing an emotion empties it.", cs = "Výboj emoce spojené s vybavenou tíživou vzpomínkou, jak jej Breuer a Freud popsali v rámci katarzní metody. Uváděli, že po abreakci příznaky polevily, úleva však byla často jen dočasná a Freud od metody později upustil. Pojem dnes slouží hlavně jako historický bod odkazu pro představu, že vyjádřením se emoce vyprázdní." }
kind = "historical"
see_also = ["catharsis", "hydraulic-model", "venting"]
links = ["research/what-is-catharsis/index.md"]
references = ["breuer-freud-1895"]

[[terms]]
id = "acceptance"
term = { en = "Acceptance", cs = "Přijetí" }
definition = { en = "In emotion regulation, a strategy of allowing emotions, thoughts and bodily sensations to be present without trying to change, suppress or escape them. It differs from reappraisal, which changes the meaning of a situation, and from resignation, because acceptance concerns internal experience rather than the circumstances that produce it. Acceptance is a central process in acceptance- and mindfulness-based therapies; meta-analytic work compares its neural correlates with those of reappraisal, and the two appear to rely on partly different networks.", cs = "V regulaci emocí strategie, při níž člověk nechává emoce, myšlenky a tělesné pocity být, aniž by se je snažil změnit, potlačit nebo před nimi uniknout. Liší se od přehodnocení, které mění význam situace, i od rezignace, protože se týká vnitřního prožívání, nikoli okolností, které je vyvolávají. Přijetí je ústředním procesem terapií založených na přijetí a všímavosti; metaanalytické práce srovnávají jeho neurální koreláty s koreláty přehodnocení a obě strategie se zdají opírat o částečně odlišné sítě." }
kind = "clinical"
see_also = ["reappraisal", "experiential-avoidance", "emotion-regulation"]
links = ["research/clinical-perspectives/index.md", "research/relief-is-not-resolution/index.md"]
references = ["hayes-1996", "hofmann-2010", "monachesi-2023"]

[[terms]]
id = "affect"
term = { en = "Affect", cs = "Afekt" }
definition = { en = "An umbrella term for felt states that have a pleasant or unpleasant quality and some degree of activation, including emotions, moods and momentary feelings. Many researchers describe core affect along two dimensions, valence and arousal. Usage varies between traditions: in some writing affect is a synonym for emotion, in others it names the more basic feeling component underlying both emotion and mood.", cs = "Zastřešující pojem pro prožívané stavy, které mají příjemnou či nepříjemnou kvalitu a určitou míru aktivace, včetně emocí, nálad a okamžitých pocitů. Mnoho badatelů popisuje takzvaný jádrový afekt pomocí dvou dimenzí, valence a arousalu. Užití se mezi tradicemi liší: v některých textech je afekt synonymem emoce, v jiných označuje základnější pocitovou složku, na které stojí emoce i nálada." }
kind = "theoretical"
see_also = ["emotion", "mood", "valence", "arousal"]
links = ["research/measuring-emotion/index.md"]
references = ["mauss-robinson-2009"]

[[terms]]
id = "affect-labeling"
term = { en = "Affect labeling", cs = "Pojmenování afektu" }
definition = { en = "Putting a feeling into words, for example naming an emotional reaction to an image instead of only looking at it. In a neuroimaging study, labeling the emotion in facial expressions was associated with lower amygdala activity and higher activity in right ventrolateral prefrontal cortex than passive viewing or labeling other attributes. The effect is usually described as implicit regulation, because it does not require a deliberate intention to feel differently.", cs = "Převedení pocitu do slov, například pojmenování emoční reakce na obrázek místo pouhého pozorování. V neurozobrazovací studii bylo pojmenování emoce ve výrazech tváří spojeno s nižší aktivitou amygdaly a vyšší aktivitou pravé ventrolaterální prefrontální kůry než pasivní pozorování nebo pojmenování jiných vlastností. Účinek se obvykle popisuje jako implicitní regulace, protože nevyžaduje záměrnou snahu cítit se jinak." }
kind = "empirical"
see_also = ["emotion-regulation", "social-sharing-of-emotion", "expressive-writing"]
links = ["research/crying-and-sharing/index.md", "advice/name-the-feeling/index.md"]
references = ["lieberman-2007"]

[[terms]]
id = "affective-computing"
term = { en = "Affective computing", cs = "Afektivní informatika" }
definition = { en = "The study and development of computing systems that recognise, interpret, simulate or respond to human affect, a research programme named by Rosalind Picard in 1997. In practice such systems estimate emotional categories or dimensions from signals such as facial movements, voice, text or physiology, and the validity of those estimates depends on the assumed link between signal and state. The field also raises ethical questions about consent, surveillance and the use of such inferences in consequential decisions.", cs = "Obor zkoumající a vyvíjející výpočetní systémy, které rozpoznávají, interpretují, simulují nebo reagují na lidský afekt; výzkumný program pojmenovala Rosalind Picardová v roce 1997. V praxi takové systémy odhadují emoční kategorie nebo dimenze ze signálů, jako jsou pohyby obličeje, hlas, text nebo fyziologie, a platnost těchto odhadů závisí na předpokládaném vztahu mezi signálem a stavem. Obor zároveň otevírá etické otázky souhlasu, sledování a využití takových odhadů při rozhodnutích se závažnými důsledky." }
kind = "technical"
see_also = ["inference", "reverse-inference", "multimodality", "construct-validity"]
links = ["research/measuring-emotion/index.md"]
references = ["picard-1997", "barrett-2019", "stark-hoey-2021"]

[[terms]]
id = "allostatic-load"
term = { en = "Allostatic load", cs = "Alostatická zátěž" }
definition = { en = "The cumulative physiological cost of repeated or prolonged activation of stress-response systems. McEwen described how stress mediators such as cortisol and catecholamines are protective in the short term but can contribute to wear on cardiovascular, metabolic and immune function when activation is frequent, prolonged or poorly terminated. The concept concerns patterns over months and years, not the response to a single stressful episode.", cs = "Kumulativní fyziologická cena opakované nebo dlouhodobé aktivace systémů stresové odpovědi. McEwen popsal, jak stresové mediátory, například kortizol a katecholaminy, působí krátkodobě ochranně, ale při častém, dlouhém nebo nedostatečně ukončeném působení mohou přispívat k opotřebení kardiovaskulárních, metabolických a imunitních funkcí. Pojem se týká vzorců v průběhu měsíců a let, nikoli reakce na jedinou stresovou epizodu." }
kind = "theoretical"
see_also = ["autonomic-nervous-system", "social-support"]
links = ["research/stress-and-social-buffering/index.md"]
references = ["mcewen-1998"]

[[terms]]
id = "arousal"
term = { en = "Arousal", cs = "Arousal (aktivace)" }
definition = { en = "The degree of physiological and subjective activation, ranging from calm or sleepy to excited or agitated. Arousal is one of the two dimensions commonly used to describe affect, alongside valence, and it is indexed by self-report and by autonomic measures such as electrodermal activity and heart rate. A meta-analysis of anger management activities found that activities which decrease arousal reduced anger, whereas activities which increase arousal did not reliably do so.", cs = "Míra fyziologické a subjektivní aktivace v rozmezí od klidu či ospalosti po vzrušení či neklid. Arousal je vedle valence jednou ze dvou dimenzí, kterými se afekt běžně popisuje, a zachycuje se sebeposouzením i autonomními ukazateli, jako je elektrodermální aktivita a srdeční frekvence. Metaanalýza aktivit pro zvládání hněvu zjistila, že aktivity snižující arousal hněv snižovaly, zatímco aktivity arousal zvyšující jej spolehlivě nesnižovaly." }
kind = "empirical"
see_also = ["valence", "affect", "electrodermal-activity", "venting"]
links = ["research/venting-hypothesis/index.md", "research/measuring-emotion/index.md"]
references = ["mauss-robinson-2009", "kjaervik-bushman-2024", "kreibig-2010"]

[[terms]]
id = "autonomic-nervous-system"
term = { en = "Autonomic nervous system", cs = "Autonomní nervový systém" }
definition = { en = "The part of the peripheral nervous system that regulates largely involuntary functions such as heart rate, breathing, sweating and digestion, through sympathetic and parasympathetic branches. Emotional episodes are accompanied by changes in autonomic activity, which is why measures such as heart rate variability and electrodermal activity appear in emotion research. Meta-analytic evidence indicates that autonomic patterns vary widely within emotion categories and do not form consistent, category-specific fingerprints.", cs = "Část periferního nervového systému, která prostřednictvím sympatické a parasympatické větve reguluje převážně bezděčné funkce, jako je srdeční frekvence, dýchání, pocení a trávení. Emoční epizody provázejí změny autonomní aktivity, a proto se ve výzkumu emocí používají ukazatele jako variabilita srdeční frekvence a elektrodermální aktivita. Metaanalytické poznatky ukazují, že autonomní vzorce se v rámci jednotlivých emočních kategorií značně liší a netvoří konzistentní otisky specifické pro danou kategorii." }
kind = "empirical"
see_also = ["heart-rate-variability", "electrodermal-activity", "arousal", "allostatic-load"]
links = ["research/stress-and-social-buffering/index.md", "research/measuring-emotion/index.md"]
references = ["kreibig-2010", "siegel-2018"]

[[terms]]
id = "baseline"
term = { en = "Baseline", cs = "Výchozí hodnota (baseline)" }
definition = { en = "A reference measurement taken before or outside the condition of interest, against which change is evaluated. Physiological signals differ greatly between people and between moments, so a value such as skin conductance or heart rate variability is interpretable mainly relative to a person's own baseline recorded under comparable conditions. Methodological recommendations therefore specify the duration, posture and context of baseline recordings.", cs = "Referenční měření pořízené před sledovanou podmínkou nebo mimo ni, vůči němuž se hodnotí změna. Fyziologické signály se mezi lidmi i mezi okamžiky výrazně liší, takže hodnotu jako kožní vodivost nebo variabilitu srdeční frekvence lze interpretovat hlavně ve vztahu k vlastní výchozí hodnotě daného člověka, zaznamenané za srovnatelných podmínek. Metodická doporučení proto stanovují délku, polohu těla a kontext výchozího záznamu." }
kind = "technical"
see_also = ["signal", "heart-rate-variability", "electrodermal-activity", "context"]
links = ["methods/index.md"]
references = ["laborde-2017", "boucsein-2012"]

[[terms]]
id = "catharsis"
term = { en = "Catharsis", cs = "Katarze" }
definition = { en = "From the Greek for cleansing; Aristotle used it for what tragedy achieves through pity and fear, and commentators have read it as purgation, purification or clarification. Breuer and Freud turned it into a clinical method of emotional discharge, and empirical psychology turned it into a testable claim that expressing an emotion reduces it. On this site catharsis means a subjectively felt release of emotional tension after expression, exertion or immersion, without any assumption that the cause of the tension has changed.", cs = "Z řeckého slova pro očištění; Aristotelés jím označil to, čeho tragédie dosahuje skrze soucit a strach, a komentátoři jej četli jako očistu, zušlechtění nebo objasnění. Breuer a Freud z něj udělali klinickou metodu emočního výboje a empirická psychologie testovatelné tvrzení, že vyjádření emoce ji zmírní. Na tomto webu katarze znamená subjektivně prožívané uvolnění emočního napětí po vyjádření, námaze nebo ponoření do zážitku, bez předpokladu, že se změnila příčina napětí." }
kind = "historical"
see_also = ["abreaction", "venting", "hydraulic-model", "relief-vs-resolution"]
links = ["research/what-is-catharsis/index.md"]
references = ["aristotle-poetics", "breuer-freud-1895", "pennebaker-1997"]

[[terms]]
id = "clinical-boundary"
term = { en = "Clinical boundary", cs = "Klinická hranice" }
definition = { en = "The point at which self-help strategies and popular-science information are no longer an adequate response and professional assessment is appropriate. Common indications are distress that persists for weeks, that increasingly disrupts sleep, work or relationships, that follows a traumatic event and does not ease, or that involves thoughts of self-harm, which call for contacting a doctor or crisis service promptly. Crossing this boundary is not a failure of coping; effective, structured treatments exist, and the material on this site is not a substitute for them.", cs = "Bod, v němž svépomocné strategie a populárně-naučné informace přestávají být přiměřenou odpovědí a je namístě odborné posouzení. Obvyklými signály jsou potíže, které trvají týdny, stále více narušují spánek, práci nebo vztahy, přetrvávají po traumatické události, nebo zahrnují myšlenky na sebepoškození, kdy je vhodné neprodleně kontaktovat lékaře či krizovou službu. Překročení této hranice není selháním zvládání; existují účinné strukturované léčebné postupy a obsah tohoto webu je nenahrazuje." }
kind = "clinical"
see_also = ["psychological-debriefing", "emotional-processing", "rumination"]
links = ["research/clinical-perspectives/index.md", "advice/after-trauma/index.md"]
references = []

[[terms]]
id = "collective-effervescence"
term = { en = "Collective effervescence", cs = "Kolektivní efervescence" }
definition = { en = "A term from Rimé and colleagues for the heightened, shared emotional state that can arise during collective gatherings such as demonstrations, commemorations and festivals, marked by intense emotion, a sense of unity and increased social sharing. A meta-analytic review associated participation in such gatherings with stronger group identification and prosocial and collective-action outcomes. The evidence relies largely on self-report and cross-sectional designs, so the direction of these associations is not settled.", cs = "Pojem Rimého a kolegů pro zesílený sdílený emoční stav, který může vzniknout při kolektivních shromážděních, jako jsou demonstrace, vzpomínkové akce a slavnosti, a vyznačuje se intenzivními emocemi, pocitem jednoty a častějším sociálním sdílením. Metaanalytický přehled spojil účast na takových shromážděních se silnější identifikací se skupinou a s prosociálními výsledky a kolektivním jednáním. Poznatky se opírají převážně o sebeposouzení a průřezové designy, takže směr těchto souvislostí není vyjasněn." }
kind = "empirical"
see_also = ["interpersonal-synchrony", "social-sharing-of-emotion", "social-support"]
links = ["research/collective-synchrony/index.md"]
references = ["pizarro-2022", "rime-2009"]

[[terms]]
id = "confidence"
term = { en = "Confidence", cs = "Míra jistoty" }
definition = { en = "In the evidence ledger, a rating of how firmly a specific claim is supported: HIGH, MODERATE, LOW or UNKNOWN. It is distinct from the evidence level, which classifies the design of a source, because a claim resting on strong designs can still merit lower confidence when results are inconsistent, indirect or drawn from narrow samples. UNKNOWN marks claims for which the available sources do not allow a responsible judgement.", cs = "V evidenci tvrzení hodnocení toho, jak pevně je konkrétní tvrzení podloženo: HIGH (vysoká), MODERATE (střední), LOW (nízká) nebo UNKNOWN (neznámá). Liší se od úrovně důkazů, která klasifikuje design zdroje, protože i tvrzení opřené o silné designy si může zasloužit nižší jistotu, jsou-li výsledky nekonzistentní, nepřímé nebo získané na úzkých vzorcích. UNKNOWN označuje tvrzení, u nichž dostupné zdroje nedovolují zodpovědný úsudek." }
kind = "technical"
see_also = ["evidence-level", "effect-size", "meta-analysis"]
links = ["evidence/index.md", "methods/index.md"]
references = []

[[terms]]
id = "construct-validity"
term = { en = "Construct validity", cs = "Konstruktová validita" }
definition = { en = "The degree to which a measure captures the psychological construct it is meant to capture, rather than something correlated with it. For emotion, construct validity is difficult to establish because there is no single agreed criterion: self-report, behaviour and physiology each capture different aspects and often agree only modestly. A measure can be highly reliable, giving the same value repeatedly, and still have weak construct validity.", cs = "Míra, do jaké měření zachycuje psychologický konstrukt, který zachytit má, a nikoli něco, co s ním pouze souvisí. U emocí je konstruktovou validitu obtížné doložit, protože neexistuje jediné shodně přijímané kritérium: sebeposouzení, chování i fyziologie zachycují různé stránky a často se shodují jen mírně. Měření může být vysoce reliabilní, tedy opakovaně dávat stejnou hodnotu, a přesto mít slabou konstruktovou validitu." }
kind = "technical"
see_also = ["self-report", "inference", "multimodality", "affective-computing"]
links = ["research/measuring-emotion/index.md", "methods/index.md"]
references = ["mauss-robinson-2009", "barrett-2019"]

[[terms]]
id = "context"
term = { en = "Context", cs = "Kontext" }
definition = { en = "In inference about emotion, the situation, culture, relationship, bodily state and activity in which a signal occurs. The same facial configuration or change in heart rate can accompany different states in different contexts, so a signal considered without its context supports only weak conclusions. Reviews of facial movement and autonomic data identify context as one of the main sources of variation that simple signal-to-emotion mappings ignore.", cs = "Při usuzování o emocích situace, kultura, vztah, tělesný stav a činnost, v nichž se signál objevuje. Stejná konfigurace obličeje nebo změna srdeční frekvence může v různých kontextech provázet různé stavy, takže signál posuzovaný bez kontextu podporuje jen slabé závěry. Přehledy dat o pohybech obličeje a autonomní aktivitě uvádějí kontext jako jeden z hlavních zdrojů variability, které jednoduchá přiřazení signálu k emoci přehlížejí." }
kind = "technical"
see_also = ["inference", "reverse-inference", "baseline"]
links = ["research/measuring-emotion/index.md"]
references = ["barrett-2019", "siegel-2018"]

[[terms]]
id = "crying"
term = { en = "Crying", cs = "Pláč" }
definition = { en = "Emotional tearing, often accompanied by vocal and respiratory changes, typically in response to loss, helplessness or being moved. Retrospective survey data suggest that people more often report feeling better after crying when they receive social support and when the situation that prompted it is resolved or understood. Whether crying itself has a self-soothing physiological function remains debated, and the evidence is mixed.", cs = "Emoční slzení, často provázené změnami hlasu a dýchání, obvykle jako reakce na ztrátu, bezmoc nebo dojetí. Retrospektivní dotazníková data naznačují, že lidé častěji uvádějí, že se jim po pláči ulevilo, když se jim dostalo sociální opory a když se situace, která pláč vyvolala, vyřešila nebo jí porozuměli. Zda má pláč sám o sobě uklidňující fyziologickou funkci, zůstává sporné a poznatky nejsou jednoznačné." }
kind = "empirical"
see_also = ["social-sharing-of-emotion", "social-support", "catharsis"]
links = ["research/crying-and-sharing/index.md"]
references = ["bylsma-2008", "gracanin-2014"]

[[terms]]
id = "distraction"
term = { en = "Distraction", cs = "Odvedení pozornosti (distrakce)" }
definition = { en = "An attentional regulation strategy that shifts attention away from the emotional aspects of a situation or from the situation altogether. Meta-analytic evidence indicates that distraction reduces emotional experience in the short term, and in venting experiments it was followed by less aggression than rumination. Because it does not change the appraisal of the situation, its effects are generally expected to be shorter-lived than those of reappraisal when the situation recurs.", cs = "Strategie regulace pozornosti, která přesouvá pozornost od emočních stránek situace nebo od situace vůbec. Metaanalytické poznatky ukazují, že odvedení pozornosti krátkodobě zmírňuje emoční prožitek, a v experimentech s ventilací po něm následovala menší agrese než po ruminaci. Protože nemění zhodnocení situace, očekává se obecně, že jeho účinky budou při opakování situace kratší než účinky přehodnocení." }
kind = "empirical"
see_also = ["rumination", "reappraisal", "emotion-regulation", "venting"]
links = ["research/venting-hypothesis/index.md", "advice/let-anger-cool/index.md"]
references = ["bushman-2002", "webb-2012"]

[[terms]]
id = "ecological-momentary-assessment"
term = { en = "Ecological momentary assessment", cs = "Ekologické okamžikové hodnocení (EMA)" }
definition = { en = "A family of methods in which people report their current states repeatedly in daily life, for example several times a day on a phone, rather than recalling them later in a laboratory. Momentary reports reduce the reliance on memory and general beliefs that shapes retrospective self-report, and repeated sampling makes it possible to study how emotions change over time. The method still depends on self-report and can alter what it measures by prompting reflection.", cs = "Skupina metod, při nichž lidé opakovaně v běžném životě uvádějí své aktuální stavy, například několikrát denně v telefonu, místo aby si je později vybavovali v laboratoři. Okamžité výpovědi snižují závislost na paměti a obecných přesvědčeních, která ovlivňuje retrospektivní sebeposouzení, a opakované vzorkování umožňuje zkoumat, jak se emoce v čase mění. Metoda přesto stojí na sebeposouzení a může měřené ovlivnit tím, že podněcuje k sebereflexi." }
kind = "technical"
see_also = ["self-report", "emotion-dynamics", "context"]
links = ["methods/index.md", "research/measuring-emotion/index.md"]
references = ["robinson-clore-2002", "kuppens-verduyn-2017"]

[[terms]]
id = "effect-size"
term = { en = "Effect size", cs = "Velikost účinku" }
definition = { en = "A quantitative estimate of how large a difference or association is, expressed in a standardised form such as a standardised mean difference or a correlation coefficient. Unlike a p-value, which mainly reflects whether a result is distinguishable from zero given the sample size, an effect size indicates magnitude and can be compared and pooled across studies. Conventional labels such as small, medium and large are rough guides, and practical importance depends on the outcome and context.", cs = "Kvantitativní odhad velikosti rozdílu nebo souvislosti vyjádřený ve standardizované podobě, například jako standardizovaný rozdíl průměrů nebo korelační koeficient. Na rozdíl od p-hodnoty, která odráží hlavně to, zda je výsledek při dané velikosti vzorku odlišitelný od nuly, vypovídá velikost účinku o rozsahu a lze ji srovnávat a slučovat napříč studiemi. Konvenční označení malý, střední a velký jsou jen hrubým vodítkem a praktický význam závisí na sledovaném výsledku a kontextu." }
kind = "technical"
see_also = ["meta-analysis", "randomized-controlled-trial", "confidence"]
links = ["evidence/index.md", "methods/index.md"]
references = []

[[terms]]
id = "electrodermal-activity"
term = { en = "Electrodermal activity", cs = "Elektrodermální aktivita" }
definition = { en = "Changes in the electrical properties of the skin, usually measured as skin conductance, which reflect eccrine sweat gland activity under sympathetic control. It is widely used as an index of physiological arousal and orienting responses. Electrodermal activity does not indicate whether a state is pleasant or unpleasant, and it is also affected by temperature, movement and individual differences, so it cannot by itself identify a specific emotion.", cs = "Změny elektrických vlastností kůže, obvykle měřené jako kožní vodivost, které odrážejí činnost ekrinních potních žláz řízenou sympatikem. Široce se používá jako ukazatel fyziologického arousalu a orientačních reakcí. Elektrodermální aktivita nevypovídá o tom, zda je stav příjemný či nepříjemný, a ovlivňuje ji také teplota, pohyb a individuální rozdíly, takže sama o sobě konkrétní emoci určit nedokáže." }
kind = "technical"
see_also = ["arousal", "autonomic-nervous-system", "signal", "baseline"]
links = ["research/measuring-emotion/index.md", "methods/index.md"]
references = ["boucsein-2012", "kreibig-2010"]

[[terms]]
id = "emotion"
term = { en = "Emotion", cs = "Emoce" }
definition = { en = "A relatively brief, coordinated response to a situation that is appraised as relevant to a person's goals, involving subjective experience, physiological change and tendencies toward expression and action. Theories disagree about whether a small set of basic emotions has distinct, universal signatures or whether emotion categories are constructed from more general processes and vary across instances and contexts. Research reviewed on this site finds considerable variability in facial and autonomic responses within the same emotion category.", cs = "Relativně krátká, koordinovaná odpověď na situaci, kterou člověk vyhodnotí jako relevantní pro své cíle, zahrnující subjektivní prožitek, fyziologické změny a sklony k projevu a jednání. Teorie se neshodují v tom, zda malá sada základních emocí má odlišné univerzální znaky, nebo zda se emoční kategorie konstruují z obecnějších procesů a liší se podle jednotlivých případů a kontextů. Výzkum shrnutý na tomto webu nachází značnou variabilitu obličejových i autonomních reakcí v rámci téže emoční kategorie." }
kind = "theoretical"
see_also = ["affect", "mood", "emotion-regulation", "emotion-dynamics"]
links = ["research/what-is-catharsis/index.md", "research/measuring-emotion/index.md"]
references = ["gross-1998", "barrett-2019", "siegel-2018"]

[[terms]]
id = "emotion-dynamics"
term = { en = "Emotion dynamics", cs = "Dynamika emocí" }
definition = { en = "The study of how emotional states change over time: how quickly they rise, how long they last, how variable they are and how strongly one moment carries over into the next. Common indicators include intensity, variability, instability and inertia, usually estimated from repeated momentary reports. Differences in these patterns have been associated with well-being and psychological difficulties, although the indicators overlap and their unique contributions are debated.", cs = "Zkoumání toho, jak se emoční stavy mění v čase: jak rychle nastupují, jak dlouho trvají, jak jsou proměnlivé a jak silně se jeden okamžik přenáší do dalšího. Mezi běžné ukazatele patří intenzita, variabilita, nestabilita a setrvačnost, obvykle odhadované z opakovaných okamžikových výpovědí. Rozdíly v těchto vzorcích byly spojeny s pohodou i s psychickými potížemi, ukazatele se však překrývají a o jejich samostatném přínosu se vedou spory." }
kind = "empirical"
see_also = ["ecological-momentary-assessment", "emotion", "peak-end-rule", "rumination"]
links = ["research/relief-is-not-resolution/index.md", "methods/index.md"]
references = ["kuppens-verduyn-2017"]

[[terms]]
id = "emotion-regulation"
term = { en = "Emotion regulation", cs = "Regulace emocí" }
definition = { en = "The processes by which people influence which emotions they have, when they have them and how they experience and express them. Gross's process model groups strategies by the point at which they act: situation selection and modification, attentional deployment, cognitive change and response modulation. Meta-analyses indicate that strategies differ in effectiveness and that habitual reliance on rumination, avoidance and suppression is associated with symptoms across several disorders.", cs = "Procesy, jimiž lidé ovlivňují, jaké emoce mají, kdy je mají a jak je prožívají a projevují. Grossův procesuální model třídí strategie podle bodu, v němž působí: výběr a úprava situace, zaměření pozornosti, kognitivní změna a modulace reakce. Metaanalýzy ukazují, že strategie se liší účinností a že navyklé spoléhání na ruminaci, vyhýbání a potlačení souvisí s příznaky napříč několika poruchami." }
kind = "theoretical"
see_also = ["reappraisal", "expressive-suppression", "distraction", "acceptance", "music-based-emotion-regulation"]
links = ["research/clinical-perspectives/index.md", "advice/reappraise/index.md"]
references = ["gross-1998", "webb-2012", "aldao-2010"]

[[terms]]
id = "emotional-processing"
term = { en = "Emotional processing", cs = "Emoční zpracování" }
definition = { en = "In Foa and Kozak's account, the modification of a fear memory structure through activation of the fear together with information that is incompatible with it, which is the rationale for exposure therapy. Exposure is structured, graded and repeated, and it is not the same as simply reliving or expressing distress. More broadly the term refers to working through an emotional experience so that it becomes less disruptive, as opposed to discharging it.", cs = "Podle pojetí Foaové a Kozaka úprava paměťové struktury strachu prostřednictvím aktivace strachu spolu s informací, která je s ním neslučitelná; na tomto principu stojí expoziční terapie. Expozice je strukturovaná, odstupňovaná a opakovaná a není totožná s pouhým znovuprožíváním nebo vyjadřováním úzkosti. V širším smyslu pojem označuje zpracování emočního zážitku tak, aby byl méně rušivý, na rozdíl od jeho vybití." }
kind = "clinical"
see_also = ["relief-vs-resolution", "psychological-debriefing", "clinical-boundary", "expressive-writing"]
links = ["research/clinical-perspectives/index.md", "advice/after-trauma/index.md"]
references = ["foa-kozak-1986"]

[[terms]]
id = "evidence-level"
term = { en = "Evidence level", cs = "Úroveň důkazů" }
definition = { en = "The site's classification of a source by study design, from A to E. A: meta-analyses and systematic reviews of controlled studies; B: controlled experiments; C: longitudinal or quasi-experimental studies; D: cross-sectional and qualitative studies, narrative reviews and theory; E: classical texts, expert opinion, project records and artistic material. The level describes design, not truth, and is read together with the confidence rating of each claim.", cs = "Klasifikace zdroje podle designu studie, kterou web používá, od A po E. A: metaanalýzy a systematické přehledy kontrolovaných studií; B: kontrolované experimenty; C: longitudinální nebo kvaziexperimentální studie; D: průřezové a kvalitativní studie, narativní přehledy a teorie; E: klasické texty, expertní názor, projektové záznamy a umělecký materiál. Úroveň popisuje design, nikoli pravdivost, a čte se spolu s mírou jistoty každého tvrzení." }
kind = "technical"
see_also = ["confidence", "meta-analysis", "randomized-controlled-trial"]
links = ["evidence/index.md", "methods/index.md"]
references = []

[[terms]]
id = "experiential-avoidance"
term = { en = "Experiential avoidance", cs = "Zážitkové vyhýbání" }
definition = { en = "The attempt to escape, suppress or alter unwanted internal experiences, such as thoughts, emotions and bodily sensations, even when doing so causes harm over time. Hayes and colleagues proposed it as a functional process shared by many psychological difficulties, and it became a central target of acceptance and commitment therapy. An activity is not avoidant by its form; what matters is whether its main function is to make an internal state go away.", cs = "Snaha uniknout nechtěným vnitřním zážitkům, jako jsou myšlenky, emoce a tělesné pocity, potlačit je nebo je změnit, i když to z dlouhodobého hlediska škodí. Hayes a kolegové jej navrhli jako funkční proces společný mnoha psychickým potížím a stal se ústředním cílem terapie přijetí a závazku. Činnost není vyhýbavá svou formou; rozhoduje, zda je její hlavní funkcí zbavit se vnitřního stavu." }
kind = "clinical"
see_also = ["acceptance", "negative-reinforcement", "relief-vs-resolution"]
links = ["research/relief-is-not-resolution/index.md", "advice/ask-what-changed/index.md"]
references = ["hayes-1996"]

[[terms]]
id = "expressive-suppression"
term = { en = "Expressive suppression", cs = "Potlačení projevu emocí" }
definition = { en = "A response-focused regulation strategy that inhibits the outward expression of an emotion that is already under way, for example keeping a neutral face. In Gross's work suppression reduced visible expression but not the reported experience, and it was associated with increased physiological activation. People who habitually suppress reported less positive and more negative emotion and poorer social functioning than people who habitually reappraise, although these data are correlational.", cs = "Strategie regulace zaměřená na reakci, která tlumí vnější projev již probíhající emoce, například udržováním neutrálního výrazu. V Grossových pracích potlačení snižovalo viditelný projev, nikoli však udávaný prožitek, a bylo spojeno se zvýšenou fyziologickou aktivací. Lidé, kteří potlačují navykle, uváděli méně pozitivních a více negativních emocí a horší sociální fungování než lidé, kteří navykle přehodnocují, tato data jsou však korelační." }
kind = "empirical"
see_also = ["reappraisal", "emotion-regulation", "venting"]
links = ["advice/reappraise/index.md", "research/venting-hypothesis/index.md"]
references = ["gross-1998", "gross-john-2003"]

[[terms]]
id = "expressive-writing"
term = { en = "Expressive writing", cs = "Expresivní psaní" }
definition = { en = "A procedure, developed by Pennebaker and colleagues, in which people write about their deepest thoughts and feelings concerning a difficult experience, typically for 15 to 20 minutes on several consecutive days. In early studies, writing about both facts and feelings was followed by health benefits compared with control writing. Later analyses linked benefit to the development of a coherent account and to changes in causal and insight words, which points to cognitive processing rather than discharge alone.", cs = "Postup vyvinutý Pennebakerem a kolegy, při němž lidé píší o svých nejhlubších myšlenkách a pocitech spojených s obtížným zážitkem, obvykle 15 až 20 minut několik po sobě jdoucích dní. V raných studiích následovaly po psaní o faktech i pocitech zdravotní přínosy ve srovnání s kontrolním psaním. Pozdější analýzy spojily přínos s vytvářením souvislého vyprávění a se změnami v užívání kauzálních a vhledových slov, což ukazuje spíše na kognitivní zpracování než na samotný výboj." }
kind = "empirical"
see_also = ["emotional-processing", "affect-labeling", "social-sharing-of-emotion", "catharsis"]
links = ["research/what-is-catharsis/index.md", "advice/write-to-make-sense/index.md"]
references = ["pennebaker-beall-1986", "pennebaker-1997"]

[[terms]]
id = "false-negative"
term = { en = "False negative", cs = "Falešně negativní výsledek" }
definition = { en = "A result in which a classifier or test reports that a condition is absent when it is present, for example a system that reports no distress in a person who is distressed. The rate of false negatives trades off against the rate of false positives as a decision threshold is moved. For states without a clear ground truth, such as emotions, even estimating this rate depends on which criterion is accepted as correct.", cs = "Výsledek, při němž klasifikátor nebo test uvede, že stav není přítomen, ačkoli přítomen je, například systém, který u člověka v tísni žádnou tíseň neuvede. Míra falešně negativních výsledků se při posouvání rozhodovacího prahu vyvažuje s mírou falešně pozitivních výsledků. U stavů bez jasného referenčního kritéria, jako jsou emoce, závisí už samotný odhad této míry na tom, které kritérium se přijme jako správné." }
kind = "technical"
see_also = ["false-positive", "inference", "construct-validity"]
links = ["research/measuring-emotion/index.md", "methods/index.md"]
references = []

[[terms]]
id = "false-positive"
term = { en = "False positive", cs = "Falešně pozitivní výsledek" }
definition = { en = "A result in which a classifier or test reports that a condition is present when it is absent, for example labelling a neutral face as angry. When the condition is rare in the population being screened, even an accurate classifier can produce more false positives than true positives. In emotion inference, false positives carry particular ethical weight when labels are used in hiring, education, security or policing.", cs = "Výsledek, při němž klasifikátor nebo test uvede, že stav je přítomen, ačkoli přítomen není, například označení neutrálního obličeje za rozzlobený. Je-li stav ve sledované populaci vzácný, může i přesný klasifikátor vytvářet více falešně pozitivních než skutečně pozitivních výsledků. Při odhadování emocí mají falešně pozitivní výsledky zvláštní etickou váhu, pokud se takové štítky používají při náboru, ve vzdělávání, v bezpečnostních kontrolách nebo při policejní činnosti." }
kind = "technical"
see_also = ["false-negative", "reverse-inference", "affective-computing"]
links = ["research/measuring-emotion/index.md", "methods/index.md"]
references = ["stark-hoey-2021"]

[[terms]]
id = "feature"
term = { en = "Feature", cs = "Příznak (feature)" }
definition = { en = "In signal processing and machine learning, a quantity computed from a raw signal and used as input to analysis or classification, such as mean heart rate, an HRV index or the number of skin conductance responses per minute. Feature choice encodes assumptions about which aspects of a signal matter, and different features derived from the same recording can lead to different conclusions. A feature that separates conditions in one sample may not generalise to other people or contexts.", cs = "Při zpracování signálu a ve strojovém učení veličina vypočtená ze surového signálu a použitá jako vstup analýzy nebo klasifikace, například průměrná srdeční frekvence, některý ukazatel variability srdeční frekvence nebo počet kožních vodivostních reakcí za minutu. Volba příznaků v sobě nese předpoklady o tom, které stránky signálu jsou podstatné, a různé příznaky odvozené z téhož záznamu mohou vést k různým závěrům. Příznak, který v jednom vzorku odlišuje podmínky, nemusí platit pro jiné lidi nebo kontexty." }
kind = "technical"
see_also = ["signal", "baseline", "multimodality", "heart-rate-variability"]
links = ["methods/index.md"]
references = ["laborde-2017", "siegel-2018"]

[[terms]]
id = "heart-rate-variability"
term = { en = "Heart rate variability", cs = "Variabilita srdeční frekvence" }
definition = { en = "The variation in time between successive heartbeats, summarised by time-domain and frequency-domain indices. Some indices, such as RMSSD and high-frequency power, are used to estimate cardiac vagal (parasympathetic) influence, and they have been associated with self-regulation in psychophysiological research. HRV is strongly affected by breathing, posture, movement, age and recording length, so recommendations stress controlled conditions and careful reporting before any psychological interpretation.", cs = "Kolísání časových intervalů mezi po sobě jdoucími srdečními stahy, shrnované ukazateli v časové a frekvenční oblasti. Některé ukazatele, například RMSSD a výkon ve vysokofrekvenčním pásmu, se používají k odhadu vagového (parasympatického) vlivu na srdce a v psychofyziologickém výzkumu byly spojeny se seberegulací. Variabilitu srdeční frekvence silně ovlivňuje dýchání, poloha těla, pohyb, věk a délka záznamu, a doporučení proto zdůrazňují kontrolované podmínky a pečlivé vykazování dříve, než dojde k jakékoli psychologické interpretaci." }
kind = "technical"
see_also = ["autonomic-nervous-system", "baseline", "feature", "signal"]
links = ["research/stress-and-social-buffering/index.md", "methods/index.md"]
references = ["laborde-2017", "kreibig-2010"]

[[terms]]
id = "hydraulic-model"
term = { en = "Hydraulic model of emotion", cs = "Hydraulický model emocí" }
definition = { en = "The popular picture of emotions as pressure that builds up and must be released to avoid harm, inherited in part from the cathartic method of the late nineteenth century. It predicts that expressing an emotion, such as hitting a punching bag when angry, should reduce it. Controlled experiments on anger did not support this prediction, and current emotion regulation research does not use the model.", cs = "Populární představa emocí jako tlaku, který se hromadí a musí se vypustit, aby neškodil, převzatá zčásti z katarzní metody konce 19. století. Předpovídá, že vyjádření emoce, například bušení do boxovacího pytle v hněvu, ji zmírní. Kontrolované experimenty s hněvem tuto předpověď nepodpořily a současný výzkum regulace emocí s modelem nepracuje." }
kind = "historical"
see_also = ["catharsis", "venting", "abreaction"]
links = ["research/what-is-catharsis/index.md", "research/venting-hypothesis/index.md"]
references = ["breuer-freud-1895", "bushman-2002"]

[[terms]]
id = "inference"
term = { en = "Inference", cs = "Inference (usuzování)" }
definition = { en = "Reaching a conclusion about something not directly observed from data that are observed. Emotional states are not directly observable, so any statement about them from faces, voice or physiology is an inference whose strength depends on how specific and consistent the link between signal and state is, and on context. Describing such conclusions as estimates with stated uncertainty, rather than as readings, keeps the inferential step visible.", cs = "Dospění k závěru o něčem, co není přímo pozorováno, na základě dat, která pozorována jsou. Emoční stavy nejsou přímo pozorovatelné, takže každé tvrzení o nich na základě obličeje, hlasu nebo fyziologie je inferencí, jejíž síla závisí na tom, jak specifický a konzistentní je vztah mezi signálem a stavem, a na kontextu. Popisovat takové závěry jako odhady s uvedenou nejistotou, nikoli jako odečtené hodnoty, udržuje inferenční krok viditelný." }
kind = "technical"
see_also = ["reverse-inference", "context", "construct-validity", "false-positive"]
links = ["research/measuring-emotion/index.md", "methods/index.md"]
references = ["barrett-2019"]

[[terms]]
id = "interpersonal-synchrony"
term = { en = "Interpersonal synchrony", cs = "Interpersonální synchronie" }
definition = { en = "The temporal coordination of movement, sound or physiology between people, such as tapping, walking, singing or dancing in time. Experiments have associated synchronous activity with greater reported affiliation, cooperation and, in dance, higher pain thresholds, an effect used as an indirect marker of endorphin activity. Effects are typically measured shortly after brief laboratory tasks, so their duration and their size in real-world groups are less well established.", cs = "Časová koordinace pohybu, zvuku nebo fyziologie mezi lidmi, například ťukání, chůze, zpěv nebo tanec v rytmu. Experimenty spojily synchronní činnost s vyšší udávanou náklonností, spoluprací a u tance s vyšším prahem bolesti, který se používá jako nepřímý ukazatel endorfinové aktivity. Účinky se obvykle měří krátce po krátkých laboratorních úlohách, takže jejich trvání a velikost v reálných skupinách jsou prozkoumány méně." }
kind = "empirical"
see_also = ["collective-effervescence", "music-based-emotion-regulation", "social-support"]
links = ["research/collective-synchrony/index.md", "advice/move-together/index.md"]
references = ["hove-risen-2009", "wiltermuth-heath-2009", "tarr-2015"]

[[terms]]
id = "meta-analysis"
term = { en = "Meta-analysis", cs = "Metaanalýza" }
definition = { en = "A statistical synthesis that combines effect sizes from multiple studies of the same question into a pooled estimate and examines how results vary between studies. When based on a systematic search and on controlled studies, it provides the strongest design-based evidence on this site. Its conclusions are limited by the quality of the included studies, by publication bias and by heterogeneity in methods and populations.", cs = "Statistická syntéza, která slučuje velikosti účinku z více studií téže otázky do souhrnného odhadu a zkoumá, jak se výsledky mezi studiemi liší. Opírá-li se o systematické vyhledávání a o kontrolované studie, poskytuje na tomto webu nejsilnější doklady z hlediska designu. Její závěry omezuje kvalita zahrnutých studií, publikační zkreslení a heterogenita metod a populací." }
kind = "technical"
see_also = ["effect-size", "evidence-level", "randomized-controlled-trial"]
links = ["evidence/index.md", "methods/index.md"]
references = []

[[terms]]
id = "mood"
term = { en = "Mood", cs = "Nálada" }
definition = { en = "A diffuse affective state that typically lasts longer than an emotion, is less intense and is not clearly directed at a specific object or event. Moods colour perception and judgement and can persist after the circumstances that contributed to them have passed. The boundary between mood and emotion is drawn differently by different authors, and in everyday language the words overlap.", cs = "Difuzní afektivní stav, který obvykle trvá déle než emoce, je méně intenzivní a není jasně zaměřen na konkrétní objekt nebo událost. Nálady zabarvují vnímání a úsudek a mohou přetrvávat i poté, co okolnosti, které k nim přispěly, pominuly. Hranici mezi náladou a emocí vedou různí autoři různě a v běžném jazyce se tato slova překrývají." }
kind = "theoretical"
see_also = ["affect", "emotion", "emotion-dynamics"]
links = ["research/relief-is-not-resolution/index.md"]
references = []

[[terms]]
id = "multimodality"
term = { en = "Multimodality", cs = "Multimodalita" }
definition = { en = "The combination of several kinds of data, such as self-report, facial movement, voice, text and physiology, in one analysis. Combining modalities can reduce reliance on any single ambiguous channel, but it does not remove the underlying problem that each channel relates to emotional states only probabilistically and context-dependently. Multimodal systems also collect more personal data, which increases the importance of consent and data minimisation.", cs = "Kombinace několika druhů dat, například sebeposouzení, pohybů obličeje, hlasu, textu a fyziologie, v jedné analýze. Spojení modalit může snížit závislost na jediném nejednoznačném kanálu, neodstraňuje však základní problém, že každý kanál souvisí s emočními stavy jen pravděpodobnostně a v závislosti na kontextu. Multimodální systémy navíc shromažďují více osobních údajů, což zvyšuje význam souhlasu a minimalizace dat." }
kind = "technical"
see_also = ["affective-computing", "construct-validity", "feature", "context"]
links = ["research/measuring-emotion/index.md", "methods/index.md"]
references = ["picard-1997", "stark-hoey-2021"]

[[terms]]
id = "music-based-emotion-regulation"
term = { en = "Music-based emotion regulation", cs = "Regulace emocí pomocí hudby" }
definition = { en = "The use of listening to, playing or moving to music to change or maintain emotional states, for example for relaxation, distraction, discharge or reflective processing. Survey and interview studies describe these uses across the lifespan, and meta-analyses of music interventions report reductions in stress-related outcomes. The same strategy can be helpful or unhelpful depending on how it is used: music used to dwell on distress has been associated with rumination rather than recovery.", cs = "Využití poslechu hudby, hraní nebo pohybu na hudbu ke změně či udržení emočních stavů, například k uvolnění, odvedení pozornosti, vybití nebo reflexivnímu zpracování. Dotazníkové a rozhovorové studie popisují tato užití napříč životem a metaanalýzy hudebních intervencí uvádějí snížení ukazatelů souvisejících se stresem. Tatáž strategie může být užitečná i neužitečná podle toho, jak se používá: hudba sloužící k setrvávání v tísni byla spojena spíše s ruminací než se zotavením." }
kind = "empirical"
see_also = ["emotion-regulation", "interpersonal-synchrony", "rumination", "distraction"]
links = ["research/music-and-emotion-regulation/index.md", "research/stress-and-social-buffering/index.md"]
references = ["saarikallio-erkkila-2007", "saarikallio-2011", "baltazar-saarikallio-2016", "cook-roy-welker-2019", "miranda-blais-rochette-2020", "de-witte-2020"]

[[terms]]
id = "negative-reinforcement"
term = { en = "Negative reinforcement", cs = "Negativní posílení" }
definition = { en = "In learning theory, the strengthening of a behaviour because it removes or reduces an aversive state; it is not the same as punishment. Relief that follows an activity makes that activity more likely to be repeated in similar circumstances, whether or not it changes the source of the aversive state. This mechanism explains how a strategy can feel effective and become habitual while the underlying difficulty persists.", cs = "V teorii učení posílení chování proto, že odstraňuje nebo zmírňuje averzivní stav; nejde o totéž co trest. Úleva, která následuje po určité činnosti, zvyšuje pravděpodobnost, že se činnost v podobných situacích zopakuje, bez ohledu na to, zda mění zdroj averzivního stavu. Tento mechanismus vysvětluje, jak může strategie působit účinně a stát se návykem, zatímco základní potíž trvá." }
kind = "theoretical"
see_also = ["relief-vs-resolution", "experiential-avoidance", "peak-end-rule"]
links = ["research/relief-is-not-resolution/index.md", "advice/ask-what-changed/index.md"]
references = ["hayes-1996"]

[[terms]]
id = "peak-end-rule"
term = { en = "Peak-end rule", cs = "Pravidlo vrcholu a konce" }
definition = { en = "The finding that retrospective evaluations of an experience are dominated by its most intense moment and by how it ends, while its duration is largely neglected. In one demonstration, participants preferred to repeat a longer episode of cold-water discomfort that ended slightly less unpleasantly over a shorter one. For pleasant episodes, a strong peak and a good ending can make an experience remembered as more restorative than its lasting effects justify.", cs = "Zjištění, že v retrospektivním hodnocení zážitku převažuje jeho nejintenzivnější okamžik a způsob, jakým skončil, zatímco jeho trvání je do značné míry přehlíženo. V jedné demonstraci účastníci raději volili zopakování delší epizody nepříjemného chladu ve vodě, která končila o něco méně nepříjemně, než kratší epizody. U příjemných epizod může silný vrchol a dobrý konec způsobit, že si člověk zážitek pamatuje jako obnovující více, než odpovídá jeho trvalým účinkům." }
kind = "empirical"
see_also = ["negative-reinforcement", "relief-vs-resolution", "emotion-dynamics"]
links = ["research/relief-is-not-resolution/index.md"]
references = ["fredrickson-kahneman-1993", "kahneman-1993"]

[[terms]]
id = "psychological-debriefing"
term = { en = "Psychological debriefing", cs = "Psychologický debriefing" }
definition = { en = "A single-session intervention, delivered soon after a traumatic event, in which people are encouraged to recount the event and express their emotional reactions. A Cochrane systematic review found no evidence that single-session individual debriefing prevents post-traumatic stress disorder, and some trials reported worse outcomes in the debriefed group. The finding is often cited as a caution against assuming that early emotional expression is protective for everyone.", cs = "Jednosezení intervence poskytovaná krátce po traumatické události, při níž jsou lidé vedeni k tomu, aby událost převyprávěli a vyjádřili své emoční reakce. Systematický přehled Cochrane nenašel doklady, že by individuální jednorázový debriefing předcházel posttraumatické stresové poruše, a některé studie uváděly horší výsledky ve skupině, která debriefing absolvovala. Zjištění se často uvádí jako varování před předpokladem, že časné vyjádření emocí chrání každého." }
kind = "clinical"
see_also = ["emotional-processing", "clinical-boundary", "social-sharing-of-emotion"]
links = ["research/clinical-perspectives/index.md", "advice/after-trauma/index.md"]
references = ["rose-2002"]

[[terms]]
id = "randomized-controlled-trial"
term = { en = "Randomized controlled trial", cs = "Randomizovaná kontrolovaná studie" }
definition = { en = "A study in which participants are allocated at random to an intervention or a comparison condition, so that differences in outcome can be attributed to the intervention with less risk of confounding. Its credibility also depends on allocation concealment, blinding where possible, adequate sample size, low attrition and pre-specified outcomes. Well-conducted trials support causal conclusions for the studied population and setting, which may differ from everyday conditions.", cs = "Studie, v níž jsou účastníci náhodně přiřazeni k intervenci nebo ke srovnávací podmínce, takže rozdíly ve výsledcích lze s menším rizikem zkreslení přičíst intervenci. Její věrohodnost závisí také na utajení přiřazení, zaslepení tam, kde je možné, dostatečné velikosti vzorku, nízkém odpadu účastníků a předem stanovených výstupech. Dobře provedené studie podporují kauzální závěry pro zkoumanou populaci a prostředí, které se mohou od běžných podmínek lišit." }
kind = "technical"
see_also = ["meta-analysis", "evidence-level", "effect-size"]
links = ["evidence/index.md", "methods/index.md"]
references = []

[[terms]]
id = "reappraisal"
term = { en = "Reappraisal", cs = "Přehodnocení" }
definition = { en = "A cognitive regulation strategy that changes how a situation is interpreted in order to change its emotional impact, for example viewing a provocation as the result of someone else's bad day. Meta-analytic evidence indicates that reappraising the situation itself tends to be more effective than attempting to change the emotional response directly, and habitual reappraisal is associated with more positive and less negative emotion. Recent work describes reappraisal as a family of tactics whose usefulness depends on the person, the situation and whether the situation can be changed.", cs = "Kognitivní regulační strategie, která mění interpretaci situace, a tím i její emoční dopad, například když člověk chápe provokaci jako důsledek špatného dne druhého. Metaanalytické poznatky ukazují, že přehodnocení samotné situace bývá účinnější než snaha přímo změnit emoční reakci a že navyklé přehodnocování souvisí s více pozitivními a méně negativními emocemi. Novější práce popisují přehodnocení jako skupinu taktik, jejichž užitečnost závisí na člověku, situaci a na tom, zda lze situaci změnit." }
kind = "empirical"
see_also = ["expressive-suppression", "acceptance", "self-distancing", "emotion-regulation"]
links = ["advice/reappraise/index.md", "research/venting-hypothesis/index.md"]
references = ["gross-1998", "gross-john-2003", "ochsner-gross-2005", "webb-2012", "uusberg-2023", "monachesi-2023"]

[[terms]]
id = "relief-vs-resolution"
term = { en = "Relief versus resolution", cs = "Úleva versus řešení" }
definition = { en = "The distinction, central to this project, between a change in how a state feels (relief) and a change in the conditions that produce it (resolution). Both are followed by feeling better, which makes them easy to confuse, and relief alone reinforces whatever preceded it. The artwork's status line problem_solved: false expresses this distinction in compressed form.", cs = "Rozlišení, které je pro tento projekt ústřední, mezi změnou toho, jak se stav prožívá (úleva), a změnou podmínek, které stav vyvolávají (řešení). Po obojím se člověk cítí lépe, a proto se snadno zaměňují, přičemž samotná úleva posiluje to, co jí předcházelo. Stavový řádek díla problem_solved: false vyjadřuje toto rozlišení ve zhuštěné podobě." }
kind = "theoretical"
see_also = ["negative-reinforcement", "catharsis", "experiential-avoidance", "emotional-processing"]
links = ["research/relief-is-not-resolution/index.md", "advice/ask-what-changed/index.md"]
references = ["hayes-1996", "fredrickson-kahneman-1993"]

[[terms]]
id = "reverse-inference"
term = { en = "Reverse inference", cs = "Reverzní inference" }
definition = { en = "Reasoning from an observed signal back to a mental state, for example concluding that a person is angry because they scowl or afraid because a particular brain region is active. Such reasoning is justified only to the extent that the signal is specific to that state; if the same signal also occurs with other states, the inference is weak. Reviews of facial movement and autonomic data found that this specificity is generally low for emotion categories.", cs = "Usuzování od pozorovaného signálu zpět k duševnímu stavu, například závěr, že člověk je rozzlobený, protože se mračí, nebo že má strach, protože je aktivní určitá oblast mozku. Takové usuzování je oprávněné jen do té míry, do jaké je signál pro daný stav specifický; objevuje-li se stejný signál i u jiných stavů, je inference slabá. Přehledy dat o pohybech obličeje a autonomní aktivitě zjistily, že tato specifičnost je u emočních kategorií obecně nízká." }
kind = "technical"
see_also = ["inference", "context", "false-positive", "affective-computing"]
links = ["research/measuring-emotion/index.md", "methods/index.md"]
references = ["barrett-2019", "siegel-2018"]

[[terms]]
id = "rumination"
term = { en = "Rumination", cs = "Ruminace" }
definition = { en = "Repetitive, passive focus on one's distress and its possible causes and consequences. Rumination predicts longer and more intense episodes of negative mood and is associated with the onset of depression, and in venting experiments it was followed by more anger and aggression. Not all repetitive thought is harmful: abstract, evaluative forms tend to be unconstructive, whereas concrete, process-focused forms can support problem solving.", cs = "Opakované, pasivní zaměření na vlastní tíseň a její možné příčiny a důsledky. Ruminace předpovídá delší a intenzivnější epizody negativní nálady a souvisí s nástupem deprese; v experimentech s ventilací po ní následovalo více hněvu a agrese. Ne každé opakované myšlení škodí: abstraktní, hodnoticí formy bývají nekonstruktivní, kdežto konkrétní formy zaměřené na průběh mohou podporovat řešení problémů." }
kind = "empirical"
see_also = ["self-distancing", "distraction", "venting", "emotion-regulation"]
links = ["research/relief-is-not-resolution/index.md", "advice/from-brooding-to-next-steps/index.md"]
references = ["nolen-hoeksema-2008", "watkins-2008", "aldao-2010", "bushman-2002"]

[[terms]]
id = "self-distancing"
term = { en = "Self-distancing", cs = "Sebedistancování" }
definition = { en = "Reflecting on an experience from the perspective of an observer rather than reliving it from one's own point of view, for example by imagining watching the scene from a distance. In experiments, self-distanced reflection on upsetting memories was associated with lower emotional reactivity and less rumination than immersed recall, while still allowing people to make sense of the experience. It is used as a way to analyse why something happened without re-experiencing it at full intensity.", cs = "Přemýšlení o zážitku z pozice pozorovatele namísto jeho znovuprožívání z vlastní perspektivy, například představou, že člověk scénu sleduje z odstupu. V experimentech bylo reflektování tíživých vzpomínek s odstupem spojeno s nižší emoční reaktivitou a menší ruminací než ponořené vybavování, a přitom lidem umožňovalo zážitku porozumět. Používá se jako způsob, jak analyzovat, proč se něco stalo, aniž by to člověk znovu prožíval v plné intenzitě." }
kind = "empirical"
see_also = ["rumination", "reappraisal", "expressive-writing"]
links = ["advice/reflect-from-a-distance/index.md", "research/venting-hypothesis/index.md"]
references = ["kross-ayduk-mischel-2005", "kross-ayduk-2011"]

[[terms]]
id = "self-report"
term = { en = "Self-report", cs = "Sebeposouzení (self-report)" }
definition = { en = "A person's own account of their state, collected through questionnaires, rating scales, interviews or momentary prompts. Self-report is the most direct access to subjective experience, but it depends on awareness, language, willingness to disclose and, for past states, on memory and general beliefs about how one usually feels. Momentary reports rely more on current experience, whereas retrospective reports increasingly draw on such beliefs.", cs = "Vlastní výpověď člověka o jeho stavu, získaná dotazníky, posuzovacími škálami, rozhovory nebo okamžikovými výzvami. Sebeposouzení poskytuje nejpřímější přístup k subjektivnímu prožitku, závisí však na uvědomění, jazyce, ochotě se svěřit a u minulých stavů na paměti a obecných přesvědčeních o tom, jak se člověk obvykle cítí. Okamžikové výpovědi se opírají více o aktuální prožitek, kdežto retrospektivní výpovědi čím dál více čerpají z takových přesvědčení." }
kind = "technical"
see_also = ["ecological-momentary-assessment", "construct-validity", "multimodality"]
links = ["research/measuring-emotion/index.md", "methods/index.md"]
references = ["robinson-clore-2002", "mauss-robinson-2009"]

[[terms]]
id = "signal"
term = { en = "Signal", cs = "Signál" }
definition = { en = "A time-varying recording of a measurable quantity, such as the electrocardiogram, skin conductance, respiration or an audio waveform, from which features are derived. A raw signal contains the component of interest together with noise and artefacts from movement, electrodes, environment and unrelated bodily processes. The signal itself is not an emotion; linking it to one requires the inferential steps of feature extraction, comparison with a baseline and interpretation in context.", cs = "Časově proměnný záznam měřitelné veličiny, například elektrokardiogramu, kožní vodivosti, dýchání nebo zvukové vlny, z něhož se odvozují příznaky. Surový signál obsahuje sledovanou složku spolu se šumem a artefakty z pohybu, elektrod, prostředí a nesouvisejících tělesných procesů. Signál sám není emocí; jeho spojení s emocí vyžaduje inferenční kroky extrakce příznaků, srovnání s výchozí hodnotou a interpretace v kontextu." }
kind = "technical"
see_also = ["feature", "baseline", "inference", "electrodermal-activity"]
links = ["methods/index.md", "research/measuring-emotion/index.md"]
references = ["boucsein-2012"]

[[terms]]
id = "social-sharing-of-emotion"
term = { en = "Social sharing of emotion", cs = "Sociální sdílení emocí" }
definition = { en = "Talking with others about an emotional experience, which Rimé showed follows most emotional episodes and is often repeated. Sharing is associated with feeling understood, closer relationships and perceived benefit, but talking about an event did not by itself reduce the emotional impact of the memory in experimental studies. Recovery appears to depend more on the kind of response received, including cognitive help in making sense of the event, than on disclosure alone.", cs = "Rozhovor s druhými o emočním zážitku, o němž Rimé ukázal, že následuje po většině emočních epizod a často se opakuje. Sdílení souvisí s pocitem porozumění, bližšími vztahy a vnímaným přínosem, samotné mluvení o události však v experimentálních studiích emoční dopad vzpomínky nesnížilo. Zotavení se zdá záviset spíše na druhu odezvy, včetně kognitivní pomoci s porozuměním události, než na samotném svěření." }
kind = "empirical"
see_also = ["social-support", "crying", "affect-labeling", "collective-effervescence"]
links = ["research/crying-and-sharing/index.md", "advice/build-lasting-support/index.md"]
references = ["rime-2009", "zech-rime-2005"]

[[terms]]
id = "social-support"
term = { en = "Social support and stress buffering", cs = "Sociální opora a tlumení stresu" }
definition = { en = "Social support refers to resources provided by relationships, such as emotional understanding, practical help and information. The buffering hypothesis proposes that perceived availability of support protects people mainly when they are under stress, by changing how stressors are appraised and responded to. Cohen and Wills reviewed evidence for both buffering effects and direct associations between social integration and well-being, with the pattern depending on how support was measured.", cs = "Sociální opora označuje zdroje, které poskytují vztahy, například emoční porozumění, praktickou pomoc a informace. Hypotéza tlumení (nárazníkového efektu) předpokládá, že vnímaná dostupnost opory chrání lidi hlavně ve chvílích zátěže, protože mění, jak stresory hodnotí a jak na ně reagují. Cohen a Wills shrnuli doklady jak pro tlumivý účinek, tak pro přímé souvislosti mezi sociální začleněností a pohodou, přičemž výsledný obraz závisel na tom, jak byla opora měřena." }
kind = "empirical"
see_also = ["allostatic-load", "social-sharing-of-emotion", "collective-effervescence"]
links = ["research/stress-and-social-buffering/index.md", "advice/build-lasting-support/index.md"]
references = ["cohen-wills-1985"]

[[terms]]
id = "valence"
term = { en = "Valence", cs = "Valence" }
definition = { en = "The pleasantness or unpleasantness of an affective state, one of the two dimensions commonly used to describe affect alongside arousal. Valence is most directly assessed by self-report, and to some extent by facial muscle activity and behavioural measures. Autonomic measures such as skin conductance track arousal more than valence, which is one reason physiological data alone cannot establish whether a person feels good or bad.", cs = "Příjemnost či nepříjemnost afektivního stavu, vedle arousalu jedna ze dvou dimenzí, kterými se afekt běžně popisuje. Valence se nejpříměji posuzuje sebeposouzením, do jisté míry také aktivitou obličejových svalů a behaviorálními ukazateli. Autonomní ukazatele, jako je kožní vodivost, sledují spíše arousal než valenci, což je jeden z důvodů, proč samotná fyziologická data nemohou určit, zda se člověk cítí dobře, nebo špatně." }
kind = "theoretical"
see_also = ["arousal", "affect", "self-report"]
links = ["research/measuring-emotion/index.md"]
references = ["mauss-robinson-2009"]

[[terms]]
id = "venting"
term = { en = "Venting", cs = "Ventilace emocí" }
definition = { en = "Expressing an emotion, especially anger, with the aim of getting it out, for example by shouting or hitting an object. In controlled experiments, venting while thinking about the provocation kept anger active and was followed by more aggression than sitting quietly, and belief that venting helps increased the tendency to vent. A meta-analysis found that arousal-reducing activities lowered anger, whereas arousal-increasing activities did not reliably do so.", cs = "Vyjadřování emoce, zejména hněvu, s cílem dostat ji ze sebe, například křikem nebo bušením do předmětu. V kontrolovaných experimentech ventilace při myšlení na provokaci udržovala hněv aktivní a následovalo po ní více agrese než po tichém sezení, a přesvědčení, že ventilace pomáhá, zvyšovalo sklon k ní sáhnout. Metaanalýza zjistila, že aktivity snižující arousal hněv snižovaly, zatímco aktivity arousal zvyšující jej spolehlivě nesnižovaly." }
kind = "empirical"
see_also = ["hydraulic-model", "rumination", "arousal", "catharsis"]
links = ["research/venting-hypothesis/index.md", "advice/let-anger-cool/index.md"]
references = ["bushman-baumeister-stack-1999", "bushman-2002", "kjaervik-bushman-2024"]

[[terms]]
id = "confounding"
term = { en = "Confounding", cs = "Zkreslení matoucí proměnnou (confounding)" }
definition = { en = "A distortion of an estimated association that arises when a third variable influences both the supposed cause and the outcome. For example, people who talk about their feelings more may also have more social support, so an association between talking and recovery could partly reflect support rather than talking itself. Random allocation reduces confounding by design; in observational data, statistical control can help only when the relevant variables are known, measured well, and are not colliders or mediators.", cs = "Zkreslení odhadované souvislosti, k němuž dochází, když třetí proměnná ovlivňuje předpokládanou příčinu i výsledek zároveň. Lidé, kteří o svých pocitech více mluví, mohou mít například i více sociální opory, takže souvislost mezi mluvením a zotavením může zčásti odrážet oporu, a ne samotné mluvení. Randomizace (náhodné přiřazení) toto zkreslení omezuje už svým designem; v observačních datech pomůže statistická kontrola jen tehdy, jsou-li příslušné proměnné známé, dobře změřené a nejde-li o kolidery či mediátory." }
kind = "technical"
see_also = ["randomized-controlled-trial", "selection-bias", "mediator", "inference"]
links = ["methods/index.md", "evidence/index.md"]
references = ["rohrer-2018", "hernan-2004"]

[[terms]]
id = "selection-bias"
term = { en = "Selection bias", cs = "Výběrové zkreslení" }
definition = { en = "A distortion that arises when the people who end up in a study, or in its analysis, differ systematically from the population of interest in ways related to both exposure and outcome. Examples include studying only people who sought help, only participants who completed follow-up, or only crying episodes that respondents chose to remember. In causal terms it results from conditioning on a common effect of two variables, which distinguishes it from confounding by a common cause.", cs = "Zkreslení, k němuž dochází, když se lidé, kteří se do studie nebo do její analýzy dostanou, systematicky liší od cílové populace způsobem, který souvisí s expozicí i s výsledkem. Příkladem je zkoumání jen těch, kdo vyhledali pomoc, jen účastníků, kteří dokončili sledování, nebo jen epizod pláče, které si respondenti vybavili. V kauzálním pojetí vzniká podmíněním na společném důsledku dvou proměnných, čímž se liší od zkreslení společnou příčinou (confounding)." }
kind = "technical"
see_also = ["confounding", "external-validity", "publication-bias", "self-report"]
links = ["methods/index.md", "evidence/index.md"]
references = ["hernan-2004", "rohrer-2018"]

[[terms]]
id = "publication-bias"
term = { en = "Publication bias", cs = "Publikační zkreslení" }
definition = { en = "The tendency for studies with statistically significant or striking results to be published, and published sooner, than studies with null or unwelcome results. A literature filtered this way overstates effects, and meta-analyses built on it inherit the distortion. Asymmetry in a funnel plot, in which small studies show larger effects, is consistent with publication bias but can also reflect genuine differences between small and large studies; preregistration and registered reports address the problem at its source.", cs = "Sklon k tomu, že studie se statisticky významnými nebo nápadnými výsledky vycházejí častěji a dříve než studie s nulovými či nevítanými výsledky. Takto filtrovaná literatura účinky nadhodnocuje a metaanalýzy na ní postavené zkreslení přebírají. Asymetrie trychtýřového grafu, v němž malé studie vykazují větší účinky, je s publikačním zkreslením v souladu, může však odrážet i skutečné rozdíly mezi malými a velkými studiemi; předregistrace a registrované zprávy řeší problém u jeho zdroje." }
kind = "technical"
see_also = ["meta-analysis", "preregistration", "p-hacking", "statistical-significance"]
links = ["methods/index.md", "evidence/index.md"]
references = ["egger-1997"]

[[terms]]
id = "heterogeneity"
term = { en = "Heterogeneity (I²)", cs = "Heterogenita (I²)" }
definition = { en = "Variation in results between studies in a meta-analysis beyond what chance alone would produce, reflecting differences in populations, interventions, measures or study quality. The I² statistic, proposed by Higgins and Thompson, describes the proportion of total variation in study estimates that is due to heterogeneity rather than sampling error, independently of the number of studies and the effect metric. High heterogeneity means a pooled average may describe few real settings well, so moderators and the spread of effects matter as much as the mean.", cs = "Rozdílnost výsledků mezi studiemi v metaanalýze nad rámec toho, co by způsobila samotná náhoda; odráží rozdíly v populacích, intervencích, měřítkách nebo kvalitě studií. Statistika I², kterou navrhli Higgins a Thompson, popisuje podíl celkové variability odhadů připadající na heterogenitu, nikoli na výběrovou chybu, a to nezávisle na počtu studií i na metrice účinku. Vysoká heterogenita znamená, že souhrnný průměr nemusí dobře popisovat mnoho skutečných situací, takže moderátory a rozptyl účinků jsou stejně důležité jako průměr." }
kind = "technical"
see_also = ["meta-analysis", "moderator", "effect-size", "confidence-interval"]
links = ["methods/index.md", "evidence/index.md"]
references = ["higgins-thompson-2002"]

[[terms]]
id = "confidence-interval"
term = { en = "Confidence interval", cs = "Interval spolehlivosti" }
definition = { en = "A range of values computed from data that expresses the precision of an estimate, such as an effect size. A 95% interval is produced by a procedure that, over many repetitions, would contain the true value 95% of the time; it does not mean there is a 95% probability that the true value lies in one particular interval. Wide intervals signal imprecise estimates, and reporting intervals alongside effect sizes is widely recommended over relying on significance tests alone.", cs = "Rozmezí hodnot vypočtené z dat, které vyjadřuje přesnost odhadu, například velikosti účinku. Pětadevadesátiprocentní interval vzniká postupem, který by při mnoha opakováních obsahoval skutečnou hodnotu v 95 % případů; neznamená to, že skutečná hodnota leží v jednom konkrétním intervalu s pravděpodobností 95 %. Široké intervaly ukazují na nepřesné odhady a uvádění intervalů spolu s velikostmi účinku se široce doporučuje místo spoléhání jen na testy významnosti." }
kind = "technical"
see_also = ["effect-size", "statistical-significance", "statistical-power", "confidence"]
links = ["methods/index.md", "evidence/index.md"]
references = ["cumming-2014"]

[[terms]]
id = "statistical-significance"
term = { en = "Statistical significance", cs = "Statistická významnost" }
definition = { en = "A conventional label for a result whose p-value falls below a pre-set threshold, often 0.05. The p-value indicates how incompatible the data are with a specified statistical model, usually one of no effect; it does not measure the probability that a hypothesis is true or the size or importance of an effect. The American Statistical Association has cautioned against basing conclusions on whether a threshold was crossed, and a non-significant result is not evidence that an effect is absent.", cs = "Konvenční označení výsledku, jehož p-hodnota klesne pod předem stanovenou hranici, často 0,05. P-hodnota vyjadřuje, nakolik jsou data neslučitelná s určitým statistickým modelem, obvykle s modelem bez účinku; neměří pravděpodobnost, že hypotéza platí, ani velikost či význam účinku. Americká statistická asociace varovala před vyvozováním závěrů jen podle toho, zda byla hranice překročena, a nevýznamný výsledek není dokladem, že účinek neexistuje." }
kind = "technical"
see_also = ["confidence-interval", "effect-size", "p-hacking", "false-positive"]
links = ["methods/index.md", "evidence/index.md"]
references = ["wasserstein-lazar-2016", "cumming-2014"]

[[terms]]
id = "standardized-mean-difference"
term = { en = "Standardized mean difference (Hedges' g)", cs = "Standardizovaný rozdíl průměrů (Hedgesovo g)" }
definition = { en = "An effect size that expresses the difference between two group means in units of their pooled standard deviation, so that studies using different scales can be compared. Cohen's d is the basic form; Hedges' g applies a correction for the slight overestimation of d in small samples. Values depend on which standard deviation is used, and within-subject designs require different formulas, so a g from one design is not automatically comparable with a g from another.", cs = "Velikost účinku, která vyjadřuje rozdíl průměrů dvou skupin v jednotkách jejich společné směrodatné odchylky, takže lze srovnávat studie používající různé škály. Základní podobou je Cohenovo d; Hedgesovo g navíc koriguje mírné nadhodnocení d v malých vzorcích. Hodnoty závisejí na tom, která směrodatná odchylka se použije, a designy s opakovaným měřením týchž osob vyžadují jiné vzorce, takže g z jednoho designu není automaticky srovnatelné s g z jiného." }
kind = "technical"
see_also = ["effect-size", "meta-analysis", "correlation-coefficient", "within-between-person-effects"]
links = ["methods/index.md", "evidence/index.md"]
references = ["lakens-2013"]

[[terms]]
id = "correlation-coefficient"
term = { en = "Correlation coefficient", cs = "Korelační koeficient" }
definition = { en = "A number between −1 and +1 that describes the strength and direction of a linear association between two variables, most often Pearson's r. A correlation says nothing by itself about which variable influences the other, or whether a third variable drives both. It can be attenuated by unreliable measurement or a restricted range, and a correlation computed across people need not hold within any one person over time.", cs = "Číslo v rozmezí od −1 do +1, které popisuje sílu a směr lineární souvislosti dvou proměnných, nejčastěji Pearsonovo r. Korelace sama o sobě neříká, která proměnná ovlivňuje kterou, ani zda obě neřídí třetí proměnná. Může být oslabena nespolehlivým měřením nebo zúženým rozsahem hodnot a korelace vypočtená napříč lidmi nemusí platit u žádného jednotlivce v čase." }
kind = "technical"
see_also = ["effect-size", "confounding", "within-between-person-effects", "inference"]
links = ["methods/index.md", "evidence/index.md"]
references = ["rohrer-2018"]

[[terms]]
id = "regression-to-the-mean"
term = { en = "Regression to the mean", cs = "Regrese k průměru" }
definition = { en = "The statistical tendency for an unusually extreme measurement to be followed by one closer to the average, simply because part of any single measurement is random variation. People often seek help, or enrol in studies, when they feel at their worst, so they are likely to report some improvement later whatever is done. Without a comparison group, improvement after an intervention cannot be separated from this effect.", cs = "Statistická tendence, že po neobvykle krajním měření následuje měření bližší průměru, prostě proto, že část každého jednotlivého měření tvoří náhodné kolísání. Lidé často vyhledají pomoc nebo vstoupí do studie, když se cítí nejhůře, a proto později pravděpodobně uvedou určité zlepšení bez ohledu na to, co se dělo. Bez srovnávací skupiny nelze zlepšení po intervenci od tohoto jevu oddělit." }
kind = "technical"
see_also = ["baseline", "randomized-controlled-trial", "placebo-effect", "relief-vs-resolution"]
links = ["methods/index.md", "evidence/index.md"]
references = []

[[terms]]
id = "placebo-effect"
term = { en = "Placebo effect", cs = "Placebo efekt" }
definition = { en = "Improvement attributable to the context of an intervention, such as expectation, ritual, attention and the relationship with a practitioner, rather than to its specific active ingredient. Research describes placebo effects as genuine biopsychosocial phenomena that go beyond spontaneous remission or normal fluctuation, and they are most evident on self-reported outcomes such as pain or distress. In emotion research, expectation-driven relief matters because believing that an activity is cathartic can shape both how it feels and how it is reported.", cs = "Zlepšení, které lze přičíst kontextu intervence, například očekávání, rituálu, pozornosti a vztahu s odborníkem, a nikoli její specifické účinné složce. Výzkum popisuje placebo efekty jako skutečné biopsychosociální jevy, které přesahují spontánní odeznění obtíží či běžné kolísání, a nejvýrazněji se projevují u sebeposuzovaných výsledků, jako je bolest nebo distres. Ve výzkumu emocí je úleva vyvolaná očekáváním důležitá, protože přesvědčení, že činnost přináší katarzi, může ovlivnit, jak ji člověk prožívá i jak o ní vypovídá." }
kind = "technical"
see_also = ["blinding", "demand-characteristics", "regression-to-the-mean", "self-report"]
links = ["methods/index.md", "research/venting-hypothesis/index.md"]
references = ["kaptchuk-miller-2015", "bushman-baumeister-stack-1999"]

[[terms]]
id = "demand-characteristics"
term = { en = "Demand characteristics", cs = "Požadavkové charakteristiky (demand characteristics)" }
definition = { en = "Cues in an experimental situation that convey to participants what the study is about or what response is expected, and that can shape their behaviour independently of the manipulation. Orne described the experiment as a social situation in which participants actively try to be good subjects. Studies of emotion regulation are particularly exposed, because instructions such as 'try to feel less upset' make the expected answer obvious; post-experimental inquiry, cover stories and measures less open to self-presentation are used to reduce the problem.", cs = "Vodítka v experimentální situaci, která účastníkům naznačují, o čem studie je nebo jaká reakce se očekává, a která mohou ovlivnit jejich chování nezávisle na samotné manipulaci. Orne popsal experiment jako sociální situaci, v níž se účastníci aktivně snaží být „dobrými“ subjekty. Studie regulace emocí jsou tomu zvlášť vystaveny, protože pokyny typu „snažte se být méně rozrušení“ očekávanou odpověď zjevně prozrazují; problém se omezuje dotazováním po experimentu, krycími příběhy a měřítky méně podléhajícími sebeprezentaci." }
kind = "technical"
see_also = ["self-report", "placebo-effect", "blinding", "ecological-validity"]
links = ["methods/index.md", "research/measuring-emotion/index.md"]
references = ["orne-1962"]

[[terms]]
id = "ecological-validity"
term = { en = "Ecological validity", cs = "Ekologická validita" }
definition = { en = "The degree to which the conditions, tasks and stimuli of a study resemble the situations in daily life to which its findings are meant to apply. Much evidence on emotion regulation comes from brief laboratory inductions with film clips, images or staged provocations, which differ from long-lasting personal difficulties. Methods such as ecological momentary assessment gain ecological validity by sampling experience in daily life, usually at the cost of experimental control.", cs = "Míra, do jaké se podmínky, úlohy a podněty studie podobají situacím běžného života, na které se mají její zjištění vztahovat. Mnoho poznatků o regulaci emocí pochází z krátkých laboratorních indukcí s filmovými ukázkami, obrázky nebo inscenovanými provokacemi, které se od dlouhodobých osobních obtíží liší. Metody jako ekologické okamžikové hodnocení získávají ekologickou validitu tím, že zaznamenávají prožitky v každodenním životě, obvykle za cenu menší experimentální kontroly." }
kind = "technical"
see_also = ["external-validity", "ecological-momentary-assessment", "context", "demand-characteristics"]
links = ["methods/index.md", "research/measuring-emotion/index.md"]
references = ["shiffman-2008"]

[[terms]]
id = "external-validity"
term = { en = "External validity", cs = "Externí validita" }
definition = { en = "The extent to which a result obtained in one study holds for other people, settings, times, interventions and outcome measures. A well-controlled experiment in university students may have strong internal validity yet limited external validity for clinical populations or other cultures. External validity is judged from the diversity of samples and settings across studies, and it is one reason the evidence ledger records each source's population.", cs = "Míra, do jaké výsledek získaný v jedné studii platí i pro jiné lidi, prostředí, doby, intervence a měřítka výsledků. Dobře kontrolovaný experiment s vysokoškolskými studenty může mít silnou vnitřní validitu, a přitom omezenou externí validitu pro klinické populace nebo jiné kultury. Externí validita se posuzuje podle rozmanitosti vzorků a prostředí napříč studiemi, a i proto evidence tvrzení u každého zdroje zaznamenává zkoumanou populaci." }
kind = "technical"
see_also = ["ecological-validity", "selection-bias", "replication", "evidence-level"]
links = ["methods/index.md", "evidence/index.md"]
references = []

[[terms]]
id = "preregistration"
term = { en = "Preregistration", cs = "Předregistrace" }
definition = { en = "Recording a study's hypotheses, design and analysis plan in a time-stamped public registry before the outcome data are observed. It separates confirmatory tests of predictions from exploratory analyses generated after seeing the data, which makes undisclosed analytic flexibility easier to detect. Preregistration does not make a study correct, and deviations from the plan are acceptable when they are reported transparently.", cs = "Zaznamenání hypotéz, designu a plánu analýzy studie do veřejného registru s časovým razítkem dříve, než jsou známa data o výsledcích. Odděluje potvrzující testy předpovědí od explorativních analýz vytvořených až po nahlédnutí do dat, takže nepřiznanou analytickou flexibilitu lze snáze odhalit. Předregistrace nečiní studii automaticky správnou a odchylky od plánu jsou přijatelné, jsou-li transparentně uvedeny." }
kind = "technical"
see_also = ["p-hacking", "publication-bias", "replication", "randomized-controlled-trial"]
links = ["methods/index.md", "evidence/index.md"]
references = ["nosek-2018"]

[[terms]]
id = "replication"
term = { en = "Replication", cs = "Replikace" }
definition = { en = "Repeating a study, with new data, to test whether its finding recurs. In a large coordinated project that repeated 100 published psychology studies, replication effects were on average about half the size of the originals, and 36% of replications reached statistical significance compared with 97% of the originals. A failed replication does not by itself show that an original effect is false, but findings that have not been independently replicated warrant more cautious wording.", cs = "Zopakování studie na nových datech s cílem ověřit, zda se její zjištění znovu objeví. V rozsáhlém koordinovaném projektu, který zopakoval 100 publikovaných psychologických studií, dosahovaly účinky v replikacích v průměru zhruba poloviny původní velikosti a statistické významnosti dosáhlo 36 % replikací oproti 97 % původních studií. Neúspěšná replikace sama o sobě neukazuje, že původní účinek neexistuje, ale zjištění, která nebyla nezávisle replikována, vyžadují opatrnější formulace." }
kind = "technical"
see_also = ["preregistration", "statistical-power", "publication-bias", "external-validity"]
links = ["methods/index.md", "evidence/index.md"]
references = ["osc-2015"]

[[terms]]
id = "statistical-power"
term = { en = "Statistical power and sample size", cs = "Statistická síla a velikost vzorku" }
definition = { en = "Power is the probability that a study will detect an effect of a given size if that effect exists; it rises with sample size, effect size and measurement precision. Underpowered studies miss real effects, and, less obviously, the significant results they do report tend to exaggerate effect sizes and are less likely to reflect true effects. Power should be planned before data collection, typically for the smallest effect that would matter.", cs = "Statistická síla je pravděpodobnost, že studie zachytí účinek dané velikosti, pokud tento účinek existuje; roste s velikostí vzorku, velikostí účinku a přesností měření. Studie s nízkou silou přehlížejí skutečné účinky a, což je méně zřejmé, významné výsledky, které přece jen vykážou, mívají nadsazené velikosti účinku a s menší pravděpodobností odrážejí skutečný účinek. Sílu je vhodné plánovat před sběrem dat, obvykle pro nejmenší účinek, který by měl praktický význam." }
kind = "technical"
see_also = ["effect-size", "false-negative", "replication", "confidence-interval"]
links = ["methods/index.md", "evidence/index.md"]
references = ["button-2013"]

[[terms]]
id = "moderator"
term = { en = "Moderator", cs = "Moderátor" }
definition = { en = "A variable that changes the strength or direction of the relationship between two other variables, answering the question 'for whom or under what conditions'. For instance, whether talking about an event helps may depend on whether the listener responds with support or with judgement. Moderators found by comparing studies within a meta-analysis are associations across studies, not tested causes, and they are easily confounded with other study features.", cs = "Proměnná, která mění sílu nebo směr vztahu mezi dvěma jinými proměnnými a odpovídá na otázku „u koho a za jakých podmínek“. Zda vyprávění o události pomáhá, může například záviset na tom, zda posluchač reaguje oporou, nebo odsudkem. Moderátory zjištěné srovnáním studií v metaanalýze jsou souvislosti napříč studiemi, nikoli otestované příčiny, a snadno se překrývají s jinými vlastnostmi studií." }
kind = "technical"
see_also = ["mediator", "heterogeneity", "context", "meta-analysis"]
links = ["methods/index.md", "evidence/index.md"]
references = ["baron-kenny-1986"]

[[terms]]
id = "mediator"
term = { en = "Mediator", cs = "Mediátor" }
definition = { en = "A variable that lies on the pathway between a cause and an outcome and is proposed to explain how or why the effect occurs, for example a change in how an event is understood linking expressive writing to later well-being. Statistical mediation analysis of correlational data cannot by itself establish such a pathway, because the mediator and the outcome may share unmeasured causes. Stronger support requires temporal ordering, experimental manipulation of the mediator, and a dose–response pattern.", cs = "Proměnná, která leží na cestě mezi příčinou a výsledkem a má vysvětlit, jak nebo proč k účinku dochází, například změna v porozumění události, která propojuje expresivní psaní s pozdější pohodou. Statistická mediační analýza korelačních dat takovou cestu sama o sobě doložit nemůže, protože mediátor i výsledek mohou mít společné neměřené příčiny. Silnější podporu vyžaduje časovou posloupnost, experimentální manipulaci s mediátorem a vztah dávky a odpovědi." }
kind = "technical"
see_also = ["moderator", "confounding", "dose-response", "inference"]
links = ["methods/index.md", "evidence/index.md"]
references = ["baron-kenny-1986", "cuijpers-2019"]

[[terms]]
id = "dose-response"
term = { en = "Dose–response relationship", cs = "Vztah dávky a odpovědi" }
definition = { en = "A pattern in which the size of an outcome changes systematically with the amount, intensity or duration of an exposure or intervention. A dose–response gradient is one of several considerations that strengthen a causal interpretation, although it can also arise from confounding if the dose is not assigned at random. Relationships need not be linear: benefits may level off, or reverse beyond a certain amount.", cs = "Vzorec, v němž se velikost výsledku soustavně mění s množstvím, intenzitou nebo trváním expozice či intervence. Gradient dávky a odpovědi patří k několika okolnostem, které posilují kauzální výklad, může však vzniknout i zkreslením třetí proměnnou, není-li dávka přidělena náhodně. Vztah nemusí být lineární: přínosy se mohou od určitého množství ustálit nebo obrátit." }
kind = "technical"
see_also = ["mediator", "confounding", "randomized-controlled-trial", "effect-size"]
links = ["methods/index.md", "evidence/index.md"]
references = ["cuijpers-2019"]

[[terms]]
id = "within-between-person-effects"
term = { en = "Within-person and between-person effects", cs = "Intraindividuální a interindividuální účinky (within-person / between-person)" }
definition = { en = "Two distinct questions that the same variables can answer. A between-person effect compares people, for example whether those who share emotions more often than others report more well-being; a within-person effect compares one person with themselves, for example whether someone feels better on days when they share more than they usually do. The two can differ in size and even in sign, and longitudinal multilevel models are used to separate them.", cs = "Dvě odlišné otázky, na které mohou odpovídat tytéž proměnné. Interindividuální účinek srovnává lidi, například zda ti, kdo sdílejí emoce častěji než ostatní, uvádějí vyšší pohodu; intraindividuální účinek srovnává člověka s ním samým, například zda se někdo cítí lépe ve dnech, kdy sdílí více, než je u něj obvyklé. Oba účinky se mohou lišit velikostí, a dokonce i znaménkem, a k jejich oddělení se používají longitudinální víceúrovňové modely." }
kind = "technical"
see_also = ["ecological-momentary-assessment", "emotion-dynamics", "correlation-coefficient", "baseline"]
links = ["methods/index.md", "research/measuring-emotion/index.md"]
references = ["curran-bauer-2011"]

[[terms]]
id = "p-hacking"
term = { en = "P-hacking", cs = "P-hacking" }
definition = { en = "Undisclosed flexibility in data collection, analysis and reporting, such as trying several outcomes, adding participants until a result is significant, or selectively excluding observations, that increases the chance of obtaining a statistically significant result. Simulations by Simmons, Nelson and Simonsohn showed that combining a few such choices can raise the false-positive rate far above the nominal 5%. The practice is often unintentional, and preregistration and full disclosure of analytic decisions are the main safeguards.", cs = "Nepřiznaná flexibilita při sběru, analýze a vykazování dat, například zkoušení více výstupů, přidávání účastníků, dokud výsledek nevyjde významný, nebo selektivní vyřazování pozorování, která zvyšuje šanci získat statisticky významný výsledek. Simulace Simmonse, Nelsona a Simonsohna ukázaly, že kombinace několika takových rozhodnutí může zvýšit míru falešně pozitivních výsledků vysoko nad nominálních 5 %. Praxe bývá často nezáměrná a hlavními pojistkami jsou předregistrace a úplné zveřejnění analytických rozhodnutí." }
kind = "technical"
see_also = ["false-positive", "preregistration", "publication-bias", "statistical-significance"]
links = ["methods/index.md", "evidence/index.md"]
references = ["simmons-2011"]

[[terms]]
id = "blinding"
term = { en = "Blinding", cs = "Zaslepení" }
definition = { en = "Keeping participants, practitioners, outcome assessors or analysts unaware of which condition each participant received, so that expectations cannot shape outcomes or their measurement. In psychological interventions participants usually know what they are doing, so full blinding is rarely possible; blinding outcome assessors and analysts remains feasible. Where blinding is absent, self-reported outcomes are more exposed to expectation effects than objective ones.", cs = "Utajení toho, do které podmínky byl účastník zařazen, před účastníky, terapeuty, hodnotiteli výsledků nebo analytiky, aby očekávání nemohla ovlivnit výsledky ani jejich měření. U psychologických intervencí účastníci obvykle vědí, co dělají, takže úplné zaslepení je možné jen zřídka; zaslepení hodnotitelů výsledků a analytiků však zůstává proveditelné. Kde zaslepení chybí, jsou sebeposuzované výsledky vystaveny vlivu očekávání více než výsledky objektivní." }
kind = "technical"
see_also = ["randomized-controlled-trial", "placebo-effect", "demand-characteristics", "self-report"]
links = ["methods/index.md", "evidence/index.md"]
references = []

# ── Proposed 2026-09-14: psychophysiology and neuroscience ───────────────────────────────────────

[[terms]]
id = "vagal-tone"
term = { en = "Vagal tone", cs = "Vagový tonus" }
definition = { en = "The ongoing influence of the vagus nerve, the main parasympathetic pathway, on the heart and other organs. It cannot be recorded directly in humans and is usually estimated from heart rate variability indices that track breathing-related changes in heart rate. The neurovisceral integration model proposes that higher resting vagally mediated HRV is associated with more flexible emotion regulation; the evidence is largely correlational, and the indices are sensitive to breathing, posture and fitness.", cs = "Trvalý vliv bloudivého nervu, hlavní parasympatické dráhy, na srdce a další orgány. U člověka jej nelze zaznamenat přímo a obvykle se odhaduje z ukazatelů variability srdeční frekvence, které sledují změny tepu související s dýcháním. Model neuroviscerální integrace předpokládá, že vyšší klidová vagově zprostředkovaná HRV souvisí s pružnější regulací emocí; doklady jsou převážně korelační a ukazatele jsou citlivé na dýchání, polohu těla a kondici." }
kind = "empirical"
see_also = ["heart-rate-variability", "autonomic-nervous-system", "prefrontal-cortex", "emotion-regulation"]
links = ["research/stress-and-social-buffering/index.md", "research/measuring-emotion/index.md"]
references = ["laborde-2017", "thayer-lane-2000"]

[[terms]]
id = "hpa-axis"
term = { en = "HPA axis", cs = "Osa HPA" }
definition = { en = "The hypothalamic–pituitary–adrenal axis, a hormonal cascade in which the hypothalamus signals the pituitary gland, which in turn stimulates the adrenal cortex to secrete cortisol. A meta-analysis of 208 laboratory studies found that psychological stressors raised cortisol on average, with the largest and longest-lasting responses to tasks that were uncontrollable and involved social-evaluative threat. Cortisol responses vary with time of day, sex, medication and many other factors, so a cortisol level is not a direct measure of how stressed a person feels.", cs = "Osa hypotalamus–hypofýza–nadledviny, hormonální kaskáda, v níž hypotalamus signalizuje hypofýze a ta následně podněcuje kůru nadledvin k vyplavování kortizolu. Metaanalýza 208 laboratorních studií zjistila, že psychické stresory kortizol v průměru zvyšovaly, přičemž největší a nejdéle trvající odpovědi vyvolávaly úlohy, které byly nekontrolovatelné a zahrnovaly hrozbu sociálního hodnocení. Kortizolová odpověď se liší podle denní doby, pohlaví, léků a mnoha dalších faktorů, takže hladina kortizolu není přímým měřítkem toho, jak stresovaně se člověk cítí." }
kind = "empirical"
see_also = ["cortisol-awakening-response", "allostatic-load", "autonomic-nervous-system", "social-baseline-theory"]
links = ["research/stress-and-social-buffering/index.md"]
references = ["dickerson-kemeny-2004", "mcewen-1998"]

[[terms]]
id = "cortisol-awakening-response"
term = { en = "Cortisol awakening response", cs = "Kortizolová odpověď na probuzení (CAR)" }
definition = { en = "The marked rise in cortisol over roughly the first 30 to 45 minutes after waking in the morning, usually measured from saliva samples that participants collect at home. It has been related to a wide range of psychosocial and health variables, but its measurement depends critically on sampling exactly on schedule from the moment of waking. Expert consensus guidelines call for objective checks of sampling times, because small delays can distort the estimate and produce spurious associations.", cs = "Výrazný vzestup kortizolu přibližně během prvních 30 až 45 minut po ranním probuzení, obvykle měřený ze vzorků slin, které si účastníci odebírají doma. Byl dáván do souvislosti s řadou psychosociálních a zdravotních proměnných, jeho měření však zásadně závisí na přesném dodržení časového plánu odběrů od okamžiku probuzení. Konsenzuální doporučení expertů vyžadují objektivní kontrolu časů odběru, protože i malá zpoždění mohou odhad zkreslit a vytvořit zdánlivé souvislosti." }
kind = "technical"
see_also = ["hpa-axis", "baseline", "ecological-validity", "signal"]
links = ["research/stress-and-social-buffering/index.md", "research/measuring-emotion/index.md"]
references = ["stalder-2016"]

[[terms]]
id = "skin-conductance-response"
term = { en = "Skin conductance response", cs = "Reakce kožní vodivosti (SCR)" }
definition = { en = "A brief, phasic increase in the electrical conductance of the skin, typically beginning one to a few seconds after a stimulus, that reflects sympathetically driven sweat gland activity. It is distinguished from the slowly changing skin conductance level, and both are components of electrodermal activity. Skin conductance responses index arousal and orienting to novel or significant events, but they occur for pleasant, unpleasant and neutral stimuli alike and do not indicate which emotion, if any, a person is experiencing.", cs = "Krátké fázické zvýšení elektrické vodivosti kůže, které obvykle začíná jednu až několik sekund po podnětu a odráží sympaticky řízenou činnost potních žláz. Odlišuje se od pomalu se měnící úrovně kožní vodivosti a obojí jsou složkami elektrodermální aktivity. Reakce kožní vodivosti indexují arousal a orientaci na nové či významné události, objevují se však u příjemných, nepříjemných i neutrálních podnětů a neukazují, jakou emoci, pokud vůbec nějakou, člověk prožívá." }
kind = "technical"
see_also = ["electrodermal-activity", "arousal", "habituation", "reverse-inference"]
links = ["research/measuring-emotion/index.md", "methods/index.md"]
references = ["boucsein-2012"]

[[terms]]
id = "amygdala"
term = { en = "Amygdala", cs = "Amygdala" }
definition = { en = "A pair of almond-shaped clusters of nuclei in the medial temporal lobes. Imaging studies associate amygdala activity with the salience and relevance of stimuli, including but not limited to threat, and with learning about them. Popular descriptions of it as 'the fear centre' are not supported: a meta-analysis of neuroimaging studies found that the amygdala was active across several emotion categories and during non-emotional tasks, and that discrete emotions could not be consistently localised to single regions.", cs = "Párové shluky jader mandlovitého tvaru ve středních částech spánkových laloků. Zobrazovací studie spojují aktivitu amygdaly s nápadností a významem podnětů, včetně hrozby, avšak nejen s ní, a s učením o nich. Populární označení „centrum strachu“ oporu nemá: metaanalýza neurozobrazovacích studií zjistila, že amygdala byla aktivní napříč několika kategoriemi emocí i při neemočních úlohách a že jednotlivé emoce nelze konzistentně lokalizovat do jediné oblasti." }
kind = "empirical"
see_also = ["reverse-inference", "prefrontal-cortex", "affect-labeling", "habituation"]
links = ["research/measuring-emotion/index.md"]
references = ["lindquist-2012", "lieberman-2007"]

[[terms]]
id = "prefrontal-cortex"
term = { en = "Prefrontal cortex in emotion regulation", cs = "Prefrontální kůra v regulaci emocí" }
definition = { en = "The front part of the frontal lobes, whose lateral, medial and orbital subregions are associated with goal maintenance, cognitive control and valuation. A meta-analysis of 48 neuroimaging studies found that cognitive reappraisal consistently engaged dorsolateral and ventrolateral prefrontal, parietal and lateral temporal regions and was accompanied by modulation of bilateral amygdala activity. These are group-level associations from imaging tasks; they describe regions involved in instructed regulation, not a switch that turns emotions off.", cs = "Přední část čelních laloků, jejíž laterální, mediální a orbitální oblasti jsou spojovány s udržováním cílů, kognitivní kontrolou a hodnocením. Metaanalýza 48 neurozobrazovacích studií zjistila, že kognitivní přehodnocení konzistentně aktivovalo dorzolaterální a ventrolaterální prefrontální, parietální a laterální spánkové oblasti a provázela je modulace aktivity amygdaly na obou stranách. Jde o skupinové souvislosti ze zobrazovacích úloh; popisují oblasti zapojené do instruované regulace, nikoli vypínač, který emoce vypne." }
kind = "empirical"
see_also = ["reappraisal", "amygdala", "emotion-regulation", "reverse-inference"]
links = ["research/measuring-emotion/index.md", "advice/reappraise/index.md"]
references = ["buhle-2014", "ochsner-gross-2005"]

[[terms]]
id = "interoception"
term = { en = "Interoception", cs = "Interocepce" }
definition = { en = "The sensing, interpretation and integration of signals from inside the body, such as heartbeat, breathing, hunger and visceral sensations. Research distinguishes interoceptive accuracy on objective tasks such as heartbeat detection, self-reported interoceptive sensibility, and metacognitive awareness of one's own accuracy; in one sample these three dimensions were dissociable. Heartbeat-counting tasks in particular have been criticised for being influenced by beliefs about heart rate, so accuracy scores should be interpreted cautiously.", cs = "Vnímání, interpretace a integrace signálů zevnitř těla, například tepu, dýchání, hladu a útrobních pocitů. Výzkum rozlišuje interoceptivní přesnost v objektivních úlohách, jako je vnímání tepu, sebeposuzovanou interoceptivní citlivost a metakognitivní uvědomění vlastní přesnosti; v jednom vzorku byly tyto tři dimenze navzájem oddělitelné. Zejména úlohy počítání tepů byly kritizovány, protože je ovlivňují přesvědčení o vlastní srdeční frekvenci, a skóre přesnosti je proto třeba vykládat opatrně." }
kind = "empirical"
see_also = ["alexithymia", "emotional-granularity", "heart-rate-variability", "self-report"]
links = ["research/measuring-emotion/index.md", "advice/name-the-feeling/index.md"]
references = ["garfinkel-2015"]

[[terms]]
id = "reward-prediction-error"
term = { en = "Reward prediction error", cs = "Chyba predikce odměny" }
definition = { en = "The difference between the reward that was expected and the reward that was received, a quantity that learning models use to update expectations. Recordings in primates showed that the firing of midbrain dopamine neurons increases after unexpectedly good outcomes, shifts to cues that predict reward, and dips when an expected reward is omitted. The concept is used to interpret findings on anticipation and pleasure, for example in music, but dopamine signals are not a direct measure of felt pleasure.", cs = "Rozdíl mezi očekávanou a skutečně získanou odměnou, veličina, kterou modely učení používají k aktualizaci očekávání. Záznamy u primátů ukázaly, že aktivita dopaminových neuronů středního mozku roste po nečekaně dobrém výsledku, přesouvá se na podněty, které odměnu předpovídají, a klesá, když očekávaná odměna nepřijde. Pojem se používá k výkladu zjištění o očekávání a potěšení, například u hudby, dopaminové signály však nejsou přímým měřítkem prožívaného potěšení." }
kind = "theoretical"
see_also = ["music-based-emotion-regulation", "negative-reinforcement", "endogenous-opioids", "reverse-inference"]
links = ["research/music-and-emotion-regulation/index.md", "research/collective-synchrony/index.md"]
references = ["schultz-1997", "salimpoor-2011"]

[[terms]]
id = "endogenous-opioids"
term = { en = "Endogenous opioids and the endorphin hypothesis", cs = "Endogenní opioidy a endorfinová hypotéza" }
definition = { en = "Endogenous opioids, including beta-endorphin, are peptides produced by the body that act on opioid receptors and are involved in pain modulation and reward. The endorphin hypothesis proposes that activities such as laughter, synchronised dance and exertion feel good and promote bonding partly through opioid release. Most human studies test it indirectly, using a rise in pain threshold as a proxy, so the evidence is consistent with the hypothesis rather than a direct measurement of opioid activity.", cs = "Endogenní opioidy, mezi něž patří beta-endorfin, jsou peptidy tvořené tělem, které působí na opioidní receptory a podílejí se na tlumení bolesti a na odměně. Endorfinová hypotéza předpokládá, že činnosti jako smích, synchronizovaný tanec a fyzická námaha jsou příjemné a podporují sounáležitost zčásti díky uvolnění opioidů. Většina studií u lidí ji testuje nepřímo, se zvýšením prahu bolesti jako zástupným ukazatelem, takže poznatky jsou s hypotézou v souladu, nejde však o přímé měření opioidní aktivity." }
kind = "theoretical"
see_also = ["interpersonal-synchrony", "entrainment", "reward-prediction-error", "collective-effervescence"]
links = ["research/collective-synchrony/index.md", "advice/move-together/index.md"]
references = ["dunbar-2012", "tarr-2015"]

[[terms]]
id = "habituation"
term = { en = "Habituation", cs = "Habituace" }
definition = { en = "A decrease in response to a stimulus that is presented repeatedly and has no significant consequence, one of the simplest forms of learning, found across species. It is distinguished from sensory adaptation and fatigue by features such as recovery after a pause and restoration of the response when a different stimulus intervenes. In emotion research, habituation of physiological responses to repeated stimuli must be considered when interpreting declining responses over a session, because a smaller response does not by itself indicate that an emotion has been processed or resolved.", cs = "Pokles reakce na podnět, který se opakuje a nemá žádný významný důsledek; jde o jednu z nejjednodušších forem učení, kterou nacházíme napříč druhy. Od smyslové adaptace a únavy se odlišuje například obnovou reakce po přestávce nebo po vložení jiného podnětu. Ve výzkumu emocí je třeba habituaci fyziologických reakcí na opakované podněty zohlednit při výkladu reakcí, které během sezení slábnou, protože menší reakce sama o sobě neukazuje, že emoce byla zpracována nebo vyřešena." }
kind = "empirical"
see_also = ["skin-conductance-response", "emotional-processing", "relief-vs-resolution", "baseline"]
links = ["research/measuring-emotion/index.md", "research/relief-is-not-resolution/index.md"]
references = ["rankin-2009"]

# ── Proposed 2026-09-14: social and affective psychology ─────────────────────────────────────────

[[terms]]
id = "emotional-contagion"
term = { en = "Emotional contagion", cs = "Emoční nákaza" }
definition = { en = "The tendency for emotions expressed by one person to be taken up by others, often without deliberate intent or awareness. It is well documented in face-to-face laboratory settings; in a large experiment on Facebook, reducing positive posts in users' feeds was followed by fewer positive and more negative posts, and the reverse for negative posts. The effects in that study were very small, the outcome was the language of posts rather than felt emotion, and the study drew wide criticism over informed consent.", cs = "Sklon lidí přebírat emoce, které projevuje někdo jiný, často bez záměru či uvědomění. V laboratorních podmínkách tváří v tvář je dobře doložena; ve velkém experimentu na Facebooku po omezení pozitivních příspěvků v kanálu uživatelů následovalo méně pozitivních a více negativních příspěvků a u negativních příspěvků tomu bylo naopak. Účinky v této studii byly velmi malé, výsledkem byl jazyk příspěvků, nikoli prožívaná emoce, a studie byla široce kritizována kvůli otázkám informovaného souhlasu." }
kind = "empirical"
see_also = ["co-regulation", "interpersonal-synchrony", "collective-effervescence", "self-report"]
links = ["research/collective-synchrony/index.md", "research/crying-and-sharing/index.md"]
references = ["kramer-2014"]

[[terms]]
id = "co-regulation"
term = { en = "Co-regulation", cs = "Koregulace" }
definition = { en = "A process in which relationship partners form a linked emotional system, so that each person's affective and physiological fluctuations influence the other's in a way that contributes to emotional stability for both. Butler and Randall proposed restricting the term to such bidirectional, oscillating linkage, because it had been used loosely for any form of social influence on emotion. It is studied mostly in couples and in parent–child dyads, with repeated measures over time.", cs = "Proces, v němž partneři ve vztahu tvoří propojený emoční systém, takže afektivní a fyziologické výkyvy jednoho ovlivňují výkyvy druhého způsobem, který přispívá k emoční stabilitě obou. Butlerová a Randallová navrhly vyhradit pojem pro takové obousměrné, oscilující propojení, protože se volně užíval pro jakýkoli sociální vliv na emoce. Zkoumá se převážně u párů a dvojic rodič–dítě pomocí opakovaného měření v čase." }
kind = "theoretical"
see_also = ["interpersonal-emotion-regulation", "emotional-contagion", "social-baseline-theory", "emotion-dynamics"]
links = ["research/stress-and-social-buffering/index.md", "advice/build-lasting-support/index.md"]
references = ["butler-randall-2013"]

[[terms]]
id = "interpersonal-emotion-regulation"
term = { en = "Interpersonal emotion regulation", cs = "Interpersonální regulace emocí" }
definition = { en = "Regulating emotion through social interaction, either one's own emotion with the help of others or another person's emotion. Zaki and Williams distinguish intrinsic regulation, in which a person uses others to change their own feelings, from extrinsic regulation, in which a person tries to change someone else's, and response-dependent processes, which rely on the other's actual reaction, from response-independent ones, such as the effect of putting feelings into words for someone. The framework organises findings on sharing, support and empathy but is still being tested.", cs = "Regulace emocí prostřednictvím sociální interakce, ať jde o regulaci vlastních emocí s pomocí druhých, nebo o regulaci emocí jiného člověka. Zaki a Williams rozlišují vnitřní (intrinsickou) regulaci, kdy člověk druhé využívá ke změně vlastních pocitů, od vnější (extrinsické), kdy se snaží změnit pocity někoho jiného, a dále procesy závislé na skutečné reakci druhého od procesů na ní nezávislých, jako je účinek samotného převedení pocitů do slov pro někoho. Rámec uspořádává poznatky o sdílení, opoře a empatii, jeho testování však stále probíhá." }
kind = "theoretical"
see_also = ["co-regulation", "social-sharing-of-emotion", "social-support", "emotion-regulation"]
links = ["research/crying-and-sharing/index.md", "research/stress-and-social-buffering/index.md"]
references = ["zaki-williams-2013"]

[[terms]]
id = "social-baseline-theory"
term = { en = "Social baseline theory", cs = "Teorie sociální výchozí úrovně (social baseline theory)" }
definition = { en = "A theory proposing that the ecology to which humans are adapted is rich in other people, so that social proximity is the expected baseline and being alone requires more costly self-regulation of threat. In a frequently cited fMRI study, 16 married women facing the threat of electric shock showed attenuated threat-related activation while holding their husband's hand, less so while holding a stranger's hand, with larger attenuation in higher-quality marriages. The theory is influential, but the imaging evidence comes from small samples and replication is limited.", cs = "Teorie, podle níž je prostředím, na které jsou lidé přizpůsobeni, prostředí plné druhých lidí, takže sociální blízkost je očekávanou výchozí úrovní a samota vyžaduje nákladnější vlastní regulaci hrozby. V často citované fMRI studii vykazovalo 16 vdaných žen vystavených hrozbě elektrického šoku oslabenou aktivaci spojenou s hrozbou, když držely za ruku manžela, méně výrazně při držení ruky cizího muže, a oslabení bylo větší v kvalitnějších manželstvích. Teorie je vlivná, zobrazovací doklady však pocházejí z malých vzorků a replikací je málo." }
kind = "theoretical"
see_also = ["social-support", "co-regulation", "hpa-axis", "allostatic-load"]
links = ["research/stress-and-social-buffering/index.md", "advice/build-lasting-support/index.md"]
references = ["beckes-coan-2011", "coan-2006"]

[[terms]]
id = "emotional-granularity"
term = { en = "Emotional granularity", cs = "Emoční granularita" }
definition = { en = "The degree to which a person distinguishes between similar emotional experiences, for example between feeling irritated, ashamed and anxious rather than simply bad; also called emotion differentiation. It is usually estimated from repeated diary or momentary ratings, as the extent to which ratings of same-valence emotions do not move together. Higher negative-emotion differentiation has been associated with more frequent regulation of intense negative emotions and with fewer maladaptive coping behaviours, but most evidence is correlational.", cs = "Míra, do jaké člověk rozlišuje podobné emoční prožitky, například mezi podrážděním, studem a úzkostí, místo aby se cítil jen „špatně“; nazývá se také emoční diferenciace. Obvykle se odhaduje z opakovaných deníkových nebo okamžikových hodnocení jako míra, do jaké se hodnocení emocí stejné valence nemění společně. Vyšší diferenciace negativních emocí byla spojena s častější regulací intenzivních negativních emocí a s menším výskytem maladaptivních způsobů zvládání, většina dokladů je však korelační." }
kind = "empirical"
see_also = ["affect-labeling", "alexithymia", "interoception", "ecological-momentary-assessment"]
links = ["advice/name-the-feeling/index.md", "research/measuring-emotion/index.md"]
references = ["barrett-2001", "kashdan-2015"]

[[terms]]
id = "alexithymia"
term = { en = "Alexithymia", cs = "Alexithymie" }
definition = { en = "A personality trait characterised by difficulty identifying feelings, difficulty describing feelings to others, and an externally oriented thinking style. It is not a diagnosis and is distributed continuously in the population; it is most often measured with the self-report Toronto Alexithymia Scale (TAS-20). Because the scale asks people to judge their own awareness of emotion, scores may be limited by the very difficulty they are meant to capture, which is one reason researchers also use interview and performance measures.", cs = "Osobnostní rys charakterizovaný obtížemi rozpoznávat vlastní pocity, obtížemi popsat pocity druhým a myšlením zaměřeným navenek. Nejde o diagnózu a rys je v populaci rozložen spojitě; nejčastěji se měří sebeposuzovací Torontskou škálou alexithymie (TAS-20). Protože škála žádá, aby lidé posoudili vlastní uvědomování emocí, mohou být skóre omezena právě tou obtíží, kterou mají zachytit, a i proto výzkumníci používají také rozhovory a výkonové úlohy." }
kind = "clinical"
see_also = ["emotional-granularity", "interoception", "self-report", "affect-labeling"]
links = ["research/measuring-emotion/index.md", "advice/name-the-feeling/index.md"]
references = ["bagby-1994"]

[[terms]]
id = "awe"
term = { en = "Awe", cs = "Úžas" }
definition = { en = "An emotion felt in response to something perceived as vast, whether physically, conceptually or socially, that challenges one's current understanding. Keltner and Haidt proposed perceived vastness and a need for accommodation as its two central appraisals, with threat, beauty, ability, virtue and the supernatural shaping its tone. Awe can be pleasant or tinged with fear, and it is often grouped with the self-transcendent emotions.", cs = "Emoce prožívaná v reakci na něco, co člověk vnímá jako nesmírné, ať fyzicky, pojmově, nebo společensky, a co zpochybňuje jeho dosavadní porozumění. Keltner a Haidt navrhli jako dvě ústřední hodnocení vnímanou nesmírnost a potřebu přizpůsobení, přičemž zabarvení prožitku utvářejí hrozba, krása, výjimečná schopnost, ctnost a nadpřirozeno. Úžas může být příjemný, nebo zabarvený strachem, a bývá řazen mezi sebepřesahující emoce." }
kind = "theoretical"
see_also = ["self-transcendent-emotions", "collective-effervescence", "emotion", "music-based-emotion-regulation"]
links = ["research/collective-synchrony/index.md"]
references = ["keltner-haidt-2003"]

[[terms]]
id = "self-transcendent-emotions"
term = { en = "Self-transcendent emotions", cs = "Sebepřesahující emoce" }
definition = { en = "A proposed category of positive emotions, such as compassion, gratitude, awe and elevation, that shift attention away from the self towards other people or something larger. Reviews argue that they share a reduced self-focus and promote prosocial behaviour and group coordination. The category is a theoretical grouping; how distinct these emotions are from other positive states, and whether they share specific physiology, remain open questions.", cs = "Navrhovaná kategorie pozitivních emocí, jako je soucit, vděčnost, úžas a povznesení, které odvádějí pozornost od vlastního já k druhým lidem nebo k něčemu většímu. Přehledy uvádějí, že je spojuje oslabené zaměření na sebe a že podporují prosociální chování a koordinaci ve skupině. Kategorie je teoretickým seskupením; nakolik se tyto emoce liší od jiných pozitivních stavů a zda sdílejí specifickou fyziologii, zůstává otevřenou otázkou." }
kind = "theoretical"
see_also = ["awe", "collective-effervescence", "identity-fusion", "emotion"]
links = ["research/collective-synchrony/index.md"]
references = ["stellar-2017", "pizarro-2022"]

[[terms]]
id = "flow"
term = { en = "Flow", cs = "Flow (stav plného ponoření)" }
definition = { en = "A state of deep absorption in an activity, characterised by concentrated attention, a sense of control, merging of action and awareness, and altered perception of time, described by Csikszentmihalyi. It is thought to arise when the challenge of a task is balanced with a person's skill, although studies find that this balance predicts flow only under some conditions and for some people. Flow is measured mainly by self-report during or after activities, and it is not the same as relief or emotional resolution.", cs = "Stav hlubokého pohroužení do činnosti, který Csikszentmihalyi popsal jako soustředěnou pozornost, pocit kontroly, splynutí jednání s vědomím a změněné vnímání času. Předpokládá se, že vzniká, když je náročnost úkolu vyvážena dovednostmi člověka, studie však ukazují, že tato rovnováha flow předpovídá jen za některých podmínek a u některých lidí. Flow se měří hlavně sebeposouzením během činnosti nebo po ní a není totéž co úleva nebo emoční vyřešení." }
kind = "theoretical"
see_also = ["distraction", "music-based-emotion-regulation", "relief-vs-resolution", "self-report"]
links = ["research/music-and-emotion-regulation/index.md", "advice/move-together/index.md"]
references = ["engeser-rheinberg-2008"]

[[terms]]
id = "identity-fusion"
term = { en = "Identity fusion", cs = "Fúze identity" }
definition = { en = "A form of alignment with a group involving a visceral feeling of oneness, in which the boundary between personal and social identity becomes highly permeable. Swann and colleagues distinguish local fusion with small groups such as families from extended fusion with large collectives, and report that fusion measures are strong predictors of endorsement of extreme pro-group behaviour. Much of the evidence comes from self-reported willingness rather than observed behaviour, and the construct is relevant both to solidarity and to willingness to fight for a group.", cs = "Forma sounáležitosti se skupinou, která zahrnuje hluboký, tělesně prožívaný pocit jednoty, v němž se hranice mezi osobní a sociální identitou stává velmi propustnou. Swann a kolegové rozlišují lokální fúzi s malými skupinami, například rodinou, od rozšířené fúze s velkými kolektivy a uvádějí, že měřítka fúze silně předpovídají souhlas s extrémním jednáním ve prospěch skupiny. Velká část dokladů vychází z deklarované ochoty, nikoli z pozorovaného chování, a konstrukt je relevantní jak pro solidaritu, tak pro ochotu za skupinu bojovat." }
kind = "theoretical"
see_also = ["collective-effervescence", "self-transcendent-emotions", "interpersonal-synchrony", "arousal"]
links = ["research/collective-synchrony/index.md"]
references = ["swann-2012"]

[[terms]]
id = "entrainment"
term = { en = "Entrainment", cs = "Rytmické strhávání (entrainment)" }
definition = { en = "The alignment of a rhythmic process with an external rhythm, such as tapping or dancing in time with a musical beat. Social entrainment is the special case in which the rhythm comes from another person, so that individuals coordinate their movements with one another. It is a precondition for the interpersonal synchrony studied in relation to affiliation and cooperation, but entrainment itself describes timing, not the emotional or social consequences sometimes attributed to it.", cs = "Sladění rytmického procesu s vnějším rytmem, například ťukání nebo tanec v rytmu hudebního beatu. Sociální strhávání je zvláštní případ, kdy rytmus pochází od jiného člověka, takže jedinci koordinují své pohyby navzájem. Je předpokladem interpersonální synchronie, která se zkoumá v souvislosti s náklonností a spoluprací, samotné strhávání však popisuje časování, nikoli emoční či sociální důsledky, které se mu někdy připisují." }
kind = "empirical"
see_also = ["interpersonal-synchrony", "music-based-emotion-regulation", "endogenous-opioids", "collective-effervescence"]
links = ["research/collective-synchrony/index.md", "advice/move-together/index.md"]
references = ["phillips-silver-2010", "janata-2012"]

# ── Proposed 2026-09-14: clinical boundary ───────────────────────────────────────────────────────

[[terms]]
id = "crisis-line"
term = { en = "Crisis line", cs = "Krizová linka" }
definition = { en = "A telephone, text or chat service, usually free, confidential and available at any hour, that offers immediate support to people in acute distress, including suicidal crisis, and helps connect them with further care. In an evaluation of eight US crisis centres, suicidal callers reported decreases in suicidality during the call and further decreases in hopelessness and psychological pain in the following weeks; the study had no comparison group and only about a third of callers were followed up. When there is immediate danger to life, emergency services are the appropriate first contact.", cs = "Telefonická, textová nebo chatová služba, obvykle bezplatná, důvěrná a dostupná nepřetržitě, která nabízí okamžitou podporu lidem v akutní tísni, včetně suicidální krize, a pomáhá je propojit s další péčí. V hodnocení osmi krizových center v USA uváděli volající se sebevražednými myšlenkami během hovoru pokles suicidality a v následujících týdnech další pokles beznaděje a psychické bolesti; studie neměla srovnávací skupinu a sledování se podařilo jen asi u třetiny volajících. Při bezprostředním ohrožení života je vhodným prvním kontaktem záchranná služba." }
kind = "clinical"
see_also = ["clinical-boundary", "psychotherapy", "trauma-focused-therapy"]
links = ["research/clinical-perspectives/index.md", "advice/after-trauma/index.md"]
references = ["gould-2007"]

[[terms]]
id = "psychotherapy"
term = { en = "Evidence-based psychotherapy", cs = "Psychoterapie založená na důkazech" }
definition = { en = "Structured psychological treatment delivered by a trained professional whose efficacy for specific problems has been tested in controlled trials. Different therapies often show comparable average outcomes, which has fuelled debate about whether they work through techniques specific to each therapy or through common factors such as the therapeutic alliance. A review concluded that, because research on mechanisms has so far been correlational, no common or specific factor yet meets the criteria for an established working mechanism.", cs = "Strukturovaná psychologická léčba poskytovaná vyškoleným odborníkem, jejíž účinnost u konkrétních obtíží byla ověřena v kontrolovaných studiích. Různé terapie často vykazují srovnatelné průměrné výsledky, což živí debatu, zda působí technikami specifickými pro danou terapii, nebo společnými faktory, jako je terapeutický vztah. Přehled dospěl k závěru, že protože výzkum mechanismů byl dosud korelační, žádný společný ani specifický faktor zatím nesplňuje kritéria prokázaného mechanismu účinku." }
kind = "clinical"
see_also = ["cognitive-behavioural-therapy", "trauma-focused-therapy", "clinical-boundary", "mediator"]
links = ["research/clinical-perspectives/index.md"]
references = ["cuijpers-2019"]

[[terms]]
id = "cognitive-behavioural-therapy"
term = { en = "Cognitive behavioural therapy", cs = "Kognitivně-behaviorální terapie" }
definition = { en = "A family of structured, time-limited psychotherapies that target the interplay of thoughts, emotions and behaviour, using methods such as cognitive restructuring, behavioural activation and exposure. A meta-analysis of 144 randomised trials found large effects for depression and several anxiety disorders against control conditions, but smaller effects after adjusting for publication bias, few high-quality trials, and small to moderate effects when compared with care as usual or pill placebo rather than waiting lists. It is one well-tested option, not the only effective one.", cs = "Skupina strukturovaných, časově ohraničených psychoterapií zaměřených na vzájemné působení myšlenek, emocí a chování, které využívají metody jako kognitivní restrukturace, behaviorální aktivace a expozice. Metaanalýza 144 randomizovaných studií zjistila u deprese a několika úzkostných poruch velké účinky oproti kontrolním podmínkám, ale menší účinky po korekci na publikační zkreslení, jen málo vysoce kvalitních studií a malé až střední účinky ve srovnání s běžnou péčí nebo placebem v tabletách, nikoli s čekací listinou. Jde o jednu dobře ověřenou možnost, nikoli o jedinou účinnou." }
kind = "clinical"
see_also = ["psychotherapy", "reappraisal", "trauma-focused-therapy", "publication-bias"]
links = ["research/clinical-perspectives/index.md"]
references = ["cuijpers-2016"]

[[terms]]
id = "trauma-focused-therapy"
term = { en = "Trauma-focused therapy", cs = "Terapie zaměřená na trauma" }
definition = { en = "Psychological treatments for post-traumatic stress disorder that work directly with memories of the traumatic event and their meaning, such as cognitive processing therapy, cognitive therapy for PTSD, prolonged exposure and EMDR. A systematic review of 114 randomised trials with 8,171 participants found robust evidence of clinically important effects for trauma-focused cognitive behavioural therapies and EMDR. These are structured treatments delivered by trained clinicians over several sessions, unlike single-session debriefing shortly after an event, which trials did not support.", cs = "Psychologická léčba posttraumatické stresové poruchy, která přímo pracuje se vzpomínkami na traumatickou událost a s jejich významem, například terapie kognitivního zpracování, kognitivní terapie PTSD, prodloužená expozice a EMDR. Systematický přehled 114 randomizovaných studií s 8 171 účastníky našel robustní doklady klinicky významných účinků u kognitivně-behaviorálních terapií zaměřených na trauma a u EMDR. Jde o strukturovanou léčbu, kterou během několika sezení poskytují vyškolení kliničtí pracovníci, na rozdíl od jednorázového debriefingu krátce po události, který studie nepodpořily." }
kind = "clinical"
see_also = ["psychological-debriefing", "emotional-processing", "cognitive-behavioural-therapy", "clinical-boundary"]
links = ["research/clinical-perspectives/index.md", "advice/after-trauma/index.md"]
references = ["lewis-2020", "rose-2002"]

[[terms]]
id = "acute-exercise-effect"
term = { en = "Acute exercise effect", cs = "Akutní účinek pohybu" }
definition = { en = "A change in affect during a single bout of physical activity or in the hours after it, as distinct from the effects of regular activity over weeks. Studies in everyday settings consistently associate activity with higher positive, energetic affect over the next few hours, while evidence for lower negative affect is inconsistent. How the bout feels depends partly on intensity, with pleasure declining mainly above the ventilatory threshold.", cs = "Změna afektu během jednorázové pohybové aktivity nebo v hodinách po ní, na rozdíl od účinků pravidelné aktivity v průběhu týdnů. Studie v každodenním prostředí konzistentně spojují aktivitu s vyšším pozitivním, energickým afektem v následujících hodinách, zatímco doklady o nižším negativním afektu jsou nekonzistentní. Prožívání aktivity zčásti závisí na intenzitě; potěšení klesá hlavně nad ventilačním prahem." }
kind = "empirical"
see_also = ["affect", "arousal", "venting"]
links = ["research/exercise-and-mood/index.md", "advice/move-to-lower-arousal-and-lift-mood/index.md"]
references = ["reed-ones-2006", "liao-2015", "ekkekakis-2011"]

[[terms]]
id = "brooding"
term = { en = "Brooding", cs = "Hloubání" }
definition = { en = "A form of rumination involving passive, evaluative dwelling on one's situation and its shortfalls, often in abstract questions such as why something keeps happening. It is usually contrasted with reflection, a more purposeful attempt to understand or solve a problem. In an experience-sampling study, brooding but not reflective pondering was associated with higher negative affect.", cs = "Forma ruminace spočívající v pasivním, hodnoticím setrvávání u vlastní situace a jejích nedostatků, často v podobě abstraktních otázek, proč se něco stále děje. Obvykle se staví do protikladu k reflexi, tedy účelnější snaze problému porozumět nebo jej vyřešit. Ve studii se vzorkováním zážitků souviselo s vyšším negativním afektem hloubání, nikoli reflektivní přemítání." }
kind = "empirical"
see_also = ["rumination", "repetitive-thought", "self-distancing"]
links = ["research/rumination-and-repetitive-thought/index.md", "advice/interrupt-rumination-with-concrete-steps/index.md"]
references = ["moberly-watkins-2008", "watkins-2008"]

[[terms]]
id = "continuing-bonds"
term = { en = "Continuing bonds", cs = "Pokračující pouta" }
definition = { en = "An ongoing inner relationship with a person who has died, expressed for example in memories, inner conversations, keeping possessions or a sense of their presence. The concept challenged older views that mourning should end in detachment. Reviews note that whether and when continuing bonds are adaptive remains unclear, and attachment-based models have been proposed to predict it.", cs = "Trvající vnitřní vztah s člověkem, který zemřel, vyjádřený například ve vzpomínkách, vnitřních rozhovorech, uchovávání věcí nebo v pocitu jeho přítomnosti. Pojem zpochybnil starší představy, že truchlení má skončit odpoutáním. Přehledy uvádějí, že zda a kdy jsou pokračující pouta adaptivní, zůstává nejasné, a k předpovědi byly navrženy modely vycházející z teorie citové vazby." }
kind = "theoretical"
see_also = ["dual-process-model-of-bereavement", "prolonged-grief-disorder", "mourning-ritual"]
links = ["research/grief-and-rituals/index.md"]
references = ["stroebe-schut-boerner-2010"]

[[terms]]
id = "dual-process-model-of-bereavement"
term = { en = "Dual process model of bereavement", cs = "Duální procesový model truchlení" }
definition = { en = "A model of coping with loss proposed by Stroebe and Schut that distinguishes loss-oriented stressors, such as yearning and reminders, from restoration-oriented stressors, such as new roles and practical tasks. Adaptive coping is described as oscillation between confronting and avoiding each, including respite from grieving. It was proposed as an alternative to the grief work hypothesis, which holds that loss must be worked through.", cs = "Model vyrovnávání se se ztrátou navržený Stroebeovou a Schutem, který rozlišuje stresory zaměřené na ztrátu, například stesk a připomínky, a stresory zaměřené na obnovu, například nové role a praktické úkoly. Adaptivní vyrovnávání popisuje jako střídání konfrontace s oběma druhy stresorů a vyhýbání se jim, včetně oddechu od truchlení. Vznikl jako alternativa k hypotéze práce se zármutkem, podle níž je nutné ztrátu propracovat." }
kind = "theoretical"
see_also = ["continuing-bonds", "mourning-ritual", "distraction"]
links = ["research/grief-and-rituals/index.md", "advice/mark-a-loss-with-a-ritual/index.md"]
references = ["stroebe-schut-1999"]

[[terms]]
id = "experimental-disclosure"
term = { en = "Experimental disclosure", cs = "Experimentální sdělování" }
definition = { en = "The umbrella term for randomised studies in which participants disclose thoughts and feelings about personal, meaningful topics, in writing or aloud, compared with a control task. Expressive writing is its best-known form. A meta-analysis of 146 randomised studies found a positive, significant but small average effect, with effects varying by moderators such as dose and instructions.", cs = "Zastřešující pojem pro randomizované studie, v nichž účastníci sdělují myšlenky a pocity o osobních, významných tématech, písemně nebo nahlas, ve srovnání s kontrolní úlohou. Nejznámější formou je expresivní psaní. Metaanalýza 146 randomizovaných studií zjistila pozitivní, významný, ale malý průměrný účinek, který se lišil podle moderátorů, jako je dávka a instrukce." }
kind = "empirical"
see_also = ["expressive-writing", "effect-size", "meta-analysis"]
links = ["research/expressive-writing-evidence/index.md"]
references = ["frattaroli-2006", "smyth-1998"]

[[terms]]
id = "mourning-ritual"
term = { en = "Mourning ritual", cs = "Smuteční rituál" }
definition = { en = "A structured, often repeated sequence of actions performed after a loss, ranging from shared ceremonies such as funerals to small private acts. In experiments, recalling or performing rituals after a loss was followed by lower self-reported grief, mediated by a sense of control. In a field study, bereaved people valued funerals and rituals, but these were not associated with later grief reactions.", cs = "Strukturovaný, často opakovaný sled úkonů prováděný po ztrátě, od společných obřadů, jako je pohřeb, po malé soukromé úkony. V experimentech po vzpomínce na rituál nebo jeho provedení po ztrátě následoval nižší uváděný zármutek, zprostředkovaný pocitem kontroly. V terénní studii si pozůstalí pohřbů a rituálů cenili, ty však s pozdějšími reakcemi zármutku nesouvisely." }
kind = "empirical"
see_also = ["continuing-bonds", "dual-process-model-of-bereavement", "social-support"]
links = ["research/grief-and-rituals/index.md", "advice/mark-a-loss-with-a-ritual/index.md"]
references = ["norton-gino-2014", "mitima-verloop-2021", "hobson-2018"]

[[terms]]
id = "prolonged-grief-disorder"
term = { en = "Prolonged grief disorder", cs = "Prolongovaná porucha truchlení" }
definition = { en = "A clinical condition in which intense grief, centred on yearning for the deceased and accompanied by symptoms such as difficulty accepting the loss or feeling that life is meaningless, persists long after a death and impairs functioning. It is included in ICD-11; a meta-analysis of non-violent bereavement estimated a pooled prevalence of about one in ten bereaved adults. Only a qualified professional can assess it; intense grief in the first months is not in itself a disorder.", cs = "Klinický stav, při němž intenzivní zármutek soustředěný na stesk po zemřelém a provázený příznaky, jako jsou obtíže se ztrátou se smířit nebo pocit nesmyslnosti života, přetrvává dlouho po úmrtí a narušuje fungování. Je zařazen do MKN-11; metaanalýza nenásilných úmrtí odhadla souhrnnou prevalenci přibližně na jednoho z deseti pozůstalých dospělých. Posoudit jej může jen kvalifikovaný odborník; intenzivní zármutek v prvních měsících sám o sobě poruchou není." }
kind = "clinical"
see_also = ["clinical-boundary", "continuing-bonds", "dual-process-model-of-bereavement"]
links = ["research/grief-and-rituals/index.md", "advice/mark-a-loss-with-a-ritual/index.md"]
references = ["prigerson-2009", "lundorff-2017", "johannsen-2019"]

[[terms]]
id = "repetitive-thought"
term = { en = "Repetitive thought", cs = "Opakující se myšlení" }
definition = { en = "Prolonged or repeated thinking about oneself and one's concerns, a broad category that includes rumination, worry, reflection and mental rehearsal. Its consequences depend on the valence of its content, its context and its level of construal: abstract, evaluative thinking tends to be unconstructive, while concrete, process-focused thinking can support problem solving.", cs = "Dlouhotrvající nebo opakované přemýšlení o sobě a svých starostech, široká kategorie zahrnující ruminaci, obavy, reflexi i mentální nácvik. Jeho důsledky závisejí na valenci obsahu, na kontextu a na úrovni konstruálu: abstraktní, hodnoticí myšlení bývá nekonstruktivní, zatímco konkrétní myšlení zaměřené na průběh může podporovat řešení problémů." }
kind = "theoretical"
see_also = ["rumination", "brooding", "self-distancing"]
links = ["research/rumination-and-repetitive-thought/index.md", "advice/interrupt-rumination-with-concrete-steps/index.md"]
references = ["watkins-2008", "watkins-moulds-2005"]

[[terms]]
id = "sleep-deprivation"
term = { en = "Sleep deprivation", cs = "Spánková deprivace" }
definition = { en = "In research, the experimental removal of sleep, usually a full night without sleep, distinguished from partial sleep restriction and from sleep fragmentation by repeated awakenings. Meta-analyses of such experiments in healthy people find reduced positive affect and increased anxiety, with mixed effects on negative affect and emotional reactivity. It differs from insomnia, a persistent difficulty falling or staying asleep.", cs = "Ve výzkumu experimentální odebrání spánku, obvykle celá noc beze spánku, na rozdíl od částečného omezení spánku a od fragmentace spánku opakovaným probouzením. Metaanalýzy takových experimentů u zdravých lidí zjišťují snížený pozitivní afekt a zvýšenou úzkost se smíšenými účinky na negativní afekt a emoční reaktivitu. Liší se od nespavosti, tedy dlouhodobých obtíží s usínáním nebo udržením spánku." }
kind = "empirical"
see_also = ["emotion-regulation", "affect", "allostatic-load"]
links = ["research/sleep-and-emotion-regulation/index.md", "advice/protect-sleep-after-strain/index.md"]
references = ["palmer-2024", "tomaso-2021", "minkel-2012"]

[[terms]]
id = "appraisal"
term = { en = "Appraisal", cs = "Hodnocení (appraisal)" }
definition = { en = "In emotion theory, the evaluation of what an event means for a person's well-being, goals and ability to cope. Appraisal theories hold that such evaluations elicit emotions and differentiate one emotion from another, so the same event can produce anger in one person and sadness in another. Whether appraisals cause emotions or are part of how emotional episodes are described remains debated.", cs = "V teorii emocí posouzení toho, co událost znamená pro blaho, cíle a schopnost zvládání daného člověka. Teorie hodnocení tvrdí, že taková posouzení emoce vyvolávají a odlišují jednu od druhé, takže stejná událost může u jednoho člověka vyvolat hněv a u jiného smutek. Zda hodnocení emoce způsobuje, nebo je součástí toho, jak emoční epizody popisujeme, zůstává sporné." }
kind = "theoretical"
see_also = ["reappraisal", "component-process-model", "emotion"]
links = ["theory/appraisal-theories/index.md", "theory/process-model-of-emotion-regulation/index.md"]
references = ["lazarus-1991", "moors-2013"]

[[terms]]
id = "component-process-model"
term = { en = "Component process model", cs = "Model komponentních procesů" }
definition = { en = "Klaus Scherer's appraisal theory, in which emotion is a dynamic process: a sequence of appraisal checks drives coordinated changes in motivation, physiology and expression, and feeling and verbal labelling follow as further components. The model predicts that the pattern of appraisal outcomes shapes which emotion unfolds. Support for the proposed sequence comes largely from the model's proponents.", cs = "Teorie hodnocení Klause Scherera, podle níž je emoce dynamický proces: sled hodnoticích kontrol vyvolává koordinované změny motivace, fyziologie a výrazu a prožitek a slovní pojmenování následují jako další složky. Model předpovídá, že vzorec výsledků hodnocení určuje, jaká emoce se rozvine. Podpora navrženého sledu pochází převážně od zastánců modelu." }
kind = "theoretical"
see_also = ["appraisal", "emotion", "theory-of-constructed-emotion"]
links = ["theory/appraisal-theories/index.md"]
references = ["scherer-2009", "scherer-moors-2019"]

[[terms]]
id = "situation-selection"
term = { en = "Situation selection", cs = "Výběr situace" }
definition = { en = "The earliest family of strategies in the process model of emotion regulation: choosing to enter or avoid situations according to the emotions they are expected to bring. It can prevent unwanted emotions altogether, but used rigidly it overlaps with avoidance and can narrow a person's life. Situation modification, the next family, changes a situation once one is in it.", cs = "Nejranější rodina strategií v procesním modelu regulace emocí: rozhodnutí vstoupit do situace, nebo se jí vyhnout, podle emocí, které od ní člověk očekává. Může nechtěným emocím zcela předejít, ale při rigidním užívání se překrývá s vyhýbáním a může zúžit život. Úprava situace, další rodina strategií, mění situaci, když už v ní člověk je." }
kind = "theoretical"
see_also = ["attentional-deployment", "response-modulation", "emotion-regulation"]
links = ["theory/process-model-of-emotion-regulation/index.md"]
references = ["gross-1998", "gross-2015"]

[[terms]]
id = "attentional-deployment"
term = { en = "Attentional deployment", cs = "Zaměření pozornosti" }
definition = { en = "A family of emotion regulation strategies in the process model that changes which aspects of a situation receive attention, including distraction and concentration. In a meta-analysis of experiments, distraction was effective in the short term, whereas concentrating on one's feelings was not. Repeatedly directing attention to the cause of distress overlaps with rumination.", cs = "Rodina strategií regulace emocí v procesním modelu, která mění, jakým aspektům situace se věnuje pozornost, včetně rozptýlení a soustředění. V metaanalýze experimentů bylo rozptýlení krátkodobě účinné, zatímco soustředění na vlastní pocity nikoli. Opakované zaměřování pozornosti na příčinu tísně se překrývá s ruminací." }
kind = "theoretical"
see_also = ["situation-selection", "distraction", "rumination"]
links = ["theory/process-model-of-emotion-regulation/index.md"]
references = ["gross-1998", "webb-2012"]

[[terms]]
id = "response-modulation"
term = { en = "Response modulation", cs = "Modulace odpovědi" }
definition = { en = "The latest family of strategies in the process model of emotion regulation, acting on the experiential, behavioural or physiological response once an emotion is under way. Expressive suppression is the most studied example; on this site venting is also read as a form of response modulation. Because it acts after the appraisal, it can change how an emotion is shown without changing what the situation means.", cs = "Nejpozdější rodina strategií v procesním modelu regulace emocí, která působí na prožitkovou, behaviorální nebo fyziologickou odpověď, když už emoce probíhá. Nejprozkoumanějším příkladem je potlačení projevu; tento web chápe jako formu modulace odpovědi i ventilaci. Protože působí až po hodnocení, může změnit, jak se emoce projevuje, aniž by změnila, co situace znamená." }
kind = "theoretical"
see_also = ["expressive-suppression", "venting", "attentional-deployment"]
links = ["theory/process-model-of-emotion-regulation/index.md", "theory/catharsis-theories/index.md"]
references = ["gross-1998", "webb-2012"]

[[terms]]
id = "extended-process-model"
term = { en = "Extended process model", cs = "Rozšířený procesní model" }
definition = { en = "An elaboration of the process model of emotion regulation that treats regulation as a form of valuation and distinguishes three stages: identifying whether to regulate, selecting a strategy, and implementing it, with monitoring throughout. It shifts attention from which strategy is best to how strategies are chosen and adjusted. Laboratory studies of regulation choice are one line of evidence it draws on.", cs = "Rozpracování procesního modelu regulace emocí, které chápe regulaci jako druh hodnocení a rozlišuje tři fáze: identifikaci, zda regulovat, výběr strategie a její provedení, s průběžným monitorováním. Přesouvá pozornost od otázky, která strategie je nejlepší, k tomu, jak se strategie volí a upravují. Jedním z podkladů jsou laboratorní studie volby regulace." }
kind = "theoretical"
see_also = ["situation-selection", "emotion-regulation", "reappraisal"]
links = ["theory/process-model-of-emotion-regulation/index.md"]
references = ["gross-2015", "sheppes-2011"]

[[terms]]
id = "basic-emotion-theory"
term = { en = "Basic emotion theory", cs = "Teorie základních emocí" }
definition = { en = "The view that a set of emotions evolved as distinct families, each with characteristic signals, physiology and eliciting events, and sharing features such as rapid onset and brief duration. Recent versions describe more than twenty emotions expressed in multimodal, dynamic patterns and allow for cultural and contextual influence. Meta-analyses finding no consistent autonomic or neural signature per category are the main challenge to it.", cs = "Pohled, podle něhož se určitá sada emocí vyvinula jako odlišné rodiny, z nichž každá má typické signály, fyziologii a spouštěče a sdílí rysy jako rychlý nástup a krátké trvání. Novější verze popisují více než dvacet emocí vyjadřovaných multimodálními, dynamickými vzorci a připouštějí vliv kultury a kontextu. Hlavní výzvou jsou metaanalýzy, které nenacházejí konzistentní autonomní ani neurální otisk jednotlivých kategorií." }
kind = "theoretical"
see_also = ["theory-of-constructed-emotion", "emotion", "affect"]
links = ["theory/basic-and-constructed-emotion/index.md"]
references = ["ekman-1992", "keltner-2019"]

[[terms]]
id = "theory-of-constructed-emotion"
term = { en = "Theory of constructed emotion", cs = "Teorie konstruovaných emocí" }
definition = { en = "Lisa Feldman Barrett's account in which emotions are not triggered programmes but are constructed in the moment from predictions that combine interoceptive signals, past experience and emotion concepts. It builds on the idea of core affect and predicts variation rather than fixed signatures within emotion categories. Critics question how its broad predictive framework can be falsified.", cs = "Výklad Lisy Feldman Barrettové, podle něhož emoce nejsou spouštěné programy, ale vznikají v daném okamžiku z predikcí, které kombinují interoceptivní signály, minulou zkušenost a pojmy emocí. Navazuje na představu jádrového afektu a předpovídá variabilitu, nikoli pevné otisky uvnitř kategorií emocí. Kritici se ptají, jak lze tento široký prediktivní rámec falzifikovat." }
kind = "theoretical"
see_also = ["basic-emotion-theory", "affect", "emotion"]
links = ["theory/basic-and-constructed-emotion/index.md"]
references = ["barrett-2016", "russell-2003", "lindquist-2012"]

[[terms]]
id = "avoidance-learning"
term = { en = "Avoidance learning", cs = "Učení vyhýbání" }
definition = { en = "Learning to perform behaviours that prevent or end an anticipated aversive outcome. Two-factor theory proposed that fear is first acquired and avoidance is then reinforced by the reduction of fear; later models add expectancies and goal-directed processes. Because successful avoidance prevents disconfirmation, it can maintain fear that would otherwise diminish.", cs = "Učení chování, které předchází očekávanému averzivnímu následku nebo jej ukončuje. Dvoufaktorová teorie navrhla, že se nejprve naučí strach a vyhýbání je pak posilováno jeho snížením; pozdější modely přidávají očekávání a procesy zaměřené na cíl. Protože úspěšné vyhýbání brání vyvrácení obavy, může udržovat strach, který by jinak slábl." }
kind = "theoretical"
see_also = ["negative-reinforcement", "experiential-avoidance", "relief-vs-resolution"]
links = ["theory/learning-avoidance-and-relief/index.md"]
references = ["mowrer-1951", "krypotos-2015"]

[[terms]]
id = "allostasis"
term = { en = "Allostasis", cs = "Alostáza" }
definition = { en = "Physiological regulation that achieves stability through change, anticipating demands and adjusting set points rather than holding them constant. The term was introduced by Sterling and Eyer and later linked by McEwen and colleagues to allostatic load, the cumulative cost of repeated or prolonged activation. Critics argue that the concept adds little to a careful reading of homeostasis.", cs = "Fyziologická regulace, která dosahuje stability změnou: předjímá nároky a upravuje nastavené hodnoty, místo aby je udržovala konstantní. Pojem zavedli Sterling a Eyer a McEwen se spolupracovníky jej později propojil s alostatickou zátěží, kumulativní cenou opakované nebo prodloužené aktivace. Kritici namítají, že oproti pečlivému čtení homeostázy přináší pojem málo nového." }
kind = "theoretical"
see_also = ["allostatic-load", "autonomic-nervous-system", "perseverative-cognition"]
links = ["theory/allostasis-and-stress/index.md"]
references = ["sterling-eyer-1988", "sterling-2012", "day-2005"]

[[terms]]
id = "perseverative-cognition"
term = { en = "Perseverative cognition", cs = "Perseverativní kognice" }
definition = { en = "Repetitive thinking about stressors, such as worry about the future and rumination about the past. The perseverative cognition hypothesis proposes that it prolongs stress-related physiological activation beyond the stressor itself; worry and rumination are associated with enhanced cardiovascular, endocrine and immune activity. Its authors described the support as preliminary.", cs = "Opakované myšlení o stresorech, například obavy z budoucnosti a ruminace o minulosti. Hypotéza perseverativní kognice navrhuje, že prodlužuje fyziologickou stresovou aktivaci za hranice samotného stresoru; obavy a ruminace jsou spojeny se zvýšenou kardiovaskulární, endokrinní a imunitní aktivitou. Autoři označili podporu hypotézy za předběžnou." }
kind = "theoretical"
see_also = ["rumination", "allostasis", "allostatic-load"]
links = ["theory/allostasis-and-stress/index.md"]
references = ["brosschot-2006"]

[[terms]]
id = "interaction-ritual-chain"
term = { en = "Interaction ritual chain", cs = "Řetězec interakčních rituálů" }
definition = { en = "Randall Collins's sociological theory, developed from Durkheim, in which everyday encounters with co-presence, a shared focus and a shared mood work as rituals. Successful rituals generate emotional energy and symbols of membership, failed ones drain energy, and people are drawn towards the encounters that pay off. It is a theoretical framework rather than a measured model.", cs = "Sociologická teorie Randalla Collinse, rozvíjející Durkheima, podle níž každodenní setkání se společnou přítomností, sdíleným zaměřením a sdílenou náladou fungují jako rituály. Úspěšné rituály vytvářejí emoční energii a symboly příslušnosti, neúspěšné energii odčerpávají a lidé tíhnou k setkáním, která se jim vyplácejí. Jde o teoretický rámec, nikoli o měřený model." }
kind = "theoretical"
see_also = ["collective-effervescence", "interpersonal-synchrony", "social-sharing-of-emotion"]
links = ["theory/collective-emotion-and-ritual/index.md"]
references = ["collins-2004", "durkheim-1912"]
