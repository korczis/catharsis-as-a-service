[[commands]]
id = "majordomus-adr"
group = "supervise"
command = "majordomus adr list"
match = "majordomus adr"
source = ".ai/repo/adrs/README.md"
summary.en = "Lists architecture decision records with their status; acceptance stays a person's act (read-only)."
summary.cs = "Vypíše záznamy architektonických rozhodnutí s jejich stavem; přijetí zůstává na člověku (jen pro čtení)."
verified_by = ["pytest:test_majordomus_read_only_commands_used_by_the_case_study"]
