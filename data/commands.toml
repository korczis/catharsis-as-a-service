summary.en = "Lists the effective rule set (vendored baseline plus project rules) with class and the commands that enforce each rule (read-only)."
summary.cs = "Vypíše platnou sadu pravidel (převzatý základ a projektová pravidla) s třídou a příkazy, které každé pravidlo vynucují (jen pro čtení)."
