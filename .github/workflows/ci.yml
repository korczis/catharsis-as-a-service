name: CI

# Runs on pull requests and non-main branches, and is called by pages.yml for main,
# so the gate in front of a deployment is exactly the gate in front of a merge.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Lint commit subjects
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          head="${PR_HEAD:-$GITHUB_SHA}"
          if [ -n "$PR_BASE" ]; then
            range="$PR_BASE..$head"
          elif [ -n "$PUSH_BEFORE" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$head"
          else
            range="$head"
          fi
          scripts/lint-commits.sh "$range"

  supervision:
    name: Majordomus supervision
    runs-on: ubuntu-latest
    env:
      MAJORDOMUS_VERSION: v0.6.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install majordomus (pinned; the installer verifies the SHA-256 of the release)
        run: |
          curl -fsSL https://majordomus.dev/install.sh | sh -s -- --version "$MAJORDOMUS_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: majordomus doctor
        run: |
          git config core.hooksPath .githooks
          majordomus version
          majordomus doctor

  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: scripts/validate.sh
        run: npm run validate
      - name: Upload the validated site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: public
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: End-to-end (subpath preview)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm test
      - name: Upload screenshots and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-local
          path: |
            screenshots
            test-results
          if-no-files-found: ignore
          retention-days: 7
