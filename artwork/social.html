<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Catharsis as a Service — social preview source</title>
<link rel="stylesheet" href="../static/fonts/fonts.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #050505; color: #e9e4d8; }
  .card { display: grid; grid-template-columns: 420px 1fr; height: 630px; }
  .poster { display: block; width: 420px; height: 630px; object-fit: cover; }
  .copy {
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 52px 60px 48px 56px; font-family: 'JetBrains Mono', monospace;
    background: radial-gradient(40rem 30rem at 80% 10%, rgb(142 17 17 / .35), transparent 70%);
  }
  .top { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; letter-spacing: .3em; }
  h1 { margin: 0; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 100px; line-height: .88; text-transform: uppercase; }
  h1 span { display: block; }
  .tm { font-family: 'JetBrains Mono', monospace; font-size: 22px; vertical-align: super; }
  .red { color: #ef2929; }
  .sub { margin: 20px 0 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 24px; letter-spacing: .3em; text-transform: uppercase; }
  .api { display: inline-block; border: 1.5px solid rgb(233 228 216 / .6); padding: 12px 18px; font-size: 22px; }
  .false { margin-top: 12px; font-size: 18px; font-weight: 700; color: #ef2929; }
</style>
</head>
<body>
<div class="card">
  <img class="poster" src="../static/assets/catharsis-as-a-service.png" alt="">
  <div class="copy">
    <div class="top"><span>PRISMATIC</span><span>SIG NIHL</span></div>
    <div>
      <h1><span class="red">Catharsis</span><span>as a Service<span class="tm">™</span></span></h1>
      <p class="sub" data-en="Emotional state transition endpoint" data-cs="Endpoint přechodu emočního stavu">Emotional state transition endpoint</p>
    </div>
    <div>
      <div class="api">&gt; POST /v1/catharsis → <span class="red">200 OK</span></div>
      <div class="false">problem_solved: false</div>
    </div>
  </div>
</div>
<script>
  // Render a locale variant with ?lang=<code>; the API line stays English on purpose.
  const lang = new URLSearchParams(location.search).get('lang') || 'en';
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-en]').forEach((node) => {
    node.textContent = node.dataset[lang] || node.dataset.en;
  });
</script>
</body>
</html>
