# Production URL as reported by `gh api repos/korczis/catharsis-as-a-service/pages --jq .html_url`.
# The Pages workflow asserts that configure-pages returns the same value before deploying.
base_url = "https://korczis.github.io/catharsis-as-a-service"
title = "Catharsis as a Service™"
description = "Catharsis as a Service™ is a digital artifact exploring collective catharsis as an emotional state transition: repetition, synchronization, discharge, temporary relief."
default_language = "en"
# Top-level, not [extra]: Zola's built-in Atom template reads config.author and otherwise
# attributes every entry in both feeds to "Unknown". [languages.cs] rejects the key.
author = "Sig Nihl"

compile_sass = false
minify_html = true
build_search_index = false
generate_feeds = true
feed_filenames = ["atom.xml"]
generate_sitemap = true
generate_robots_txt = true
taxonomies = [{ name = "tags", feed = true }]

[markdown]
smart_punctuation = true

[link_checker]
internal_level = "error"
external_level = "warn"

[extra]
author = "Sig Nihl"
repo_url = "https://github.com/korczis/catharsis-as-a-service"
theme_color = "#050505"
year = 2026
locales = ["en", "cs"]

# Pages whose URL differs between languages (a localized slug). The sitemap uses this map for
# alternates; page heads read Zola's own translation links.
[[extra.localized_paths]]
en = "glossary/"
cs = "slovnik/"

[[extra.localized_paths]]
en = "models/"
cs = "modely/"

[[extra.localized_paths]]
en = "search/"
cs = "hledat/"

[[extra.localized_paths]]
en = "case-study/"
cs = "pripadova-studie/"

[[extra.nav]]
key = "nav_experience"
anchor = "experience"

[[extra.nav]]
key = "nav_diagnostic"
anchor = "diagnostic"

[[extra.nav]]
key = "nav_artifact"
anchor = "artifact"

[[extra.nav]]
key = "nav_archive"
anchor = "archive"

